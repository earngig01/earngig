
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | EarnGig</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #100b20;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container { width: 100%; max-width: 430px; }
    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 22px;
    }
    .logo span { color: #cafa70; }
    .card {
      background: #1c1530;
      border: 1px solid #40315c;
      border-radius: 18px;
      padding: 30px 25px;
    }
    h1 { font-size: 26px; margin-bottom: 8px; }
    .subtitle { color: #bcb3ce; font-size: 14px; margin-bottom: 25px; }
    .field { margin-bottom: 18px; }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #e5def1;
    }
    input {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid #51416d;
      background: #120d21;
      color: white;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: #cafa70; }
    input::placeholder { color: #817792; }
    .forgot {
      display: block;
      text-align: right;
      color: #cafa70;
      text-decoration: none;
      font-size: 13px;
      margin: -5px 0 22px;
    }
    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #cafa70;
      color: #171323;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .signup {
      text-align: center;
      margin-top: 22px;
      color: #bcb3ce;
      font-size: 14px;
    }
    a { color: #cafa70; text-decoration: none; }
    .message {
      display: none;
      padding: 12px;
      margin-bottom: 16px;
      border-radius: 8px;
      background: #51242c;
      color: #ffd5d9;
      font-size: 13px;
      line-height: 1.5;
    }
    @media (max-width: 420px) {
      .card { padding: 25px 18px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo">Earn<span>Gig</span></div>

    <section class="card">
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to continue to your EarnGig account.</p>

      <div id="message" class="message"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" placeholder="Enter your email"
            autocomplete="email" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Enter your password"
            autocomplete="current-password" required>
        </div>

        <a class="forgot" href="forgot-password.html">Forgot password?</a>

        <button type="submit">Log In</button>
      </form>

      <p class="signup">
        Don't have an account? <a href="register.html">Create one</a>
      </p>
    </section>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const message = document.getElementById("message");
      message.textContent =
        "Login will be activated when the EarnGig backend and authentication system are connected.";
      message.style.display = "block";
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart | EarnGig</title>
<style>
:root{
  --purple:#6427c7;
  --deep:#48159b;
  --light:#f2ebff;
  --gold:#d6a62e;
  --text:#29243a;
  --muted:#777286;
  --border:#ece8f3;
  --bg:#faf9fc;
  --green:#168653;
  --red:#c43e3e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
a{text-decoration:none;color:inherit}
button{font:inherit;cursor:pointer}
.topbar{
  height:70px;background:white;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 5%;position:sticky;top:0;z-index:10
}
.brand{display:flex;align-items:center;gap:8px;color:var(--purple);font-size:23px;font-weight:800}
.brand svg{width:25px;height:25px}
.nav{display:flex;align-items:center;gap:20px;font-size:12px;font-weight:700;color:#625d71}
.nav a:hover{color:var(--purple)}
.nav .active{color:var(--purple)}
.cart-count{background:var(--light);color:var(--purple);padding:9px 12px;border-radius:8px}
.container{max-width:1150px;margin:auto;padding:32px 20px 55px}
.heading{margin-bottom:25px}
.heading h1{font-size:27px;margin:0 0 7px}
.heading p{font-size:12px;color:var(--muted);margin:0;line-height:1.6}
.cart-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
.seller-group{background:white;border:1px solid var(--border);border-radius:13px;margin-bottom:15px;overflow:hidden}
.seller-header{padding:16px 18px;background:#fcfbfe;border-bottom:1px solid var(--border)}
.seller-header-top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.seller-name{font-size:13px;font-weight:800;color:var(--purple)}
.seller-location{font-size:10px;color:var(--muted);margin-top:5px}
.seller-items{padding:0 18px}
.cart-item{display:grid;grid-template-columns:85px minmax(0,1fr) auto;gap:14px;padding:17px 0;border-bottom:1px solid #f0edf4;align-items:center}
.cart-item:last-child{border-bottom:0}
.item-image{width:85px;height:85px;border-radius:9px;background:#f1eef6;object-fit:cover}
.item-name{font-size:12px;font-weight:800;line-height:1.5;margin-bottom:6px}
.item-price{font-size:13px;color:var(--purple);font-weight:800}
.item-stock{font-size:10px;color:var(--muted);margin-top:5px}
.item-controls{display:flex;align-items:center;gap:6px;margin-top:10px}
.qty-control{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.qty-control button{border:0;background:#f7f4fb;color:var(--purple);width:27px;height:27px;font-weight:800}
.qty-control span{min-width:30px;text-align:center;display:grid;place-items:center;font-size:11px}
.remove-btn{border:0;background:none;color:var(--red);font-size:10px;font-weight:700;padding:7px}
.item-total{text-align:right;font-size:12px;font-weight:800;white-space:nowrap}
.summary{background:white;border:1px solid var(--border);border-radius:13px;padding:20px;position:sticky;top:90px}
.summary h2{font-size:16px;margin:0 0 17px}
.summary-row{display:flex;justify-content:space-between;gap:12px;font-size:11px;margin:14px 0;color:#625d71}
.summary-row strong{color:var(--text)}
.summary-row.total{border-top:1px solid var(--border);padding-top:15px;font-size:13px;font-weight:800;color:var(--text)}
.summary-row.total strong{font-size:17px;color:var(--purple)}
.service-note{background:#f5f0ff;border:1px solid #e9defa;border-radius:9px;padding:12px;font-size:10px;line-height:1.7;color:#59427e;margin:16px 0}
.delivery-note{background:#fff8e8;border:1px solid #f1e3c2;border-radius:9px;padding:12px;font-size:10px;line-height:1.7;color:#785b1c;margin:12px 0}
.checkout-btn{display:block;width:100%;border:0;background:var(--purple);color:white;border-radius:9px;padding:15px;font-size:12px;font-weight:800;text-align:center;margin-top:17px}
.checkout-btn:hover{background:var(--deep)}
.continue-link{display:block;text-align:center;color:var(--purple);font-size:11px;font-weight:700;margin-top:14px}
.secure-note{text-align:center;font-size:9px;color:var(--muted);line-height:1.6;margin-top:15px}
.empty{background:white;border:1px dashed #d9d1e4;border-radius:13px;padding:50px 20px;text-align:center}
.empty-icon{font-size:45px;margin-bottom:12px}
.empty h2{font-size:18px;margin:0 0 8px}
.empty p{font-size:11px;color:var(--muted);line-height:1.7;margin:0 0 18px}
.empty a{display:inline-block;background:var(--purple);color:white;border-radius:8px;padding:12px 17px;font-size:11px;font-weight:800}
.footer{border-top:1px solid var(--border);background:white;padding:25px 5%;text-align:center;color:var(--muted);font-size:10px}
.footer a{color:var(--purple);margin:0 8px}
@media(max-width:850px){
  .cart-layout{grid-template-columns:1fr}
  .summary{position:static}
}
@media(max-width:600px){
  .topbar{height:62px;padding:0 14px}
  .brand{font-size:20px}
  .nav{gap:10px;font-size:10px}
  .nav a:not(.cart-count){display:none}
  .container{padding:23px 13px 40px}
  .heading h1{font-size:23px}
  .cart-item{grid-template-columns:68px minmax(0,1fr);gap:10px}
  .item-image{width:68px;height:68px}
  .item-total{grid-column:2;text-align:left}
  .seller-items{padding:0 12px}
  .seller-header{padding:13px}
}
</style>
</head>
<body>

<header class="topbar">
<a href="dashboard.html" class="brand">
<svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
<path d="M9 19L20 29L31 9L43 29L55 19L50 46H14L9 19Z" fill="#D6A62E" stroke="#B98716" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M14 51H50" stroke="#D6A62E" stroke-width="5" stroke-linecap="round"/>
<circle cx="9" cy="17" r="4" fill="#E9C35D"/>
<circle cx="31" cy="8" r="4" fill="#E9C35D"/>
<circle cx="55" cy="17" r="4" fill="#E9C35D"/>
</svg>
EarnGig
</a>
<nav class="nav">
<a href="dashboard.html">Dashboard</a>
<a href="marketplace.html">Marketplace</a>
<a href="my-orders.html">My Orders</a>
<a href="cart.html" class="active cart-count">🛒 Cart <span id="headerCount">0</span></a>
</nav>
</header>

<main class="container">
<div class="heading">
<h1>My Shopping Cart</h1>
<p>Review your selected products and sellers before proceeding to checkout.</p>
</div>

<div id="cartContent"></div>
</main>

<footer class="footer">
<p>EarnGig Marketplace</p>
<a href="about.html">About</a>
<a href="help.html">Help</a>
<a href="terms.html">Terms</a>
<a href="privacy.html">Privacy</a>
<a href="contact.html">Contact</a>
</footer>

<script>
const CART_KEY = "earngig_cart";
const PRODUCTS_KEY = "earngig_seller_products";
const MARKETPLACE_KEY = "earngig_marketplace_products";

function readJSON(key,fallback){
  try{
    const value = JSON.parse(localStorage.getItem(key));
    return value ?? fallback;
  }catch(error){
    return fallback;
  }
}

function saveCart(cart){
  localStorage.setItem(CART_KEY,JSON.stringify(cart));
}

function money(value){
  return "₦" + (Number(value)||0).toLocaleString("en-NG",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

function getCart(){
  const cart = readJSON(CART_KEY,[]);
  return Array.isArray(cart) ? cart : [];
}

function getAvailableProducts(){
  const marketplace = readJSON(MARKETPLACE_KEY,null);
  const products = Array.isArray(marketplace)
    ? marketplace
    : readJSON(PRODUCTS_KEY,[]);

  return Array.isArray(products) ? products : [];
}

function getProductStock(item){
  const products = getAvailableProducts();
  const id = String(item.productId || item.id || "");
  const product = products.find(p=>
    String(p.id || p.productId || p.reference || "") === id
  );

  if(!product) return null;
  return Number(product.stock ?? product.quantity ?? 0);
}

function updateHeaderCount(){
  const cart = getCart();
  const count = cart.reduce((sum,item)=>sum+Math.max(1,Number(item.quantity)||1),0);
  document.getElementById("headerCount").textContent = count;
}

function sellerKey(item){
  return String(
    item.sellerId ||
    item.sellerEmail ||
    item.vendorId ||
    item.vendorEmail ||
    item.sellerName ||
    "unknown-seller"
  ).trim().toLowerCase();
}

function groupCart(cart){
  const groups = new Map();

  cart.forEach((item,index)=>{
    const key = sellerKey(item);

    if(!groups.has(key)){
      groups.set(key,{
        key,
        sellerName:item.sellerName || item.storeName || "EarnGig Seller",
        location:item.location || item.sellerLocation || "",
        items:[]
      });
    }

    groups.get(key).items.push({...item,_index:index});
  });

  return Array.from(groups.values());
}

function updateQuantity(index,change){
  const cart = getCart();
  if(!cart[index]) return;

  const item = cart[index];
  const newQuantity = Math.max(1,Number(item.quantity || 1)+change);
  const stock = getProductStock(item);

  if(stock !== null && newQuantity > stock){
    alert("Only " + stock + " units are currently available.");
    return;
  }

  item.quantity = newQuantity;
  saveCart(cart);
  renderCart();
}

function removeItem(index){
  const cart = getCart();
  if(!cart[index]) return;

  cart.splice(index,1);
  saveCart(cart);
  renderCart();
}

function createItem(group,item){
  const row = document.createElement("div");
  row.className = "cart-item";

  const image = document.createElement("img");
  image.className = "item-image";
  image.src = item.image || item.imageUrl || "";
  image.alt = item.name || "Product";
  image.onerror = ()=>{
    image.style.display = "none";
  };

  const details = document.createElement("div");

  const name = document.createElement("div");
  name.className = "item-name";
  name.textContent = item.name || item.title || "Product";

  const price = document.createElement("div");
  price.className = "item-price";
  price.textContent = money(item.price);

  const stock = getProductStock(item);
  const stockLabel = document.createElement("div");
  stockLabel.className = "item-stock";
  stockLabel.textContent = stock === null
    ? "Stock availability will be checked at checkout"
    : stock + " units available";

  const controls = document.createElement("div");
  controls.className = "item-controls";

  const quantity = document.createElement("div");
  quantity.className = "qty-control";

  const minus = document.createElement("button");
  minus.type = "button";
  minus.textContent = "−";
  minus.setAttribute("aria-label","Decrease quantity");
  minus.addEventListener("click",()=>updateQuantity(item._index,-1));

  const amount = document.createElement("span");
  amount.textContent = Math.max(1,Number(item.quantity)||1);

  const plus = document.createElement("button");
  plus.type = "button";
  plus.textContent = "+";
  plus.setAttribute("aria-label","Increase quantity");
  plus.addEventListener("click",()=>updateQuantity(item._index,1));

  quantity.append(minus,amount,plus);

  const remove = document.createElement("button");
  remove.type = "button";
  remove.className = "remove-btn";
  remove.textContent = "Remove";
  remove.addEventListener("click",()=>removeItem(item._index));

  controls.append(quantity,remove);
  details.append(name,price,stockLabel,controls);

  const total = document.createElement("div");
  total.className = "item-total";
  total.textContent = money(Number(item.price)*Math.max(1,Number(item.quantity)||1));

  row.append(image,details,total);
  return row;
}

function renderCart(){
  const cart = getCart();
  const container = document.getElementById("cartContent");

  updateHeaderCount();
  container.innerHTML = "";

  if(!cart.length){
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🛒</div>
        <h2>Your cart is empty</h2>
        <p>You haven't added any products yet. Explore the Marketplace to find something you love.</p>
        <a href="marketplace.html">Explore Marketplace</a>
      </div>
    `;
    return;
  }

  const groups = groupCart(cart);
  const layout = document.createElement("div");
  layout.className = "cart-layout";

  const list = document.createElement("div");
  const subtotal = cart.reduce((sum,item)=>
    sum+(Number(item.price)||0)*Math.max(1,Number(item.quantity)||1),0
  );

  groups.forEach(group=>{
    const card = document.createElement("section");
    card.className = "seller-group";

    const header = document.createElement("div");
    header.className = "seller-header";

    const top = document.createElement("div");
    top.className = "seller-header-top";

    const seller = document.createElement("div");
    const sellerName = document.createElement("a");
    sellerName.className = "seller-name";
    sellerName.textContent = group.sellerName;

    const firstItem = group.items[0];
    const storeParams = new URLSearchParams();

    if(firstItem.sellerId) storeParams.set("seller",firstItem.sellerId);
    else if(firstItem.sellerEmail) storeParams.set("email",firstItem.sellerEmail);

    sellerName.href = "storefront.html" +
      (storeParams.toString() ? "?" + storeParams.toString() : "");

    const location = document.createElement("div");
    location.className = "seller-location";
    location.textContent = "📍 " + (group.location || "Seller location not provided");

    seller.append(sellerName,location);

    const itemCount = document.createElement("span");
    itemCount.style.cssText = "font-size:10px;color:#777286;white-space:nowrap";
    itemCount.textContent = group.items.length + " product" + (group.items.length===1?"":"s");

    top.append(seller,itemCount);
    header.appendChild(top);

    const items = document.createElement("div");
    items.className = "seller-items";

    group.items.forEach(item=>{
      items.appendChild(createItem(group,item));
    });

    card.append(header,items);
    list.appendChild(card);
  });

  const summary = document.createElement("aside");
  summary.className = "summary";

  summary.innerHTML = `
    <h2>Order Summary</h2>
    <div class="summary-row">
      <span>Products subtotal</span>
      <strong>${money(subtotal)}</strong>
    </div>
    <div class="summary-row">
      <span>EarnGig service charge</span>
      <strong>₦100–₦1,000</strong>
    </div>
    <div class="summary-row">
      <span>Delivery fee</span>
      <strong>Not included</strong>
    </div>
    <div class="summary-row total">
      <span>Product subtotal</span>
      <strong>${money(subtotal)}</strong>
    </div>
    <div class="service-note">
      <strong>Marketplace service charge</strong><br>
      EarnGig adds a service charge of between ₦100 and ₦1,000, based on the applicable purchase-value grading. The exact charge will be calculated and shown before you confirm payment at checkout.
    </div>
    <div class="delivery-note">
      <strong>Delivery is separate</strong><br>
      Negotiate your delivery fee directly with the delivery rider. It is not included in this cart total.
    </div>
    <button class="checkout-btn" id="checkoutButton">Proceed to Checkout →</button>
    <a href="marketplace.html" class="continue-link">Continue Shopping</a>
    <div class="secure-note">Your payment is made through EarnGig. Seller proceeds remain pending until delivery is confirmed by both parties.</div>
  `;

  layout.append(list,summary);
  container.appendChild(layout);

  document.getElementById("checkoutButton").addEventListener("click",()=>{
    window.location.href = "checkout.html";
  });
}

renderCart();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Purchases | EarnGig</title>
<style>
:root{
  --purple:#6427c7;--deep:#48159b;--light:#f2ebff;
  --gold:#d6a62e;--text:#29243a;--muted:#777286;
  --border:#ece8f3;--bg:#faf9fc;--green:#168653;
  --red:#c43e3e;--orange:#bd7415;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
a{text-decoration:none;color:inherit}
button{font:inherit;cursor:pointer}
.topbar{
  height:70px;background:white;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 5%;position:sticky;top:0;z-index:10
}
.brand{display:flex;align-items:center;gap:8px;color:var(--purple);font-size:23px;font-weight:800}
.brand svg{width:25px;height:25px}
.nav{display:flex;align-items:center;gap:19px;font-size:12px;font-weight:700;color:#625d71}
.nav a:hover,.nav a.active{color:var(--purple)}
.container{max-width:1150px;margin:auto;padding:30px 20px 55px}
.heading{margin-bottom:22px}
.heading h1{font-size:27px;margin:0 0 7px}
.heading p{font-size:12px;color:var(--muted);margin:0;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{background:white;border:1px solid var(--border);border-radius:11px;padding:15px}
.stat span{font-size:10px;color:var(--muted);font-weight:700}
.stat strong{display:block;font-size:22px;margin-top:8px}
.filters{display:flex;gap:8px;overflow-x:auto;margin-bottom:17px;padding-bottom:5px}
.filter{
  border:1px solid var(--border);background:white;color:#625d71;
  border-radius:25px;padding:10px 14px;font-size:10px;font-weight:700;white-space:nowrap
}
.filter.active,.filter:hover{background:var(--light);color:var(--purple);border-color:#d9c8f1}
.order-card{background:white;border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden}
.order-header{padding:15px 17px;background:#fcfbfe;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.order-reference{font-size:11px;font-weight:800}
.order-date{font-size:10px;color:var(--muted);margin-top:5px}
.status{font-size:9px;font-weight:800;padding:7px 10px;border-radius:20px;background:#f1eff5;color:#625d71}
.status.accepted,.status.processing{background:#f0eaff;color:var(--purple)}
.status.dispatched,.status.out-for-delivery{background:#fff4e5;color:var(--orange)}
.status.completed{background:#e8f7ef;color:var(--green)}
.status.cancelled,.status.rejected,.status.disputed{background:#fff0f0;color:var(--red)}
.order-body{padding:16px 17px}
.vendor-line{font-size:11px;margin-bottom:12px}
.vendor-line a{color:var(--purple);font-weight:800}
.items{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:11px}
.item img{width:54px;height:54px;border-radius:8px;object-fit:cover;background:#f0edf5}
.item-info{flex:1;min-width:0}
.item-info strong{display:block;font-size:11px;margin-bottom:5px}
.item-info span{font-size:9px;color:var(--muted)}
.item-price{font-size:11px;font-weight:800;white-space:nowrap}
.order-footer{border-top:1px solid var(--border);margin-top:15px;padding-top:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.order-total{font-size:10px;color:var(--muted)}
.order-total strong{display:block;color:var(--purple);font-size:15px;margin-top:5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:10px 13px;font-size:10px;font-weight:800;display:inline-block;text-align:center}
.btn.primary{background:var(--purple);color:white}
.btn.light{background:var(--light);color:var(--purple)}
.btn.danger{background:#fff0f0;color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.empty{background:white;border:1px dashed #d9d1e4;border-radius:12px;padding:45px 20px;text-align:center}
.empty h2{font-size:17px;margin:0 0 8px}
.empty p{font-size:11px;color:var(--muted);line-height:1.7;margin:0 0 15px}
.empty a{display:inline-block;background:var(--purple);color:white;padding:11px 16px;border-radius:8px;font-size:10px;font-weight:800}
.modal-backdrop{display:none;position:fixed;inset:0;background:#17102088;z-index:30;padding:20px;overflow:auto}
.modal-backdrop.show{display:flex;align-items:center;justify-content:center}
.modal{background:white;border-radius:14px;width:100%;max-width:550px;padding:22px;max-height:90vh;overflow:auto}
.modal h2{font-size:18px;margin:0 0 15px}
.modal p{font-size:11px;color:var(--muted);line-height:1.7}
.modal label{display:block;font-size:10px;font-weight:800;margin:13px 0 6px}
.modal textarea,.modal select{width:100%;border:1px solid var(--border);border-radius:8px;padding:11px;font:12px Arial;color:var(--text)}
.modal textarea{min-height:85px;resize:vertical}
.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
.detail-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #f0edf4;padding:10px 0;font-size:11px}
.detail-row span{color:var(--muted)}
.detail-row strong{text-align:right}
.warning{background:#fff8e8;border:1px solid #f1e3c2;border-radius:9px;padding:12px;font-size:10px;color:#785b1c;line-height:1.7;margin:13px 0}
.footer{border-top:1px solid var(--border);background:white;padding:25px 5%;text-align:center;color:var(--muted);font-size:10px}
.footer a{color:var(--purple);margin:0 8px}
@media(max-width:750px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .nav{gap:10px;font-size:10px}
  .nav a:not(.active){display:none}
}
@media(max-width:600px){
  .topbar{height:62px;padding:0 14px}
  .brand{font-size:20px}
  .container{padding:23px 13px 40px}
  .heading h1{font-size:23px}
  .order-header,.order-body{padding:13px}
  .order-footer{align-items:flex-start}
  .actions{width:100%}
  .actions .btn{flex:1}
}
</style>
</head>
<body>

<header class="topbar">
  <a href="dashboard.html" class="brand">
    <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <path d="M9 19L20 29L31 9L43 29L55 19L50 46H14L9 19Z" fill="#D6A62E" stroke="#B98716" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M14 51H50" stroke="#D6A62E" stroke-width="5" stroke-linecap="round"/>
      <circle cx="9" cy="17" r="4" fill="#E9C35D"/>
      <circle cx="31" cy="8" r="4" fill="#E9C35D"/>
      <circle cx="55" cy="17" r="4" fill="#E9C35D"/>
    </svg>
    EarnGig
  </a>
  <nav class="nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="marketplace.html">Marketplace</a>
    <a href="cart.html">Cart</a>
    <a href="buyer-orders.html" class="active">My Purchases</a>
  </nav>
</header>

<main class="container">
  <div class="heading">
    <h1>My Purchases</h1>
    <p>Track your orders, see seller updates and confirm when your packages arrive.</p>
  </div>

  <section class="stats">
    <div class="stat"><span>All Orders</span><strong id="allCount">0</strong></div>
    <div class="stat"><span>Awaiting Delivery</span><strong id="pendingCount">0</strong></div>
    <div class="stat"><span>Out for Delivery</span><strong id="deliveryCount">0</strong></div>
    <div class="stat"><span>Completed</span><strong id="completedCount">0</strong></div>
  </section>

  <div class="filters" id="filters">
    <button class="filter active" data-filter="all">All Orders</button>
    <button class="filter" data-filter="pending">Pending</button>
    <button class="filter" data-filter="accepted">Accepted</button>
    <button class="filter" data-filter="processing">Preparing</button>
    <button class="filter" data-filter="dispatched">Out for Delivery</button>
    <button class="filter" data-filter="completed">Completed</button>
    <button class="filter" data-filter="cancelled">Cancelled</button>
  </div>

  <div id="ordersList"></div>
</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalContent"></div>
</div>

<footer class="footer">
  <p>EarnGig Marketplace</p>
  <a href="help.html">Help</a>
  <a href="support.html">Support</a>
  <a href="contact.html">Contact</a>
</footer>

<script>
const ORDERS_KEY = "earngig_buyer_orders";
const EMAIL_KEY = "earngig_current_user_email";

let activeFilter = "all";

function readOrders(){
  try{
    const value = JSON.parse(localStorage.getItem(ORDERS_KEY) || "[]");
    return Array.isArray(value) ? value : [];
  }catch(error){
    return [];
  }
}

function saveOrders(orders){
  localStorage.setItem(ORDERS_KEY,JSON.stringify(orders));
}

function money(value){
  return "₦"+(Number(value)||0).toLocaleString("en-NG",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

function currentEmail(){
  return (localStorage.getItem(EMAIL_KEY)||"").trim().toLowerCase();
}

function getMyOrders(){
  const orders = readOrders();
  const email = currentEmail();

  if(!email) return orders;

  return orders.filter(order=>
    String(order.buyerEmail || order.delivery?.email || "")
      .trim().toLowerCase() === email
  );
}

function normalStatus(order){
  const status = String(order.status || order.orderStatus || "pending").toLowerCase();

  if(["new","awaiting_acceptance","pending","awaiting_vendor"].includes(status))return "pending";
  if(["accepted","confirmed"].includes(status))return "accepted";
  if(["processing","preparing","packed"].includes(status))return "processing";
  if(["dispatched","out_for_delivery","shipped"].includes(status))return "dispatched";
  if(["completed","delivered","received"].includes(status))return "completed";
  if(["cancelled","canceled"].includes(status))return "cancelled";
  if(["rejected"].includes(status))return "rejected";
  if(["disputed"].includes(status))return "disputed";

  return status;
}

function statusLabel(status){
  const labels={
    pending:"Awaiting Vendor Acceptance",
    accepted:"Accepted",
    processing:"Being Prepared",
    dispatched:"Out for Delivery",
    completed:"Completed",
    cancelled:"Cancelled",
    rejected:"Rejected",
    disputed:"Under Dispute"
  };
  return labels[status] || status.replace(/_/g," ").toUpperCase();
}

function getItems(order){
  if(Array.isArray(order.items))return order.items;
  if(order.product)return [order.product];
  return [];
}

function orderTotal(order){
  if(order.total !== undefined)return Number(order.total)||0;
  if(order.totalAmount !== undefined)return Number(order.totalAmount)||0;

  const items=getItems(order);
  const subtotal=items.reduce((sum,item)=>
    sum+(Number(item.price)||0)*Math.max(1,Number(item.quantity)||1),0
  );

  return subtotal+(Number(order.serviceCharge)||250);
}

function dateText(value){
  if(!value)return "Date unavailable";
  const date=new Date(value);
  return Number.isNaN(date.getTime())?"Date unavailable":date.toLocaleString("en-NG");
}

function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,char=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[char]);
}

function renderStats(orders){
  document.getElementById("allCount").textContent=orders.length;

  document.getElementById("pendingCount").textContent=orders.filter(o=>
    ["pending","accepted","processing"].includes(normalStatus(o))
  ).length;

  document.getElementById("deliveryCount").textContent=orders.filter(o=>
    normalStatus(o)==="dispatched"
  ).length;

  document.getElementById("completedCount").textContent=orders.filter(o=>
    normalStatus(o)==="completed"
  ).length;
}

function renderOrders(){
  const orders=getMyOrders();
  renderStats(orders);

  const filtered=activeFilter==="all"
    ?orders
    :orders.filter(order=>normalStatus(order)===activeFilter);

  const container=document.getElementById("ordersList");
  container.innerHTML="";

  if(!filtered.length){
    container.innerHTML=`
      <div class="empty">
        <h2>No orders to show</h2>
        <p>Your marketplace purchases will appear here after checkout.</p>
        <a href="marketplace.html">Explore Marketplace</a>
      </div>`;
    return;
  }

  filtered.sort((a,b)=>
    new Date(b.createdAt||b.date||0)-new Date(a.createdAt||a.date||0)
  );

  filtered.forEach(order=>{
    const status=normalStatus(order);
    const items=getItems(order);
    const reference=order.reference||order.orderReference||order.id||"Order";
    const seller=order.sellerName||order.vendorName||"EarnGig Seller";

    const card=document.createElement("article");
    card.className="order-card";

    const header=document.createElement("div");
    header.className="order-header";
    header.innerHTML=`
      <div>
        <div class="order-reference">Order: ${escapeHTML(reference)}</div>
        <div class="order-date">${escapeHTML(dateText(order.createdAt||order.date))}</div>
      </div>
      <span class="status ${escapeHTML(status)}">${escapeHTML(statusLabel(status))}</span>
    `;

    const body=document.createElement("div");
    body.className="order-body";

    const vendor=document.createElement("div");
    vendor.className="vendor-line";
    vendor.innerHTML=`Seller: <strong>${escapeHTML(seller)}</strong>`;

    const itemContainer=document.createElement("div");
    itemContainer.className="items";

    items.forEach(item=>{
      const row=document.createElement("div");
      row.className="item";

      const img=document.createElement("img");
      img.src=item.image||item.imageUrl||"";
      img.alt=item.name||"Product";
      img.onerror=()=>img.style.visibility="hidden";

      const info=document.createElement("div");
      info.className="item-info";

      const name=document.createElement("strong");
      name.textContent=item.name||item.title||"Product";

      const quantity=document.createElement("span");
      quantity.textContent="Quantity: "+Math.max(1,Number(item.quantity)||1);

      info.append(name,quantity);

      const price=document.createElement("div");
      price.className="item-price";
      price.textContent=money(Number(item.price)*Math.max(1,Number(item.quantity)||1));

      row.append(img,info,price);
      itemContainer.appendChild(row);
    });

    const footer=document.createElement("div");
    footer.className="order-footer";

    const total=document.createElement("div");
    total.className="order-total";
    total.innerHTML=`Order total<strong>${money(orderTotal(order))}</strong>`;

    const actions=document.createElement("div");
    actions.className="actions";

    const details=document.createElement("button");
    details.className="btn light";
    details.textContent="View Details";
    details.addEventListener("click",()=>showDetails(reference));
    actions.appendChild(details);

    // Track this specific vendor order
    const track=document.createElement("a");
    track.className="btn primary";
    track.textContent="Track Delivery";
    track.href="delivery-tracking.html?order="+encodeURIComponent(reference);
    actions.appendChild(track);

    if(status==="dispatched"){
      const confirmBtn=document.createElement("button");
      confirmBtn.className="btn primary";
      confirmBtn.textContent="Confirm Receipt";
      confirmBtn.addEventListener("click",()=>confirmReceipt(reference));
      actions.appendChild(confirmBtn);
    }

    if(!["completed","cancelled","rejected"].includes(status)){
      const report=document.createElement("button");
      report.className="btn danger";
      report.textContent="Report Issue";
      report.addEventListener("click",()=>showReport(reference));
      actions.appendChild(report);
    }

    footer.append(total,actions);
    body.append(vendor,itemContainer,footer);
    card.append(header,body);
    container.appendChild(card);
  });
}

function findOrder(reference){
  return readOrders().find(order=>
    String(order.reference||order.orderReference||order.id||"")===String(reference)
  );
}

function updateOrder(reference,updates){
  const orders=readOrders();
  const index=orders.findIndex(order=>
    String(order.reference||order.orderReference||order.id||"")===String(reference)
  );

  if(index===-1)return false;

  orders[index]={...orders[index],...updates};
  saveOrders(orders);
  renderOrders();
  return true;
}

function confirmReceipt(reference){
  const order=findOrder(reference);
  if(!order)return;

  if(normalStatus(order)!=="dispatched"){
    alert("Only dispatched orders can be confirmed as received.");
    return;
  }

  const accepted=confirm(
    "Please confirm that you have physically received this package and checked your order. This confirmation may release the seller's pending proceeds."
  );

  if(!accepted)return;

  updateOrder(reference,{
    buyerReceived:true,
    buyerConfirmedAt:new Date().toISOString(),
    buyerConfirmationStatus:"confirmed",
    status:"buyer_received",
    orderStatus:"buyer_received"
  });

  alert("Your receipt confirmation has been recorded. The order will be completed when the seller also confirms successful delivery.");
}

function showDetails(reference){
  const order=findOrder(reference);
  if(!order)return;

  const delivery=order.delivery||{};
  const status=normalStatus(order);
  const backdrop=document.getElementById("modalBackdrop");
  const content=document.getElementById("modalContent");

  content.innerHTML=`
    <h2>Order Details</h2>
    <div class="detail-row"><span>Order reference</span><strong>${escapeHTML(reference)}</strong></div>
    <div class="detail-row"><span>Seller</span><strong>${escapeHTML(order.sellerName||order.vendorName||"EarnGig Seller")}</strong></div>
    <div class="detail-row"><span>Order status</span><strong>${escapeHTML(statusLabel(status))}</strong></div>
    <div class="detail-row"><span>Payment status</span><strong>${escapeHTML(order.paymentStatus||"Not available")}</strong></div>
    <div class="detail-row"><span>Order total</span><strong>${money(orderTotal(order))}</strong></div>
    <div class="detail-row"><span>Delivery recipient</span><strong>${escapeHTML(delivery.fullName||"Not provided")}</strong></div>
    <div class="detail-row"><span>Phone</span><strong>${escapeHTML(delivery.phone||"Not provided")}</strong></div>
    <div class="detail-row"><span>Delivery address</span><strong>${escapeHTML(delivery.address||"Not provided")}</strong></div>
    <div class="detail-row"><span>City / State</span><strong>${escapeHTML([delivery.city,delivery.state].filter(Boolean).join(", ")||"Not provided")}</strong></div>
    <div class="warning">Keep your order reference. Contact EarnGig Support if your order is delayed, incomplete or disputed.</div>
    <div class="modal-actions"><button class="btn light" onclick="closeModal()">Close</button></div>
  `;

  backdrop.classList.add("show");
}

function showReport(reference){
  const content=document.getElementById("modalContent");

  content.innerHTML=`
    <h2>Report an Order Issue</h2>
    <p>Order reference: <strong>${escapeHTML(reference)}</strong></p>
    <p>Explain what happened. EarnGig support can review the order and contact the relevant party.</p>
    <label for="reportReason">Issue type</label>
    <select id="reportReason">
      <option value="not_received">I have not received my order</option>
      <option value="wrong_item">I received the wrong product</option>
      <option value="damaged">The product arrived damaged</option>
      <option value="seller_not_responding">The seller is not responding</option>
      <option value="other">Other issue</option>
    </select>
    <label for="reportDescription">Describe the issue</label>
    <textarea id="reportDescription" maxlength="1000" placeholder="Provide details about your issue..." required></textarea>
    <div class="modal-actions">
      <button class="btn light" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="submitReport('${escapeHTML(reference)}')">Submit Report</button>
    </div>
  `;

  document.getElementById("modalBackdrop").classList.add("show");
}

function submitReport(reference){
  const description=document.getElementById("reportDescription").value.trim();
  const reason=document.getElementById("reportReason").value;

  if(!description){
    alert("Please describe the problem before submitting.");
    return;
  }

  const reports=(()=>{
    try{
      const value=JSON.parse(localStorage.getItem("earngig_order_disputes")||"[]");
      return Array.isArray(value)?value:[];
    }catch(error){
      return [];
    }
  })();

  reports.push({
    id:"DISPUTE-"+Date.now(),
    orderReference:reference,
    reason,
    description,
    raisedBy:currentEmail(),
    status:"pending",
    createdAt:new Date().toISOString()
  });

  localStorage.setItem("earngig_order_disputes",JSON.stringify(reports));

  updateOrder(reference,{
    disputeStatus:"pending",
    disputeRaised:true
  });

  closeModal();
  alert("Your report has been saved in this browser. Contact EarnGig Support to have the issue formally reviewed.");
}

function closeModal(){
  document.getElementById("modalBackdrop").classList.remove("show");
}

document.querySelectorAll(".filter").forEach(button=>{
  button.addEventListener("click",()=>{
    document.querySelectorAll(".filter").forEach(item=>item.classList.remove("active"));
    button.classList.add("active");
    activeFilter=button.dataset.filter;
    renderOrders();
  });
});

document.getElementById("modalBackdrop").addEventListener("click",event=>{
  if(event.target.id==="modalBackdrop")closeModal();
});

renderOrders();
</script>

</body>
</html>

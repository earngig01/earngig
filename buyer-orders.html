
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f1ff">
  <title>My Orders | EarnGig</title>

  <style>
    :root {
      --lavender-bg: #f6f3fc;
      --lavender: #eee8fb;
      --purple: #7650b8;
      --purple-dark: #58368f;
      --purple-light: #f3edff;
      --white: #ffffff;
      --text: #292435;
      --muted: #898397;
      --border: #ece8f2;
      --green: #23865a;
      --green-bg: #eaf8f0;
      --orange: #b77922;
      --orange-bg: #fff5e5;
      --blue: #3974b8;
      --blue-bg: #edf5ff;
      --red: #c14d57;
      --red-bg: #fff0f0;
      --shadow: 0 5px 22px rgba(61, 42, 94, .045);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;
      background: var(--lavender-bg);
      color: var(--text);
      min-height: 100vh;
    }

    button, input, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar {
      height: 66px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--purple-dark);
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.7px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: var(--purple-light);
      color: var(--purple);
      border-radius: 11px;
      font-size: 19px;
    }

    .top-links {
      display: flex;
      align-items: center;
      gap: 22px;
      font-size: 13px;
      color: #716b7d;
    }

    .top-links a:hover {
      color: var(--purple);
    }

    .top-links .current {
      color: var(--purple-dark);
      font-weight: 700;
    }

    .page {
      width: min(1100px, 92%);
      margin: 32px auto 60px;
    }

    .page-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 23px;
    }

    .page-heading h1 {
      font-size: clamp(23px, 4vw, 29px);
      letter-spacing: -.8px;
      margin-bottom: 6px;
    }

    .page-heading p {
      color: var(--muted);
      font-size: 13px;
    }

    .back-link {
      color: var(--purple);
      font-size: 13px;
      font-weight: 650;
      white-space: nowrap;
    }

    /* Four-column order filters */

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .filter-card {
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 15px 12px;
      min-height: 91px;
      background: var(--white);
      text-align: left;
      transition: .18s ease;
      box-shadow: var(--shadow);
    }

    .filter-card:hover {
      border-color: #cdbbea;
      transform: translateY(-1px);
    }

    .filter-card.active {
      background: var(--purple-light);
      border: 1.5px solid #bda5e3;
      box-shadow: 0 4px 16px rgba(118, 80, 184, .08);
    }

    .filter-count {
      display: block;
      color: var(--purple-dark);
      font-size: 23px;
      line-height: 1.1;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .filter-name {
      display: block;
      color: #777184;
      font-size: 11px;
      line-height: 1.3;
      font-weight: 650;
    }

    .filter-card.active .filter-name {
      color: var(--purple-dark);
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 13px;
      gap: 12px;
    }

    .section-heading h2 {
      font-size: 17px;
      letter-spacing: -.3px;
    }

    .section-heading span {
      color: var(--muted);
      font-size: 12px;
    }

    .orders-list {
      display: grid;
      gap: 11px;
    }

    .order-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 17px 18px;
      box-shadow: var(--shadow);
      transition: .18s ease;
    }

    .order-card:hover {
      border-color: #d5c8e9;
    }

    .order-main {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .order-ref {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .1px;
      margin-bottom: 7px;
      overflow-wrap: anywhere;
    }

    .order-source {
      font-size: 12px;
      color: #6e687b;
      line-height: 1.6;
    }

    .order-source strong {
      color: #4c4658;
      font-weight: 700;
    }

    .order-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 17px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 11px;
    }

    .order-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid #f1eef5;
      padding-top: 12px;
      margin-top: 13px;
    }

    .order-total {
      font-size: 14px;
      font-weight: 800;
      color: #383144;
    }

    .view-order {
      border: 0;
      background: var(--purple-light);
      color: var(--purple-dark);
      border-radius: 8px;
      padding: 9px 13px;
      font-size: 11px;
      font-weight: 750;
    }

    .view-order:hover {
      background: #e8ddf9;
    }

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 30px;
      padding: 6px 9px;
      font-size: 10px;
      font-weight: 750;
      white-space: nowrap;
    }

    .status.awaiting {
      background: var(--orange-bg);
      color: var(--orange);
    }

    .status.transit {
      background: var(--blue-bg);
      color: var(--blue);
    }

    .status.completed {
      background: var(--green-bg);
      color: var(--green);
    }

    .status.issue {
      background: var(--red-bg);
      color: var(--red);
    }

    .empty-state {
      text-align: center;
      background: var(--white);
      border: 1px dashed #d9cfe8;
      border-radius: 14px;
      padding: 48px 18px;
    }

    .empty-icon {
      width: 49px;
      height: 49px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: var(--purple-light);
      color: var(--purple);
      margin: 0 auto 13px;
      font-size: 23px;
    }

    .empty-state h3 {
      font-size: 15px;
      margin-bottom: 7px;
    }

    .empty-state p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    .notice {
      display: none;
      background: #fff4e8;
      color: #8b5b21;
      border: 1px solid #f1dfc8;
      border-radius: 9px;
      padding: 11px 13px;
      margin-bottom: 15px;
      font-size: 12px;
      line-height: 1.5;
    }

    /* Order details */

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(30, 23, 43, .48);
      z-index: 50;
      padding: 20px;
      overflow-y: auto;
      align-items: flex-start;
      justify-content: center;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .details-modal {
      width: min(680px, 100%);
      background: var(--white);
      border-radius: 17px;
      margin: 25px auto;
      overflow: hidden;
      box-shadow: 0 20px 65px rgba(25, 16, 40, .2);
    }

    .modal-header {
      padding: 19px 21px;
      background: #faf8fe;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
    }

    .modal-header h2 {
      font-size: 17px;
      margin-bottom: 5px;
      overflow-wrap: anywhere;
    }

    .modal-header p {
      color: var(--muted);
      font-size: 11px;
    }

    .close-modal {
      border: 0;
      background: #eee9f5;
      color: #635b70;
      border-radius: 50%;
      width: 31px;
      height: 31px;
      font-size: 19px;
      flex-shrink: 0;
    }

    .modal-content {
      padding: 20px 21px 23px;
    }

    .detail-section {
      margin-bottom: 22px;
    }

    .detail-section h3 {
      font-size: 13px;
      margin-bottom: 12px;
    }

    .detail-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
      background: #faf9fc;
      border: 1px solid #f0edf4;
      border-radius: 11px;
      padding: 14px;
    }

    .info-label {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-bottom: 5px;
    }

    .info-value {
      font-size: 12px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .product-list {
      display: grid;
      gap: 10px;
    }

    .product-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border: 1px solid #efecf3;
      border-radius: 10px;
    }

    .product-image {
      width: 57px;
      height: 57px;
      border-radius: 9px;
      background: #f4f0fa;
      object-fit: cover;
      flex-shrink: 0;
    }

    .product-placeholder {
      display: grid;
      place-items: center;
      color: #a397b7;
      font-size: 20px;
    }

    .product-info {
      flex: 1;
      min-width: 0;
    }

    .product-info strong {
      display: block;
      font-size: 12px;
      margin-bottom: 5px;
      overflow-wrap: anywhere;
    }

    .product-info span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.5;
    }

    .product-price {
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .total-box {
      background: var(--purple-light);
      border-radius: 10px;
      padding: 13px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      margin-top: 12px;
    }

    .total-box strong {
      color: var(--purple-dark);
      font-size: 15px;
    }

    .timeline {
      display: grid;
      gap: 0;
      padding-left: 3px;
    }

    .timeline-item {
      position: relative;
      padding: 0 0 17px 25px;
      border-left: 2px solid #e8e2f1;
      margin-left: 7px;
    }

    .timeline-item:last-child {
      border-left-color: transparent;
      padding-bottom: 0;
    }

    .timeline-dot {
      position: absolute;
      left: -7px;
      top: 0;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #d8cce9;
      border: 2px solid white;
      box-shadow: 0 0 0 1px #d8cce9;
    }

    .timeline-item.done .timeline-dot {
      background: var(--purple);
      box-shadow: 0 0 0 1px var(--purple);
    }

    .timeline-item strong {
      display: block;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .timeline-item span {
      display: block;
      font-size: 10px;
      color: var(--muted);
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 20px;
    }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 11px 15px;
      font-size: 11px;
      font-weight: 750;
    }

    .btn-primary {
      color: white;
      background: var(--purple);
    }

    .btn-primary:hover {
      background: var(--purple-dark);
    }

    .btn-secondary {
      color: var(--purple-dark);
      background: var(--purple-light);
    }

    .btn-danger {
      color: var(--red);
      background: var(--red-bg);
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    /* Issue form */

    .issue-form {
      display: none;
      background: #faf8fc;
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 11px;
      margin-top: 15px;
    }

    .issue-form.show {
      display: block;
    }

    .issue-form label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .issue-form select,
    .issue-form textarea {
      width: 100%;
      border: 1px solid #e5dfed;
      background: white;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 11px;
      outline: none;
      font-size: 12px;
      color: var(--text);
    }

    .issue-form textarea {
      min-height: 85px;
      resize: vertical;
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      background: #30263e;
      color: white;
      padding: 12px 18px;
      border-radius: 9px;
      font-size: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,.15);
      transition: .2s ease;
      width: max-content;
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .loading {
      text-align: center;
      padding: 35px 15px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .topbar {
        height: 59px;
        padding: 0 4%;
      }

      .brand {
        font-size: 19px;
      }

      .top-links {
        gap: 12px;
        font-size: 11px;
      }

      .page {
        width: 92%;
        margin-top: 25px;
      }

      .page-heading {
        align-items: flex-start;
      }

      .page-heading p {
        max-width: 240px;
        line-height: 1.5;
      }

      .filter-grid {
        gap: 7px;
        margin-bottom: 21px;
      }

      .filter-card {
        min-height: 79px;
        padding: 11px 7px;
        border-radius: 10px;
      }

      .filter-count {
        font-size: 20px;
        margin-bottom: 6px;
      }

      .filter-name {
        font-size: 9px;
      }

      .order-card {
        padding: 14px;
        border-radius: 11px;
      }

      .order-ref {
        font-size: 12px;
      }

      .order-source {
        font-size: 11px;
      }

      .order-meta {
        font-size: 10px;
      }

      .status {
        font-size: 9px;
        padding: 5px 7px;
      }

      .view-order {
        padding: 8px 10px;
      }

      .modal-backdrop {
        padding: 8px;
      }

      .details-modal {
        margin: 12px auto;
        border-radius: 14px;
      }

      .modal-header,
      .modal-content {
        padding: 16px;
      }

      .product-image {
        width: 48px;
        height: 48px;
      }

      .product-price {
        font-size: 11px;
      }
    }

    @media (max-width: 360px) {
      .filter-grid {
        gap: 5px;
      }

      .filter-card {
        padding: 10px 5px;
      }

      .filter-name {
        font-size: 8px;
      }

      .detail-info {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <a class="brand" href="dashboard.html">
      <span class="brand-mark">♛</span>
      EarnGig
    </a>

    <nav class="top-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="marketplace.html">Marketplace</a>
      <a href="buyer-orders.html" class="current">My Orders</a>
    </nav>
  </header>

  <main class="page">

    <div class="page-heading">
      <div>
        <h1>My Orders</h1>
        <p>Track your purchases and manage your deliveries.</p>
      </div>
      <a href="marketplace.html" class="back-link">← Marketplace</a>
    </div>

    <div id="notice" class="notice"></div>

    <section class="filter-grid" aria-label="Order filters">

      <button class="filter-card active" data-filter="all">
        <span class="filter-count" id="countAll">0</span>
        <span class="filter-name">All Orders</span>
      </button>

      <button class="filter-card" data-filter="awaiting_dispatch">
        <span class="filter-count" id="countAwaiting">0</span>
        <span class="filter-name">Awaiting Dispatch</span>
      </button>

      <button class="filter-card" data-filter="in_transit">
        <span class="filter-count" id="countTransit">0</span>
        <span class="filter-name">In Transit</span>
      </button>

      <button class="filter-card" data-filter="completed">
        <span class="filter-count" id="countCompleted">0</span>
        <span class="filter-name">Completed</span>
      </button>

    </section>

    <div class="section-heading">
      <h2 id="listHeading">Active Orders</h2>
      <span id="orderCount">0 orders</span>
    </div>

    <section id="ordersList" class="orders-list">
      <div class="loading">Loading your orders...</div>
    </section>

  </main>

  <!-- Order details modal -->

  <div class="modal-backdrop" id="detailsBackdrop">
    <div class="details-modal" role="dialog" aria-modal="true"
      aria-labelledby="modalOrderRef">

      <div class="modal-header">
        <div>
          <h2 id="modalOrderRef">Order details</h2>
          <p id="modalOrderDate"></p>
        </div>
        <button class="close-modal" id="closeModal" aria-label="Close">×</button>
      </div>

      <div class="modal-content" id="modalContent"></div>

    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /*
      EARNGIG BUYER ORDERS

      Configure API_BASE with your real backend API address.

      Expected endpoints:

      GET  /orders/my
           Returns orders belonging to the authenticated buyer.

      POST /orders/:orderId/confirm-delivery
           Verifies the order is in transit, records buyer confirmation,
           completes the order and releases eligible seller proceeds.

      POST /orders/:orderId/issues
           Submits an issue linked to the specific order.

      These actions must be authenticated and verified by the backend.
      Do not use localStorage as the authority for payments, order status,
      penalties or wallet balances.
    */

    const API_BASE = "https://YOUR-BACKEND-DOMAIN/api";

    let orders = [];
    let activeFilter = "all";
    let selectedOrder = null;

    const list = document.getElementById("ordersList");
    const backdrop = document.getElementById("detailsBackdrop");
    const modalContent = document.getElementById("modalContent");
    const notice = document.getElementById("notice");

    const money = value => {
      const amount = Number(value);
      if (!Number.isFinite(amount)) return "—";

      return new Intl.NumberFormat("en-NG", {
        style: "currency",
        currency: "NGN",
        maximumFractionDigits: 2
      }).format(amount);
    };

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function formatDate(value) {
      if (!value) return "Date unavailable";

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "Date unavailable";

      return date.toLocaleDateString("en-NG", {
        day: "numeric",
        month: "short",
        year: "numeric"
      });
    }

    function getReference(order) {
      return order.orderReference ||
        order.order_reference ||
        order.reference ||
        order.orderNumber ||
        order.order_number ||
        order.id ||
        "Order reference unavailable";
    }

    function getProducts(order) {
      return Array.isArray(order.items)
        ? order.items
        : Array.isArray(order.products)
          ? order.products
          : [];
    }

    function getSource(order) {
      const source = String(
        order.source || order.marketplace || order.storeType || ""
      ).toLowerCase();

      if (source.includes("g-store") || source.includes("gstore")) {
        return "G-Store";
      }

      if (source.includes("vendor")) {
        return "Vendor Haul";
      }

      if (order.vendorName || order.vendor_name || order.storeName) {
        return "Vendor Haul";
      }

      return order.storeName || order.store_name || "Shopping source unavailable";
    }

    function getVendor(order) {
      return order.vendorName ||
        order.vendor_name ||
        order.storeName ||
        order.store_name ||
        order.vendor?.name ||
        "Vendor information unavailable";
    }

    function normalStatus(order) {
      const raw = String(
        order.status || order.orderStatus || order.order_status || ""
      ).toLowerCase().replace(/[\s-]+/g, "_");

      if (
        raw === "completed" ||
        raw === "buyer_confirmed" ||
        raw === "buyer_received" ||
        raw === "delivered_confirmed"
      ) {
        return "completed";
      }

      if (
        raw === "in_transit" ||
        raw === "dispatched" ||
        raw === "shipped" ||
        raw === "out_for_delivery"
      ) {
        return "in_transit";
      }

      if (
        raw === "awaiting_dispatch" ||
        raw === "paid" ||
        raw === "processing" ||
        raw === "confirmed" ||
        raw === "accepted"
      ) {
        return "awaiting_dispatch";
      }

      if (order.issueStatus || order.hasOpenIssue) {
        return "issue";
      }

      return "awaiting_dispatch";
    }

    function statusLabel(status) {
      return {
        awaiting_dispatch: "Awaiting Dispatch",
        in_transit: "In Transit",
        completed: "Completed",
        issue: "Under Review"
      }[status] || "Awaiting Dispatch";
    }

    function statusClass(status) {
      return {
        awaiting_dispatch: "awaiting",
        in_transit: "transit",
        completed: "completed",
        issue: "issue"
      }[status] || "awaiting";
    }

    function orderTotal(order) {
      const total = order.totalPaid ??
        order.amountPaid ??
        order.amount_paid ??
        order.total ??
        order.grandTotal ??
        order.grand_total;

      if (total !== undefined && total !== null) {
        return Number(total);
      }

      return getProducts(order).reduce((sum, item) => {
        const price = Number(item.price ?? item.unitPrice ?? item.unit_price ?? 0);
        const quantity = Number(item.quantity ?? 1);
        return sum + price * quantity;
      }, 0);
    }

    function productCount(order) {
      return getProducts(order).reduce(
        (sum, item) => sum + Number(item.quantity || 1), 0
      );
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");

      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    async function apiRequest(path, options = {}) {
      if (API_BASE.includes("YOUR-BACKEND-DOMAIN")) {
        throw new Error(
          "The EarnGig backend address has not been configured yet."
        );
      }

      const response = await fetch(
        API_BASE.replace(/\/$/, "") + path,
        {
          ...options,
          credentials: "include",
          headers: {
            "Content-Type": "application/json",
            ...(options.headers || {})
          }
        }
      );

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          data.message || data.error || "The request could not be completed."
        );
      }

      return data;
    }

    async function loadOrders() {
      list.innerHTML = '<div class="loading">Loading your orders...</div>';

      try {
        const data = await apiRequest("/orders/my");

        orders = Array.isArray(data)
          ? data
          : Array.isArray(data.orders)
            ? data.orders
            : [];

        notice.style.display = "none";
        updateCounts();
        renderOrders();

      } catch (error) {
        orders = [];
        updateCounts();

        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">↻</div>
            <h3>Unable to load your orders</h3>
            <p>${escapeHTML(error.message)}<br>
            Please try again when your connection is available.</p>
            <br>
            <button class="btn btn-secondary" onclick="loadOrders()">
              Try Again
            </button>
          </div>
        `;

        if (API_BASE.includes("YOUR-BACKEND-DOMAIN")) {
          notice.textContent =
            "Backend connection still needs to be configured. Order information and delivery actions will become available after connecting the EarnGig API.";
          notice.style.display = "block";
        }
      }
    }

    function updateCounts() {
      const activeOrders = orders.filter(order =>
        normalStatus(order) !== "completed"
      );

      document.getElementById("countAll").textContent =
        activeOrders.length;

      document.getElementById("countAwaiting").textContent =
        orders.filter(order =>
          normalStatus(order) === "awaiting_dispatch"
        ).length;

      document.getElementById("countTransit").textContent =
        orders.filter(order =>
          normalStatus(order) === "in_transit"
        ).length;

      document.getElementById("countCompleted").textContent =
        orders.filter(order =>
          normalStatus(order) === "completed"
        ).length;
    }

    function getFilteredOrders() {
      if (activeFilter === "all") {
        // Completed purchases never appear in All Orders.
        return orders.filter(order =>
          normalStatus(order) !== "completed"
        );
      }

      return orders.filter(order =>
        normalStatus(order) === activeFilter
      );
    }

    function renderOrders() {
      const filtered = getFilteredOrders();

      document.getElementById("listHeading").textContent = {
        all: "Active Orders",
        awaiting_dispatch: "Awaiting Dispatch",
        in_transit: "In Transit",
        completed: "Completed Orders"
      }[activeFilter];

      document.getElementById("orderCount").textContent =
        `${filtered.length} ${filtered.length === 1 ? "order" : "orders"}`;

      if (!filtered.length) {
        const messages = {
          all: ["No active orders", "Your unfinished purchases will appear here."],
          awaiting_dispatch: ["Nothing awaiting dispatch", "Orders waiting for the vendor to send them out will appear here."],
          in_transit: ["Nothing in transit", "Orders dispatched and travelling to you will appear here."],
          completed: ["No completed orders yet", "Your completed purchases will be kept here."]
        };

        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">▤</div>
            <h3>${messages[activeFilter][0]}</h3>
            <p>${messages[activeFilter][1]}</p>
          </div>
        `;
        return;
      }

      list.innerHTML = filtered
        .slice()
        .sort((a, b) => {
          const dateA = new Date(a.createdAt || a.created_at || 0);
          const dateB = new Date(b.createdAt || b.created_at || 0);
          return dateB - dateA;
        })
        .map(order => {
          const status = normalStatus(order);
          const source = getSource(order);
          const vendor = getVendor(order);
          const count = productCount(order);
          const reference = getReference(order);
          const date = formatDate(order.createdAt || order.created_at);

          return `
            <article class="order-card">
              <div class="order-main">
                <div>
                  <div class="order-ref">${escapeHTML(reference)}</div>
                  <div class="order-source">
                    Shopped from: <strong>${escapeHTML(source)}</strong>
                    ${source === "Vendor Haul"
                      ? `<br>Vendor: <strong>${escapeHTML(vendor)}</strong>`
                      : ""}
                  </div>
                </div>

                <span class="status ${statusClass(status)}">
                  ${statusLabel(status)}
                </span>
              </div>

              <div class="order-meta">
                <span>${count} ${count === 1 ? "product" : "products"}</span>
                <span>${escapeHTML(date)}</span>
              </div>

              <div class="order-bottom">
                <div class="order-total">${money(orderTotal(order))}</div>
                <button class="view-order"
                  onclick="openOrder('${escapeHTML(String(order.id))}')">
                  View Order Details →
                </button>
              </div>
            </article>
          `;
        }).join("");
    }

    document.querySelectorAll(".filter-card").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".filter-card").forEach(card =>
          card.classList.remove("active")
        );

        button.classList.add("active");
        activeFilter = button.dataset.filter;
        renderOrders();
      });
    });

    function findOrder(id) {
      return orders.find(order => String(order.id) === String(id));
    }

    function openOrder(id) {
      const order = findOrder(id);
      if (!order) return;

      selectedOrder = order;

      const reference = getReference(order);
      const status = normalStatus(order);
      const source = getSource(order);
      const vendor = getVendor(order);
      const products = getProducts(order);

      document.getElementById("modalOrderRef").textContent = reference;
      document.getElementById("modalOrderDate").textContent =
        "Placed on " + formatDate(order.createdAt || order.created_at);

      const paymentMethod = order.paymentMethod ||
        order.payment_method ||
        order.payment?.method ||
        "Payment details unavailable";

      const deliveryAddress = order.deliveryAddress ||
        order.delivery_address ||
        order.delivery?.address ||
        "Delivery address unavailable";

      const trackingNumber = order.trackingNumber ||
        order.tracking_number ||
        order.delivery?.trackingNumber ||
        "Not yet available";

      const productHTML = products.length
        ? products.map(item => {
            const name = item.name || item.productName ||
              item.product_name || "Product";

            const quantity = Number(item.quantity || 1);
            const price = Number(
              item.price ?? item.unitPrice ?? item.unit_price ?? 0
            );

            const image = item.image || item.imageUrl ||
              item.image_url || item.productImage || "";

            return `
              <div class="product-row">
                ${image
                  ? `<img class="product-image"
                      src="${escapeHTML(image)}"
                      alt="${escapeHTML(name)}"
                      onerror="this.style.display='none'">`
                  : `<div class="product-image product-placeholder">▧</div>`
                }

                <div class="product-info">
                  <strong>${escapeHTML(name)}</strong>
                  <span>Quantity: ${quantity}</span>
                  <span>Unit price: ${money(price)}</span>
                </div>

                <div class="product-price">
                  ${money(price * quantity)}
                </div>
              </div>
            `;
          }).join("")
        : `<p style="font-size:12px;color:#898397">
            Product details are not available for this order.
          </p>`;

      const awaitingDone = status !== "awaiting_dispatch";
      const transitDone = status === "in_transit" || status === "completed";
      const completedDone = status === "completed";

      modalContent.innerHTML = `
        <section class="detail-section">
          <div class="detail-info">
            <div>
              <span class="info-label">Shopping source</span>
              <span class="info-value">${escapeHTML(source)}</span>
            </div>

            ${source === "Vendor Haul" ? `
              <div>
                <span class="info-label">Vendor / Store</span>
                <span class="info-value">${escapeHTML(vendor)}</span>
              </div>
            ` : ""}

            <div>
              <span class="info-label">Order status</span>
              <span class="info-value">
                ${statusLabel(status)}
              </span>
            </div>

            <div>
              <span class="info-label">Payment method</span>
              <span class="info-value">${escapeHTML(paymentMethod)}</span>
            </div>

            <div>
              <span class="info-label">Tracking number</span>
              <span class="info-value">${escapeHTML(trackingNumber)}</span>
            </div>

            <div>
              <span class="info-label">Delivery address</span>
              <span class="info-value">${escapeHTML(deliveryAddress)}</span>
            </div>
          </div>
        </section>

        <section class="detail-section">
          <h3>Products in this order (${productCount(order)})</h3>
          <div class="product-list">${productHTML}</div>

          <div class="total-box">
            <span>Total amount paid</span>
            <strong>${money(orderTotal(order))}</strong>
          </div>
        </section>

        <section class="detail-section">
          <h3>Delivery progress</h3>

          <div class="timeline">
            <div class="timeline-item done">
              <span class="timeline-dot"></span>
              <strong>Payment confirmed</strong>
              <span>Your payment has been verified and your order created.</span>
            </div>

            <div class="timeline-item ${awaitingDone ? "done" : ""}">
              <span class="timeline-dot"></span>
              <strong>Awaiting Dispatch</strong>
              <span>The vendor has up to 48 hours from the order start time to dispatch.</span>
            </div>

            <div class="timeline-item ${transitDone ? "done" : ""}">
              <span class="timeline-dot"></span>
              <strong>In Transit</strong>
              <span>After dispatch, delivery is expected within 3 days.</span>
            </div>

            <div class="timeline-item ${completedDone ? "done" : ""}">
              <span class="timeline-dot"></span>
              <strong>Completed</strong>
              <span>Completed when you confirm that you have received your order.</span>
            </div>
          </div>
        </section>

        <div class="modal-actions">
          ${status === "in_transit" ? `
            <button class="btn btn-primary" id="confirmDeliveryBtn">
              Confirm Delivery
            </button>
          ` : ""}

          ${status !== "completed" ? `
            <button class="btn btn-danger" id="showIssueBtn">
              Report an Issue
            </button>
          ` : `
            <button class="btn btn-secondary" id="showIssueBtn">
              Report an Issue
            </button>
          `}
        </div>

        <div class="issue-form" id="issueForm">
          <label for="issueType">What is the problem?</label>

          <select id="issueType">
            <option value="">Select an issue</option>
            <option value="not_received">I have not received my order</option>
            <option value="missing_product">A product is missing</option>
            <option value="wrong_product">I received the wrong product</option>
            <option value="damaged_product">A product arrived damaged</option>
            <option value="delivery_delay">Delivery is delayed</option>
            <option value="other">Other issue</option>
          </select>

          <label for="issueDescription">Describe the issue</label>
          <textarea id="issueDescription"
            placeholder="Please explain what happened..."></textarea>

          <button class="btn btn-primary" id="submitIssueBtn">
            Submit Report
          </button>
        </div>
      `;

      backdrop.classList.add("show");
      document.body.style.overflow = "hidden";

      document.getElementById("confirmDeliveryBtn")
        ?.addEventListener("click", confirmDelivery);

      document.getElementById("showIssueBtn")
        ?.addEventListener("click", () => {
          document.getElementById("issueForm").classList.toggle("show");
        });

      document.getElementById("submitIssueBtn")
        ?.addEventListener("click", submitIssue);
    }

    async function confirmDelivery() {
      if (!selectedOrder) return;

      const confirmed = window.confirm(
        "Please confirm that you have physically received all the products in this order. This will complete the order."
      );

      if (!confirmed) return;

      const button = document.getElementById("confirmDeliveryBtn");
      if (button) {
        button.disabled = true;
        button.textContent = "Confirming...";
      }

      try {
        await apiRequest(
          `/orders/${encodeURIComponent(selectedOrder.id)}/confirm-delivery`,
          {
            method: "POST",
            body: JSON.stringify({ confirmation: true })
          }
        );

        showToast("Delivery confirmed. Your order is completed.");
        await loadOrders();

        const updated = findOrder(selectedOrder.id);
        if (updated) {
          openOrder(updated.id);
        } else {
          closeModal();
        }

      } catch (error) {
        showToast(error.message);

        if (button) {
          button.disabled = false;
          button.textContent = "Confirm Delivery";
        }
      }
    }

    async function submitIssue() {
      if (!selectedOrder) return;

      const type = document.getElementById("issueType").value;
      const description =
        document.getElementById("issueDescription").value.trim();

      if (!type) {
        showToast("Please select the issue type.");
        return;
      }

      if (description.length < 5) {
        showToast("Please provide more details about the issue.");
        return;
      }

      const button = document.getElementById("submitIssueBtn");
      button.disabled = true;
      button.textContent = "Submitting...";

      try {
        await apiRequest(
          `/orders/${encodeURIComponent(selectedOrder.id)}/issues`,
          {
            method: "POST",
            body: JSON.stringify({
              type,
              description
            })
          }
        );

        showToast("Your issue report has been submitted.");
        closeModal();
        await loadOrders();

      } catch (error) {
        showToast(error.message);
        button.disabled = false;
        button.textContent = "Submit Report";
      }
    }

    function closeModal() {
      backdrop.classList.remove("show");
      document.body.style.overflow = "";
      selectedOrder = null;
    }

    document.getElementById("closeModal")
      .addEventListener("click", closeModal);

    backdrop.addEventListener("click", event => {
      if (event.target === backdrop) closeModal();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeModal();
    });

    loadOrders();
  </script>

</body>
</html>

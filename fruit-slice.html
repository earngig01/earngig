
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EarnGig Fruit Slice</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11182d;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:#10172bdc;color:white;text-align:center}
#screen.hide{display:none}
.panel{width:min(390px,100%);padding:28px 22px;border:2px solid #ffb3a5;border-radius:25px;background:linear-gradient(145deg,#713d69,#241c46);box-shadow:0 18px 55px #0009}
.panel h1{font-size:31px;color:#ffd77b;margin:0 0 12px}
.panel p{font-size:14px;line-height:1.65;color:#ffe9ed}
#start{background:linear-gradient(145deg,#ffe48b,#ff9b45);color:#49233d;border:0;border-radius:14px;padding:17px 35px;font-size:18px;font-weight:900;margin-top:12px;touch-action:manipulation}
#hint{position:fixed;bottom:15px;left:0;width:100%;text-align:center;color:#fff;font-size:12px;text-shadow:0 2px 5px #000;pointer-events:none;z-index:2}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="screen">
 <div class="panel">
  <h1 id="heading">FRUIT SLICE</h1>
  <p id="message">Slice the flying fruits with your finger. Reach the target score before the timer runs out. Watch out for bombs!</p>
  <p><b>60 SECONDS · TARGET: 500 POINTS</b></p>
  <p>Swipe across fruit to slice. Avoid bombs and don't miss too many fruits.</p>
  <button id="start" type="button">START GAME</button>
 </div>
</div>
<div id="hint">SWIPE ACROSS THE FRUIT TO SLICE!</div>

<script>
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);

let W,H,DPR;
let running=false,ended=false;
let score=0,target=500;
let timeLeft=60,lives=3;
let fruits=[],particles=[],trail=[];
let spawnTimer=0,animation=0,last=0;
let slicing=false,lastPoint=null;
let audio=null;

const fruitTypes=[
 {name:"Watermelon",color:"#32c879",inside:"#f94c67",points:15,r:27},
 {name:"Orange",color:"#ff982e",inside:"#ffcf53",points:10,r:23},
 {name:"Apple",color:"#ed4057",inside:"#ffb3a1",points:15,r:24},
 {name:"Kiwi",color:"#8fbd39",inside:"#d9f58a",points:20,r:23},
 {name:"Pineapple",color:"#e9b52d",inside:"#fff0a1",points:25,r:25},
 {name:"Blueberry",color:"#5c83e8",inside:"#b9d4ff",points:30,r:18},
 {name:"Strawberry",color:"#ed405c",inside:"#ffb7c5",points:20,r:21},
 {name:"Lemon",color:"#f4d43e",inside:"#fff6a5",points:15,r:22}
];

function resize(){
 DPR=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=W*DPR;canvas.height=H*DPR;
 canvas.style.width=W+"px";canvas.style.height=H+"px";
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if(!running)draw();
}
addEventListener("resize",resize);

const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function sound(freq=450,duration=.08,type="sine"){
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();
  const o=audio.createOscillator(),g=audio.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(.055,audio.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
  o.connect(g);g.connect(audio.destination);
  o.start();o.stop(audio.currentTime+duration);
 }catch(e){}
}

function background(){
 const g=ctx.createLinearGradient(0,0,W,H);
 g.addColorStop(0,"#311e51");
 g.addColorStop(.5,"#642b64");
 g.addColorStop(1,"#1b2445");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 for(let i=0;i<30;i++){
  ctx.fillStyle="#ffffff0b";
  ctx.beginPath();
  ctx.arc((i*139)%W,(i*223)%H,1+i%3,0,Math.PI*2);
  ctx.fill();
 }
}

function roundRect(x,y,w,h,r,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);
 ctx.fill();
}

function drawFruit(f){
 ctx.save();
 ctx.translate(f.x,f.y);
 ctx.rotate(f.rotation);

 const r=f.r;
 const type=f.type;

 ctx.shadowColor="#0008";
 ctx.shadowBlur=13;
 ctx.shadowOffsetY=7;

 const g=ctx.createRadialGradient(-r*.35,-r*.42,r*.08,0,0,r*1.15);
 g.addColorStop(0,"#ffffff");
 g.addColorStop(.18,type.inside);
 g.addColorStop(.65,type.color);
 g.addColorStop(1,"#4a1b47");

 ctx.fillStyle=g;
 ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();

 ctx.shadowColor="transparent";

 /* Glossy reflection */
 const shine=ctx.createRadialGradient(-r*.35,-r*.48,1,-r*.2,-r*.3,r*.7);
 shine.addColorStop(0,"#ffffffed");
 shine.addColorStop(.3,"#ffffff8c");
 shine.addColorStop(1,"#ffffff00");
 ctx.fillStyle=shine;
 ctx.beginPath();
 ctx.ellipse(-r*.22,-r*.34,r*.45,r*.24,-.55,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#ffffffd9";
 ctx.beginPath();
 ctx.ellipse(-r*.35,-r*.47,r*.12,r*.065,-.5,0,Math.PI*2);
 ctx.fill();

 ctx.strokeStyle="#ffffff55";
 ctx.lineWidth=1.5;
 ctx.beginPath();ctx.arc(0,0,r*.95,0,Math.PI*2);ctx.stroke();

 /* Small leaf/stem */
 ctx.strokeStyle="#64452c";ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(0,-r*.8);ctx.quadraticCurveTo(5,-r*1.15,9,-r*.95);ctx.stroke();

 ctx.restore();
}

function drawBomb(b){
 ctx.save();
 ctx.translate(b.x,b.y);
 ctx.rotate(b.rotation);
 ctx.shadowColor="#0009";ctx.shadowBlur=12;ctx.shadowOffsetY=5;
 const g=ctx.createRadialGradient(-b.r*.35,-b.r*.4,1,0,0,b.r);
 g.addColorStop(0,"#9da6b9");
 g.addColorStop(.3,"#414a60");
 g.addColorStop(1,"#111827");
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.fill();
 ctx.shadowColor="transparent";
 ctx.strokeStyle="#e6e9f1";ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(0,-b.r);ctx.quadraticCurveTo(10,-b.r-12,14,-b.r-17);ctx.stroke();
 ctx.fillStyle="#ffcf4d";
 ctx.beginPath();ctx.arc(15,-b.r-18,4,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#fff";
 ctx.beginPath();ctx.arc(-b.r*.3,-b.r*.35,3,0,Math.PI*2);ctx.fill();
 ctx.restore();
}

function drawUI(){
 roundRect(12,12,W-24,91,17,"#16152de8");

 ctx.textAlign="left";
 ctx.fillStyle="#fff0e7";
 ctx.font="bold 10px Arial";
 ctx.fillText("SCORE",25,32);
 ctx.fillStyle="#ffe17b";
 ctx.font="bold 23px Arial";
 ctx.fillText(score,25,58);

 ctx.textAlign="center";
 ctx.fillStyle="#fff0e7";
 ctx.font="bold 10px Arial";
 ctx.fillText("TIME LEFT",W/2,32);
 ctx.fillStyle=timeLeft<=10?"#ff7777":"#fff";
 ctx.font="bold 25px Arial";
 ctx.fillText(Math.ceil(timeLeft)+"s",W/2,59);

 ctx.textAlign="right";
 ctx.fillStyle="#fff0e7";
 ctx.font="bold 10px Arial";
 ctx.fillText("LIVES",W-25,32);
 ctx.font="bold 23px Arial";
 ctx.fillStyle="#ff809b";
 ctx.fillText("♥ ".repeat(lives),W-25,59);

 /* Target progress */
 const barX=25,barY=76,barW=W-50;
 roundRect(barX,barY,barW,9,5,"#ffffff30");
 const progress=clamp(score/target,0,1);
 if(progress>0)roundRect(barX,barY,barW*progress,9,5,"#ffd45e");

 ctx.fillStyle="#fff";
 ctx.font="bold 9px Arial";
 ctx.textAlign="center";
 ctx.fillText("TARGET "+target+" POINTS",W/2,98);
}

function drawTrail(){
 if(trail.length<2)return;
 ctx.save();
 ctx.lineCap="round";
 ctx.lineJoin="round";
 for(let i=1;i<trail.length;i++){
  const p=trail[i],prev=trail[i-1];
  ctx.globalAlpha=i/trail.length;
  ctx.strokeStyle="#fff4bb";
  ctx.lineWidth=2+(i/trail.length)*7;
  ctx.beginPath();
  ctx.moveTo(prev.x,prev.y);
  ctx.lineTo(p.x,p.y);
  ctx.stroke();
 }
 ctx.restore();
}

function draw(){
 background();
 drawUI();

 for(const f of fruits){
  if(f.bomb)drawBomb(f);
  else drawFruit(f);
 }

 for(const p of particles){
  ctx.globalAlpha=clamp(p.life*2,0,1);
  ctx.fillStyle=p.color;
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
 drawTrail();
}

function spawnFruit(){
 const bomb=Math.random()<.13;
 const type=fruitTypes[Math.floor(Math.random()*fruitTypes.length)];
 const x=rand(45,W-45);
 const startY=H+40;
 const targetX=x+rand(-W*.25,W*.25);
 const targetY=rand(H*.28,H*.62);
 const flightTime=rand(1.1,1.65);
 const vx=(targetX-x)/flightTime;
 const vy=(targetY-startY-.5*750*flightTime*flightTime)/flightTime;

 fruits.push({
  x,y:startY,vx,vy,
  gravity:750,
  r:bomb?22:type.r,
  type,bomb,
  rotation:rand(-.5,.5),
  spin:rand(-2,2),
  sliced:false
 });
}

function burst(x,y,color){
 for(let i=0;i<17;i++){
  const a=Math.random()*Math.PI*2,s=rand(50,230);
  particles.push({
   x,y,
   vx:Math.cos(a)*s,
   vy:Math.sin(a)*s,
   r:rand(2,6),
   life:rand(.35,.85),
   color
  });
 }
}

function sliceFruit(f){
 if(f.sliced)return;
 f.sliced=true;

 if(f.bomb){
  lives--;
  sound(110,.3,"sawtooth");
  burst(f.x,f.y,"#c3d0e5");
  if(lives<=0)finish(false,"GAME OVER","You ran out of lives.");
  return;
 }

 score+=f.type.points;
 sound(520+f.type.points*5,.09);
 burst(f.x,f.y,f.type.inside);

 /* Fruit juice droplets */
 for(let i=0;i<9;i++){
  particles.push({
   x:f.x,y:f.y,
   vx:rand(-150,150),vy:rand(-160,80),
   r:rand(2,5),life:rand(.3,.6),
   color:f.type.color
  });
 }

 if(score>=target){
  finish(true,"YOU WIN!","You reached the target score!");
 }
}

function point(e){
 const rect=canvas.getBoundingClientRect();
 return {x:e.clientX-rect.left,y:e.clientY-rect.top};
}

function checkSlice(a,b){
 const distance=(px,py,x1,y1,x2,y2)=>{
  const dx=x2-x1,dy=y2-y1;
  const len=dx*dx+dy*dy;
  if(!len)return Math.hypot(px-x1,py-y1);
  const t=clamp(((px-x1)*dx+(py-y1)*dy)/len,0,1);
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
 };

 for(const f of fruits){
  if(f.sliced)continue;
  if(distance(f.x,f.y,a.x,a.y,b.x,b.y)<f.r+12){
   sliceFruit(f);
  }
 }
}

canvas.addEventListener("pointerdown",e=>{
 if(!running||ended)return;
 e.preventDefault();
 slicing=true;
 const p=point(e);
 lastPoint=p;
 trail=[p];
 canvas.setPointerCapture?.(e.pointerId);
});

canvas.addEventListener("pointermove",e=>{
 if(!running||!slicing||ended)return;
 e.preventDefault();
 const p=point(e);
 if(lastPoint)checkSlice(lastPoint,p);
 trail.push(p);
 if(trail.length>12)trail.shift();
 lastPoint=p;
});

function stopSlice(){
 slicing=false;
 lastPoint=null;
 setTimeout(()=>trail=[],100);
}
canvas.addEventListener("pointerup",stopSlice);
canvas.addEventListener("pointercancel",stopSlice);

function update(dt){
 if(!running||ended)return;

 timeLeft-=dt;
 if(timeLeft<=0){
  timeLeft=0;
  finish(score>=target,"TIME UP",score>=target?"You reached your target!":"You did not reach the target score.");
  return;
 }

 spawnTimer-=dt;
 if(spawnTimer<=0){
  spawnFruit();
  spawnTimer=rand(.48,.85);
  if(score>250)spawnTimer*=.88;
 }

 for(const f of fruits){
  f.x+=f.vx*dt;
  f.y+=f.vy*dt;
  f.vy+=f.gravity*dt;
  f.rotation+=f.spin*dt;
 }

 fruits=fruits.filter(f=>!f.sliced&&f.y<H+100);

 particles=particles.filter(p=>p.life>0);
 for(const p of particles){
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.vx*=.98;
  p.vy+=250*dt;
  p.life-=dt;
 }
}

function loop(now){
 if(!running||ended)return;
 const dt=Math.min((now-last)/1000,.04);
 last=now;
 update(dt);
 draw();
 if(running&&!ended)animation=requestAnimationFrame(loop);
}

function finish(won,title,message){
 if(ended)return;
 ended=true;running=false;slicing=false;
 cancelAnimationFrame(animation);

 $("heading").textContent=title;
 $("message").textContent=message+" Final score: "+score+" / "+target+".";
 $("start").textContent="RETURN TO GAMES";
 $("screen").classList.remove("hide");
 $("hint").style.display="none";
 sound(won?850:130,.3,won?"triangle":"sawtooth");

 setTimeout(()=>location.replace("games.html"),2500);
}

function startGame(){
 if(running)return;
 cancelAnimationFrame(animation);
 fruits=[];particles=[];trail=[];
 score=0;timeLeft=60;lives=3;
 spawnTimer=.3;
 ended=false;running=true;slicing=false;
 $("screen").classList.add("hide");
 $("hint").style.display="block";
 last=performance.now();
 animation=requestAnimationFrame(loop);
}

$("start").addEventListener("click",e=>{
 e.preventDefault();
 if(ended){location.replace("games.html");return}
 startGame();
});

resize();
draw();
</script>
</body>
</html>

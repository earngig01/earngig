
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f6f9">
  <title>Vendor Haul | EarnGig</title>

  <style>
    :root {
      --page: #f7f6f9;
      --white: #ffffff;
      --lavender: #f0edf4;
      --lavender-soft: #faf9fc;
      --text: #29272e;
      --muted: #89858f;
      --border: #e9e6ed;
      --dark: #37333d;
      --silver: #eeecf0;
      --shadow: 0 5px 20px rgba(40, 34, 49, .045);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;
      background: var(--page);
      color: var(--text);
      min-height: 100vh;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar {
      background: #fff;
      height: 68px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.7px;
      color: #302d35;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: #efedf1;
      display: grid;
      place-items: center;
      font-size: 19px;
    }

    .top-links {
      display: flex;
      align-items: center;
      gap: 23px;
      font-size: 13px;
      color: #77727d;
    }

    .top-links a:hover,
    .top-links .current {
      color: #29262f;
      font-weight: 700;
    }

    .page {
      width: min(1120px, 92%);
      margin: 38px auto 65px;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 27px;
    }

    .hero h1 {
      font-size: clamp(27px, 4vw, 35px);
      letter-spacing: -1.1px;
      color: #302d35;
      margin-bottom: 8px;
    }

    .hero p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .hero-icon {
      width: 59px;
      height: 59px;
      border-radius: 18px;
      background: #eeecf1;
      color: #5e5965;
      display: grid;
      place-items: center;
      font-size: 27px;
      flex-shrink: 0;
    }

    /* Search */

    .search-area {
      margin-bottom: 32px;
    }

    .search-box {
      background: var(--white);
      border: 1px solid #e5e1e9;
      border-radius: 13px;
      padding: 7px 8px 7px 15px;
      display: flex;
      align-items: center;
      gap: 11px;
      box-shadow: var(--shadow);
      min-height: 58px;
    }

    .search-icon {
      color: #85808b;
      font-size: 19px;
      flex-shrink: 0;
    }

    .search-box input {
      border: 0;
      outline: none;
      background: transparent;
      width: 100%;
      min-width: 0;
      color: var(--text);
      font-size: 13px;
    }

    .search-box input::placeholder {
      color: #aaa5af;
    }

    .search-button {
      border: 0;
      background: #393640;
      color: #fff;
      padding: 12px 21px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      transition: .2s;
    }

    .search-button:hover {
      background: #211f25;
    }

    .search-clear {
      border: 0;
      background: transparent;
      color: #88828e;
      font-size: 12px;
      padding: 7px;
      display: none;
    }

    .search-clear.show {
      display: block;
    }

    /* Store section */

    .store-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 19px;
    }

    .store-heading h2 {
      font-size: 18px;
      letter-spacing: -.3px;
      color: #302d35;
    }

    .store-count {
      background: #eeecf1;
      color: #68636e;
      padding: 8px 13px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 650;
      white-space: nowrap;
    }

    /* Three stores in each row */

    .stores-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: 19px;
      row-gap: 23px;
    }

    .store-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 22px 10px 17px;
      min-width: 0;
      box-shadow: var(--shadow);
      transition: transform .2s ease, box-shadow .2s ease,
        border-color .2s ease;
      cursor: pointer;
    }

    .store-card:hover {
      transform: translateY(-3px);
      border-color: #d2ced7;
      box-shadow: 0 9px 25px rgba(40, 34, 49, .09);
    }

    .store-logo-wrap {
      width: 94px;
      height: 94px;
      border-radius: 50%;
      background: #f1eff3;
      border: 3px solid #f1eff3;
      overflow: hidden;
      display: grid;
      place-items: center;
      margin-bottom: 13px;
      flex-shrink: 0;
    }

    .store-logo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .logo-placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: #77717e;
      font-size: 28px;
      font-weight: 750;
      background: #e9e6ed;
    }

    .store-name {
      color: #302d35;
      font-size: 13px;
      font-weight: 750;
      line-height: 1.45;
      overflow-wrap: anywhere;
      max-width: 100%;
    }

    .store-caption {
      color: #9a95a0;
      font-size: 10px;
      margin-top: 5px;
    }

    .store-open {
      margin-top: 12px;
      border: 1px solid #e8e5eb;
      background: #faf9fb;
      color: #5e5965;
      padding: 7px 13px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
    }

    .store-card:hover .store-open {
      background: #eeecf1;
      border-color: #dcd8e1;
    }

    /* Empty state */

    .empty-state {
      background: rgba(255,255,255,.8);
      border: 1px dashed #d9d5de;
      border-radius: 17px;
      padding: 53px 18px;
      text-align: center;
    }

    .empty-icon {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #efedf1;
      color: #716b77;
      font-size: 29px;
      margin: 0 auto 16px;
    }

    .empty-state h3 {
      font-size: 16px;
      margin-bottom: 8px;
      color: #393540;
    }

    .empty-state p {
      max-width: 390px;
      margin: 0 auto;
      font-size: 12px;
      color: #96909c;
      line-height: 1.7;
    }

    .empty-state button {
      margin-top: 17px;
      border: 1px solid #e4e0e8;
      background: #f3f1f5;
      color: #55505b;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
    }

    .loading {
      text-align: center;
      padding: 50px 15px;
      color: #918b98;
      font-size: 12px;
    }

    .message {
      display: none;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 15px;
      font-size: 12px;
      color: #716b77;
      line-height: 1.6;
    }

    .message.show {
      display: block;
    }

    footer {
      text-align: center;
      color: #aaa5ae;
      font-size: 10px;
      padding: 28px 10px;
    }

    @media (max-width: 650px) {
      .topbar {
        height: 60px;
        padding: 0 4%;
      }

      .brand {
        font-size: 19px;
      }

      .top-links {
        gap: 12px;
        font-size: 11px;
      }

      .page {
        width: 92%;
        margin-top: 29px;
      }

      .hero {
        margin-bottom: 22px;
      }

      .hero-icon {
        width: 49px;
        height: 49px;
        border-radius: 15px;
      }

      .search-box {
        min-height: 53px;
        padding-left: 12px;
      }

      .search-button {
        padding: 11px 15px;
      }

      .stores-grid {
        column-gap: 10px;
        row-gap: 15px;
      }

      .store-card {
        padding: 16px 6px 13px;
        border-radius: 12px;
      }

      .store-logo-wrap {
        width: 74px;
        height: 74px;
        margin-bottom: 10px;
      }

      .store-name {
        font-size: 11px;
      }

      .store-caption {
        font-size: 9px;
      }

      .store-open {
        margin-top: 9px;
        font-size: 9px;
        padding: 6px 10px;
      }

      .store-heading h2 {
        font-size: 16px;
      }
    }

    @media (max-width: 370px) {
      .top-links {
        gap: 8px;
        font-size: 10px;
      }

      .store-logo-wrap {
        width: 65px;
        height: 65px;
      }

      .store-card {
        padding: 13px 4px 11px;
      }

      .store-name {
        font-size: 10px;
      }

      .search-button {
        padding: 10px 11px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <a href="dashboard.html" class="brand">
      <span class="brand-mark">♛</span>
      EarnGig
    </a>

    <nav class="top-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="marketplace.html">Marketplace</a>
      <a href="vendor-haul.html" class="current">Vendor Haul</a>
    </nav>
  </header>

  <main class="page">

    <section class="hero">
      <div>
        <h1>Vendor Haul</h1>
        <p>
          Discover independent stores and shop directly from
          registered EarnGig vendors.
        </p>
      </div>

      <div class="hero-icon">▣</div>
    </section>

    <section class="search-area">
      <form class="search-box" id="searchForm">
        <span class="search-icon">⌕</span>

        <input
          type="search"
          id="vendorSearch"
          placeholder="Search for a vendor or store name..."
          autocomplete="off"
        >

        <button type="button" class="search-clear" id="clearSearch">
          Clear
        </button>

        <button type="submit" class="search-button">
          Search
        </button>
      </form>
    </section>

    <div class="message" id="pageMessage"></div>

    <section>
      <div class="store-heading">
        <h2 id="storeHeading">Explore Stores</h2>
        <span class="store-count" id="storeCount">0 Stores</span>
      </div>

      <div id="storesGrid" class="stores-grid">
        <div class="loading">Loading registered stores...</div>
      </div>
    </section>

  </main>

  <footer>
    EarnGig Vendor Haul · Discover stores and shop with confidence.
  </footer>

  <script>
    /*
      VENDOR HAUL CONFIGURATION

      Connect this page to your EarnGig backend.

      Expected endpoint:
      GET /vendor-haul/stores

      Example response:
      {
        "stores": [
          {
            "id": "vendor123",
            "name": "Luxe Fashion",
            "logo": "https://example.com/store-logo.jpg",
            "description": "Fashion and accessories",
            "storefrontUrl": "vendor-store.html?vendor=vendor123"
          }
        ]
      }

      The localStorage fallback is for development previews only.
      For a live website, use the backend so all users see the same
      registered vendor storefronts.
    */

    const API_BASE = "https://YOUR-BACKEND-DOMAIN/api";
    const LOCAL_STORES_KEY = "earngig_vendor_stores";

    let allStores = [];
    let displayedStores = [];

    const grid = document.getElementById("storesGrid");
    const searchInput = document.getElementById("vendorSearch");
    const clearButton = document.getElementById("clearSearch");
    const storeCount = document.getElementById("storeCount");
    const pageMessage = document.getElementById("pageMessage");

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function getInitials(name) {
      const words = String(name || "Store")
        .trim()
        .split(/\s+/)
        .filter(Boolean);

      if (!words.length) return "S";

      return words.slice(0, 2)
        .map(word => word.charAt(0).toUpperCase())
        .join("");
    }

    function normalizeStore(store) {
      return {
        id: store.id || store.vendorId || store.vendor_id || "",
        name: store.name ||
          store.storeName ||
          store.store_name ||
          store.businessName ||
          "Unnamed Store",
        logo: store.logo ||
          store.logoUrl ||
          store.logo_url ||
          store.storeLogo ||
          store.store_logo ||
          "",
        description: store.description || store.category || "",
        storefrontUrl: store.storefrontUrl ||
          store.storefront_url ||
          ""
      };
    }

    async function loadStores() {
      grid.innerHTML = '<div class="loading">Loading registered stores...</div>';
      pageMessage.classList.remove("show");

      try {
        let stores = [];

        if (!API_BASE.includes("YOUR-BACKEND-DOMAIN")) {
          const response = await fetch(
            API_BASE.replace(/\/$/, "") + "/vendor-haul/stores",
            { credentials: "include" }
          );

          if (!response.ok) {
            throw new Error("Could not retrieve registered stores.");
          }

          const data = await response.json();

          stores = Array.isArray(data)
            ? data
            : Array.isArray(data.stores)
              ? data.stores
              : [];

        } else {
          // Development preview only.
          const saved = localStorage.getItem(LOCAL_STORES_KEY);
          stores = saved ? JSON.parse(saved) : [];

          pageMessage.textContent =
            "Preview mode: connect the EarnGig vendor registration backend to display registered storefronts for all users.";
          pageMessage.classList.add("show");
        }

        allStores = stores
          .filter(store => {
            const status = String(
              store.status || store.accountStatus || "active"
            ).toLowerCase();

            return (
              store.isStorefront !== false &&
              store.is_storefront !== false &&
              store.storefrontEnabled !== false &&
              !["suspended", "blocked", "disabled", "rejected"].includes(status)
            );
          })
          .map(normalizeStore)
          .filter(store => store.id && store.name);

        searchStores();

      } catch (error) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1">
            <div class="empty-icon">↻</div>
            <h3>We couldn't load the stores</h3>
            <p>${escapeHTML(error.message)}</p>
            <button onclick="loadStores()">Try Again</button>
          </div>
        `;
        storeCount.textContent = "Unavailable";
      }
    }

    function searchStores() {
      const query = searchInput.value.trim().toLowerCase();

      displayedStores = allStores.filter(store => {
        const nameMatch = store.name.toLowerCase().includes(query);
        const descriptionMatch =
          String(store.description).toLowerCase().includes(query);

        return nameMatch || descriptionMatch;
      });

      clearButton.classList.toggle("show", query.length > 0);

      renderStores();
    }

    function renderStores() {
      storeCount.textContent =
        `${displayedStores.length} ${displayedStores.length === 1 ? "Store" : "Stores"}`;

      if (!displayedStores.length) {
        const isSearching = searchInput.value.trim().length > 0;

        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1">
            <div class="empty-icon">${isSearching ? "⌕" : "▣"}</div>
            <h3>${isSearching ? "No matching stores found" : "No registered stores yet"}</h3>
            <p>
              ${isSearching
                ? "We couldn't find a vendor matching your search. Try another store name."
                : "Registered EarnGig vendor storefronts will appear here when they become available."}
            </p>
            ${isSearching
              ? '<button onclick="clearSearch()">Show All Stores</button>'
              : ""}
          </div>
        `;
        return;
      }

      grid.innerHTML = displayedStores.map(store => {
        const name = escapeHTML(store.name);
        const initials = escapeHTML(getInitials(store.name));
        const logo = escapeHTML(store.logo);
        const description = escapeHTML(store.description);

        return `
          <article
            class="store-card"
            role="link"
            tabindex="0"
            aria-label="Open ${name} storefront"
            data-store-id="${escapeHTML(store.id)}"
          >
            <div class="store-logo-wrap">
              ${logo
                ? `<img
                    class="store-logo"
                    src="${logo}"
                    alt="${name} logo"
                    loading="lazy"
                    onerror="this.outerHTML='<div class=&quot;logo-placeholder&quot;>${initials}</div>'"
                  >`
                : `<div class="logo-placeholder">${initials}</div>`
              }
            </div>

            <div class="store-name">${name}</div>

            ${description
              ? `<div class="store-caption">${description}</div>`
              : `<div class="store-caption">EarnGig Store</div>`
            }

            <span class="store-open">Visit Store →</span>
          </article>
        `;
      }).join("");

      grid.querySelectorAll(".store-card").forEach(card => {
        const open = () => openStore(card.dataset.storeId);

        card.addEventListener("click", open);

        card.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            open();
          }
        });
      });
    }

    function openStore(id) {
      const store = allStores.find(item => String(item.id) === String(id));
      if (!store) return;

      if (store.storefrontUrl) {
        const url = new URL(store.storefrontUrl, window.location.href);

        // Only allow same-site storefront navigation.
        if (url.origin === window.location.origin) {
          window.location.href = url.href;
          return;
        }
      }

      // Default root-level storefront page.
      window.location.href =
        "vendor-store.html?vendor=" + encodeURIComponent(store.id);
    }

    document.getElementById("searchForm").addEventListener("submit", event => {
      event.preventDefault();
      searchStores();
    });

    searchInput.addEventListener("input", searchStores);

    function clearSearch() {
      searchInput.value = "";
      searchStores();
      searchInput.focus();
    }

    clearButton.addEventListener("click", clearSearch);

    loadStores();
  </script>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EarnGig Survival</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#26382d;font-family:Arial,sans-serif;touch-action:none}
canvas{width:100%;height:100%;display:block}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px;z-index:3;pointer-events:none}
.stat{background:#14291feF;border:1px solid #9caf8d;border-radius:13px;padding:9px 11px;box-shadow:0 4px 14px #0007}
.stat small{display:block;color:#c4d1c0;font-size:9px;letter-spacing:1px}
.stat strong{display:block;color:white;font-size:20px;margin-top:5px;white-space:nowrap}
#remaining{color:#f4c66d}
#health{color:#ff8290}
#alarm{display:none;position:absolute;top:83px;left:50%;transform:translateX(-50%);color:#ff6a61;font-weight:bold;text-shadow:0 2px 5px #000;z-index:4;white-space:nowrap}
#controls{position:absolute;bottom:25px;right:25px;z-index:4}
#stick{width:120px;height:120px;border-radius:50%;background:#172d26dc;border:3px solid #a9bda477;position:relative;touch-action:none;box-shadow:0 5px 15px #0006}
#nub{position:absolute;left:33px;top:33px;width:48px;height:48px;border-radius:50%;background:#e0ead6;border:4px solid #718e6a;box-shadow:0 3px 10px #0008}
#screen{position:absolute;inset:0;z-index:6;background:#101a15ed;display:flex;align-items:center;justify-content:center;padding:20px;color:white;text-align:center}
#screen.hide{display:none}
.panel{width:min(390px,100%);padding:25px 22px;border:2px solid #91a981;border-radius:20px;background:linear-gradient(145deg,#2a4936,#172a21);box-shadow:0 15px 45px #0009}
.panel h1{color:#f3c56c;font-size:29px;margin:0 0 14px}
.panel p{font-size:14px;line-height:1.6;color:#e1e8dd}
.panel button{background:#edb75f;color:#302313;border:0;border-radius:12px;padding:15px 30px;font-weight:900;font-size:16px;margin-top:12px}
#status{font-size:12px;color:#f5d18b;min-height:18px}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
 <div class="stat"><small>ASSASSINS LEFT</small><strong id="remaining">0 / 0</strong></div>
 <div class="stat"><small>HEALTH</small><strong id="health">❤️❤️❤️</strong></div>
 <div class="stat"><small>TIME LEFT</small><strong id="clock">02:00</strong></div>
</div>

<div id="alarm">⚠ YOU HAVE BEEN SPOTTED!</div>

<div id="controls">
 <div id="stick"><div id="nub"></div></div>
</div>

<div id="screen">
 <div class="panel">
  <h1 id="heading">SURVIVAL</h1>
  <p id="message">Stay out of the assassins' vision. Sneak behind them and eliminate them with your knife. If they spot you, they will shoot and call for backup.</p>
  <p><b>8–12 assassins · 2 minutes · Stealth mission</b></p>
  <p id="status"></p>
  <button id="start">START GAME</button>
 </div>
</div>

<script>
"use strict";

const $=id=>document.getElementById(id);
const canvas=$("game");
const ctx=canvas.getContext("2d");

const CFG={
 time:120,
 min:8,
 max:12,
 speed:190,
 vision:315,
 angle:1.05,
 takedown:43,
 bulletSpeed:410,
 fireRate:1.05,
 damageDelay:.9
};

let W,H,DPR;
let world,player,enemies,obstacles,bullets,particles;
let running=false,ended=false,resultSent=false;
let seconds=120,last=0,count=0,alarm=0,damageDelay=0;
let camera={x:900,y:900};
let moveX=0,moveY=0,joy=false;
let matchId="";
let mapStyle=0;

function resize(){
 DPR=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=W*DPR;canvas.height=H*DPR;
 canvas.style.width=W+"px";canvas.style.height=H+"px";
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);resize();

const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angleDiff=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));

/* ---------- MAP ---------- */
function createMap(){
 world={w:1800,h:1800};
 obstacles=[];
 mapStyle=Math.floor(rnd(0,3));

 // Dense but connected cover.
 for(let y=35;y<1750;y+=115){
  for(let x=35;x<1750;x+=115){
   if(Math.hypot(x-900,y-900)<190)continue;
   if(Math.random()<.18)continue;

   let type=Math.random();
   obstacles.push({
    x:x+rnd(-5,10),y:y+rnd(-5,10),
    w:rnd(66,88),h:rnd(66,88),
    type:type<.5?"crate":type<.8?"wall":"container",
    shade:Math.floor(rnd(0,3))
   });
  }
 }

 // Add extra hiding places in open areas.
 for(let i=0;i<32;i++){
  let x=rnd(80,1700),y=rnd(80,1700);
  if(Math.hypot(x-900,y-900)<220)continue;
  if(collides(x,y,35))continue;
  obstacles.push({
   x,y,w:rnd(65,95),h:rnd(65,95),
   type:Math.random()<.5?"crate":"container",
   shade:Math.floor(rnd(0,3))
  });
 }
}

function collides(x,y,r=14){
 return obstacles.some(o=>
  x+r>o.x&&x-r<o.x+o.w&&
  y+r>o.y&&y-r<o.y+o.h
 );
}
function moveEntity(o,dx,dy,r=14){
 if(!collides(o.x+dx,o.y,r))o.x+=dx;
 if(!collides(o.x,o.y+dy,r))o.y+=dy;
 o.x=clamp(o.x,18,world.w-18);
 o.y=clamp(o.y,18,world.h-18);
}
function blockedSight(x1,y1,x2,y2){
 let n=Math.ceil(Math.hypot(x2-x1,y2-y1)/8);
 for(let i=1;i<n;i++){
  let t=i/n,x=x1+(x2-x1)*t,y=y1+(y2-y1)*t;
  if(obstacles.some(o=>x>o.x&&x<o.x+o.w&&y>o.y&&y<o.y+o.h))return true;
 }
 return false;
}

/* ---------- CHARACTERS ---------- */
const skinTones=["#d49a70","#9a6246","#e4b28a","#75462f"];
const outfits=[
 {shirt:"#e46c32",pants:"#28333b",accent:"#f4bd42"},
 {shirt:"#d8d8d1",pants:"#35414a",accent:"#83949c"},
 {shirt:"#293c52",pants:"#202b37",accent:"#d1a34c"},
 {shirt:"#657b46",pants:"#303b32",accent:"#c0a36a"},
 {shirt:"#a13c45",pants:"#292e39",accent:"#d6b06a"},
 {shirt:"#c2a15b",pants:"#343333",accent:"#e0c68a"}
];

function newCharacter(x,y,isPlayer=false,index=0){
 const outfit=outfits[index%outfits.length];
 return {
  x,y,a:rnd(0,Math.PI*2),
  skin:isPlayer?"#9b6247":skinTones[index%skinTones.length],
  shirt:isPlayer?"#202a40":outfit.shirt,
  pants:isPlayer?"#202632":outfit.pants,
  accent:isPlayer?"#c84c55":outfit.accent,
  hair:isPlayer?"#171b25":["#17191d","#32231d","#252b32","#17191d"][index%4],
  scarf:isPlayer?"#bd344c":outfit.accent,
  isPlayer,
  walk:0,
  state:"patrol",
  turn:rnd(1,3),
  alert:0,
  lastX:0,lastY:0,
  fire:rnd(.4,1.3),
  dead:false,
  index
 };
}

/* Draws a detailed top-down human character. */
function drawHuman(c){
 ctx.save();
 ctx.translate(c.x,c.y);
 ctx.rotate(c.a+Math.PI/2);

 // Soft grounded shadow.
 ctx.fillStyle="#14231c70";
 ctx.beginPath();ctx.ellipse(0,9,23,15,0,0,Math.PI*2);ctx.fill();

 const step=Math.sin(c.walk*12)*4;
 const moving=c.walk>0;

 // Boots.
 ctx.fillStyle="#191d24";
 roundRect(-12,-26+step,9,15,3);
 roundRect(4,-26-step,9,15,3);

 // Legs.
 ctx.fillStyle=c.pants;
 roundRect(-13,-22+step,10,22,4);
 roundRect(3,-22-step,10,22,4);

 // Body.
 ctx.fillStyle=c.shirt;
 roundRect(-17,-8,34,37,10);

 // Clothing panels and belt.
 ctx.fillStyle=c.accent;
 roundRect(-13,4,26,4,2);
 ctx.fillStyle="#30343a";
 roundRect(-15,13,30,6,2);

 // Arms, swinging during movement.
 ctx.save();
 ctx.rotate(moving?Math.sin(c.walk*12)*.13:0);
 ctx.fillStyle=c.shirt;
 roundRect(-24,-4,9,24,5);
 roundRect(15,-4,9,24,5);
 ctx.fillStyle=c.skin;
 roundRect(-23,15,8,12,4);
 roundRect(15,15,8,12,4);
 ctx.restore();

 // Neck.
 ctx.fillStyle=c.skin;
 roundRect(-6,-15,12,12,4);

 // Head.
 ctx.fillStyle=c.skin;
 ctx.beginPath();
 ctx.ellipse(0,-23,13,16,0,0,Math.PI*2);ctx.fill();

 // Hair/head covering.
 ctx.fillStyle=c.hair;
 ctx.beginPath();
 ctx.ellipse(0,-30,13,10,0,Math.PI,Math.PI*2);ctx.fill();

 // Eyes.
 ctx.fillStyle="#211d1b";
 ctx.beginPath();
 ctx.arc(-5,-23,1.5,0,Math.PI*2);
 ctx.arc(5,-23,1.5,0,Math.PI*2);ctx.fill();

 // Scarf.
 if(c.isPlayer){
  ctx.fillStyle=c.scarf;
  ctx.beginPath();
  ctx.moveTo(-9,-13);ctx.lineTo(9,-13);
  ctx.lineTo(6,-7);ctx.lineTo(-8,-7);ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-7,-11);ctx.lineTo(-20,-3);
  ctx.lineTo(-12,-2);ctx.fill();
 }

 if(c.isPlayer){
  // Visible knife in player's right hand.
  ctx.save();
  ctx.translate(19,24);
  ctx.rotate(-.55);
  ctx.fillStyle="#76513b";
  roundRect(-3,-2,6,12,2);
  ctx.fillStyle="#dce6e8";
  ctx.beginPath();
  ctx.moveTo(-2,9);ctx.lineTo(2,9);ctx.lineTo(5,28);
  ctx.lineTo(-1,26);ctx.fill();
  ctx.restore();
 }else{
  // Gun held by every assassin.
  ctx.save();
  ctx.translate(18,21);
  ctx.rotate(-.65);
  ctx.fillStyle="#25282d";
  roundRect(-4,-5,8,28,2);
  ctx.fillStyle="#777f83";
  roundRect(-2,-17,4,15,1);
  ctx.restore();
 }

 // Small clothing details.
 ctx.fillStyle="#e4c17b";
 ctx.beginPath();ctx.arc(0,1,2,0,Math.PI*2);ctx.fill();

 ctx.restore();
}

function roundRect(x,y,w,h,r){
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fill();
}

/* ---------- ENVIRONMENT ART ---------- */
function drawFloor(){
 const floors=["#9aa995","#929e9b","#a4a48f"];
 ctx.fillStyle=floors[mapStyle];
 ctx.fillRect(0,0,world.w,world.h);

 for(let y=0;y<world.h;y+=105){
  for(let x=0;x<world.w;x+=105){
   ctx.fillStyle=((x/105+y/105)%2===0)?"#ffffff0b":"#18281b0b";
   ctx.fillRect(x,y,105,105);
  }
 }
 for(let i=0;i<150;i++){
  let x=i*173%world.w,y=i*291%world.h;
  ctx.fillStyle="#4d604a30";
  ctx.beginPath();ctx.arc(x,y,i%4+2,0,Math.PI*2);ctx.fill();
 }
}

function drawObstacle(o){
 ctx.save();
 ctx.shadowColor="#17221a99";ctx.shadowBlur=9;ctx.shadowOffsetY=7;

 if(o.type==="crate"){
  ctx.fillStyle=["#087d6a","#167b65","#9b5438"][o.shade];
  ctx.fillRect(o.x,o.y,o.w,o.h);
  ctx.shadowColor="transparent";
  ctx.strokeStyle="#b0c6a1";ctx.lineWidth=5;
  ctx.strokeRect(o.x+4,o.y+4,o.w-8,o.h-8);
  ctx.strokeStyle="#ffffff35";ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(o.x+8,o.y+8);ctx.lineTo(o.x+o.w-8,o.y+o.h-8);
  ctx.moveTo(o.x+o.w-8,o.y+8);ctx.lineTo(o.x+8,o.y+o.h-8);ctx.stroke();
 }else if(o.type==="container"){
  ctx.fillStyle="#087363";ctx.fillRect(o.x,o.y,o.w,o.h);
  ctx.shadowColor="transparent";
  ctx.strokeStyle="#5e9a7c";ctx.lineWidth=5;
  ctx.strokeRect(o.x+4,o.y+4,o.w-8,o.h-8);
  ctx.strokeStyle="#ffffff25";
  for(let x=o.x+12;x<o.x+o.w-8;x+=12){
   ctx.beginPath();ctx.moveTo(x,o.y+8);ctx.lineTo(x,o.y+o.h-8);ctx.stroke();
  }
 }else{
  ctx.fillStyle="#31523b";ctx.fillRect(o.x,o.y,o.w,o.h);
  ctx.shadowColor="transparent";
  ctx.fillStyle="#203c2b";ctx.fillRect(o.x+9,o.y+9,o.w-18,o.h-18);
  ctx.strokeStyle="#72916d";ctx.lineWidth=4;
  ctx.strokeRect(o.x+4,o.y+4,o.w-8,o.h-8);
 }
 ctx.restore();
}

/* ---------- VISION ---------- */
function canSee(e){
 if(dist(e,player)>CFG.vision)return false;
 const a=Math.atan2(player.y-e.y,player.x-e.x);
 if(Math.abs(angleDiff(a,e.a))>CFG.angle/2)return false;
 return !blockedSight(e.x,e.y,player.x,player.y);
}

function drawVision(e){
 ctx.save();
 ctx.beginPath();ctx.moveTo(e.x,e.y);

 for(let i=0;i<=42;i++){
  const a=e.a-CFG.angle/2+i/42*CFG.angle;
  let max=CFG.vision;
  for(let d=10;d<CFG.vision;d+=7){
   let x=e.x+Math.cos(a)*d,y=e.y+Math.sin(a)*d;
   if(obstacles.some(o=>x>o.x&&x<o.x+o.w&&y>o.y&&y<o.y+o.h)){
    max=d;break;
   }
  }
  ctx.lineTo(e.x+Math.cos(a)*max,e.y+Math.sin(a)*max);
 }
 ctx.closePath();
 let g=ctx.createRadialGradient(e.x,e.y,5,e.x,e.y,CFG.vision);
 g.addColorStop(0,"#fff0a75c");
 g.addColorStop(.8,"#fff0a51b");
 g.addColorStop(1,"#fff0a500");
 ctx.fillStyle=g;ctx.fill();
 ctx.strokeStyle="#fff1a64c";ctx.lineWidth=1;ctx.stroke();
 ctx.restore();
}

/* ---------- MATCH SETUP ---------- */
function startGame(){
 if(running)return;

 createMap();
 count=Math.floor(rnd(CFG.min,CFG.max+1));
 seconds=CFG.time;alarm=0;damageDelay=0;
 bullets=[];particles=[];
 player=newCharacter(900,900,true,0);
 enemies=[];

 let tries=0;
 while(enemies.length<count&&tries<8000){
  tries++;
  let a=rnd(0,Math.PI*2),d=rnd(340,740);
  let x=clamp(player.x+Math.cos(a)*d,30,1770);
  let y=clamp(player.y+Math.sin(a)*d,30,1770);
  if(collides(x,y,24))continue;
  if(enemies.some(e=>dist(e,{x,y})<115))continue;
  enemies.push(newCharacter(x,y,false,Math.floor(rnd(0,6))));
 }

 camera={x:player.x,y:player.y};
 matchId=crypto.randomUUID?crypto.randomUUID():String(Date.now());
 ended=false;resultSent=false;running=true;

 $("remaining").textContent=count+" / "+count;
 $("health").textContent="❤️❤️❤️";
 $("clock").textContent="02:00";
 $("alarm").style.display="none";
 $("status").textContent="";
 $("screen").classList.add("hide");
 $("start").textContent="START GAME";
 $("start").disabled=false;

 last=performance.now();
 requestAnimationFrame(loop);
}

/* ---------- TAKEDOWNS ---------- */
function takedowns(){
 for(const e of enemies){
  if(e.dead||dist(player,e)>CFG.takedown)continue;
  const a=Math.atan2(player.y-e.y,player.x-e.x);
  const behind=Math.abs(angleDiff(a,e.a))>2.2;
  if(behind||!canSee(e)){
   e.dead=true;
   for(let i=0;i<9;i++)particles.push({
    x:e.x,y:e.y,vx:rnd(-40,40),vy:rnd(-40,40),life:.5
   });
  }
 }
 const left=enemies.filter(e=>!e.dead).length;
 $("remaining").textContent=left+" / "+count;
 if(left===0)finish(true,"MISSION COMPLETE!","You eliminated every assassin.");
}

/* ---------- ALARM / SHOOTING ---------- */
function alertAll(){
 alarm=4;
 for(const e of enemies){
  if(e.dead)continue;
  e.state="hunt";e.alert=9;
  e.lastX=player.x;e.lastY=player.y;
 }
}

function shoot(e){
 const a=Math.atan2(player.y-e.y,player.x-e.x);
 e.a=a;
 bullets.push({
  x:e.x+Math.cos(a)*26,y:e.y+Math.sin(a)*26,
  vx:Math.cos(a)*CFG.bulletSpeed,
  vy:Math.sin(a)*CFG.bulletSpeed,
  life:1.3
 });
}

function updateEnemies(dt){
 for(const e of enemies){
  if(e.dead)continue;

  if(canSee(e)){
   if(e.state!=="hunt")alertAll();
   e.state="hunt";e.alert=8;
   e.lastX=player.x;e.lastY=player.y;
  }

  if(e.state==="patrol"){
   e.turn-=dt;
   if(e.turn<=0){
    e.a+=rnd(-1.4,1.4);e.turn=rnd(1,2.5);
   }
   continue;
  }

  const d=Math.hypot(e.lastX-e.x,e.lastY-e.y);
  if(d>65){
   let a=Math.atan2(e.lastY-e.y,e.lastX-e.x);
   e.a=a;
   moveEntity(e,Math.cos(a)*e.speed*dt,Math.sin(a)*e.speed*dt,14);
   e.walk+=dt;
  }

  if(canSee(e)){
   e.a=Math.atan2(player.y-e.y,player.x-e.x);
   e.fire-=dt;
   if(e.fire<=0){
    shoot(e);e.fire=CFG.fireRate+rnd(0,.4);
   }
  }else{
   e.alert-=dt;
   if(e.alert<=0)e.state="patrol";
  }

  if(dist(e,player)<22){
   finish(false,"YOU WERE CAUGHT","An assassin caught you. Your match is over.");
   return;
  }
 }
}

/* ---------- BULLETS / THREE HITS ---------- */
function updateBullets(dt){
 for(const b of bullets){
  if(b.life<=0)continue;
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;

  if(obstacles.some(o=>b.x>o.x&&b.x<o.x+o.w&&b.y>o.y&&b.y<o.y+o.h)){
   b.life=0;continue;
  }

  if(Math.hypot(b.x-player.x,b.y-player.y)<17){
   b.life=0;
   if(damageDelay>0)continue;
   damageDelay=CFG.damageDelay;
   player.health--;

   $("health").textContent=
    "❤️".repeat(player.health)+"🖤".repeat(3-player.health);

   if(player.health<=0){
    finish(false,"YOU LOST","You were shot three times. Your match is over.");
    return;
   }
  }
 }
 bullets=bullets.filter(b=>b.life>0);
}

/* ---------- UPDATE ---------- */
function update(dt){
 if(!running||ended)return;

 seconds=Math.max(0,seconds-dt);
 damageDelay=Math.max(0,damageDelay-dt);

 let t=Math.ceil(seconds);
 $("clock").textContent=String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");

 if(seconds<=0){
  finish(false,"TIME UP","You did not eliminate every assassin in time.");
  return;
 }

 const length=Math.hypot(moveX,moveY);
 if(length>.08){
  let dx=moveX/Math.max(1,length),dy=moveY/Math.max(1,length);
  player.a=Math.atan2(dy,dx);
  moveEntity(player,dx*CFG.speed*dt,dy*CFG.speed*dt,14);
  player.walk+=dt;
 }else player.walk=0;

 takedowns();
 if(!running)return;

 updateEnemies(dt);
 if(!running)return;

 updateBullets(dt);
 if(!running)return;

 alarm=Math.max(0,alarm-dt);
 $("alarm").style.display=alarm>0?"block":"none";

 camera.x+=(player.x-camera.x)*Math.min(1,dt*8);
 camera.y+=(player.y-camera.y)*Math.min(1,dt*8);

 particles=particles.filter(p=>p.life>0);
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}
}

/* ---------- RENDER ---------- */
function draw(){
 if(!world)return;
 ctx.clearRect(0,0,W,H);

 const zoom=clamp(Math.min(W/390,H/700)*1.14,.9,1.25);

 ctx.save();
 ctx.translate(W/2,H/2);
 ctx.scale(zoom,zoom);
 ctx.translate(-camera.x,-camera.y);

 drawFloor();
 for(const o of obstacles)drawObstacle(o);
 for(const e of enemies)if(!e.dead)drawVision(e);
 for(const e of enemies)if(!e.dead)drawHuman(e);
 drawHuman(player);

 for(const b of bullets){
  ctx.strokeStyle="#ffe5a1";ctx.lineWidth=3;
  ctx.shadowColor="#ffd35e";ctx.shadowBlur=8;
  ctx.beginPath();ctx.moveTo(b.x-b.vx*.025,b.y-b.vy*.025);ctx.lineTo(b.x,b.y);ctx.stroke();
  ctx.shadowBlur=0;
 }

 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life*2);
  ctx.fillStyle="#d8c4a2";ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
 ctx.restore();
}

/* ---------- END MATCH ---------- */
async function finish(won,title,message){
 if(ended)return;
 ended=true;running=false;
 moveX=0;moveY=0;joy=false;

 $("heading").textContent=title;
 $("message").textContent=message;
 $("status").textContent="Submitting match result...";
 $("screen").classList.remove("hide");
 $("start").disabled=true;
 $("start").textContent="PLEASE WAIT";

 if(resultSent)return;
 resultSent=true;

 const result={
  matchId,
  game:"survival",
  won,
  assassinsSelected:count,
  assassinsEliminated:enemies.filter(e=>e.dead).length,
  durationSeconds:Math.round(CFG.time-seconds)
 };

 try{
  const response=await fetch("/api/survival/complete",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   credentials:"include",
   body:JSON.stringify(result)
  });
  if(!response.ok)throw new Error("Verification unavailable");
  const data=await response.json();

  if(data.verified===true&&data.rewardGranted===true){
   $("status").textContent="Reward confirmed. Returning to Games...";
   $("start").textContent="RETURN TO GAMES";
   $("start").disabled=false;
   $("start").onclick=()=>location.replace("games.html");
   setTimeout(()=>location.replace("games.html"),1800);
  }else throw new Error("Reward not confirmed");
 }catch(err){
  console.warn(err);
  $("status").textContent="Result awaiting verification. You can return to Games.";
  $("start").textContent="RETURN TO GAMES";
  $("start").disabled=false;
  $("start").onclick=()=>location.href="games.html";
 }
}

/* ---------- JOYSTICK ---------- */
const stick=$("stick"),nub=$("nub");

function joystick(e){
 const r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 let len=Math.hypot(dx,dy),max=39;
 if(len>max){dx=dx/len*max;dy=dy/len*max;}
 moveX=dx/max;moveY=dy/max;
 nub.style.left=(33+dx)+"px";
 nub.style.top=(33+dy)+"px";
}

stick.addEventListener("pointerdown",e=>{
 joy=true;stick.setPointerCapture(e.pointerId);joystick(e);
});
stick.addEventListener("pointermove",e=>{if(joy)joystick(e);});
function stopJoy(){
 joy=false;moveX=0;moveY=0;
 nub.style.left="33px";nub.style.top="33px";
}
stick.addEventListener("pointerup",stopJoy);
stick.addEventListener("pointercancel",stopJoy);

const keys={};
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function keyboard(){
 if(joy)return;
 moveX=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0);
 moveY=(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0);
}

/* ---------- GAME LOOP ---------- */
function loop(now){
 if(!running||ended)return;
 const dt=Math.min((now-last)/1000,.04);
 last=now;
 keyboard();
 update(dt);
 draw();
 if(running&&!ended)requestAnimationFrame(loop);
}

$("start").addEventListener("click",()=>{
 if(running||ended)return;
 startGame();
});

draw();
</script>

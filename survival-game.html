
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EarnGig Survival</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#24352a;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;gap:5px;pointer-events:none;z-index:3}
.stat{background:#17271fee;border:1px solid #8da77d;border-radius:11px;padding:8px 9px;box-shadow:0 4px 12px #0008;min-width:0}
.stat small{display:block;color:#c5d1bd;font-size:9px;letter-spacing:.7px;white-space:nowrap}
.stat strong{display:block;font-size:19px;color:#fff;margin-top:4px;white-space:nowrap}
#remaining{color:#f5c66c}
#health{color:#ff8178}
#alarm{position:absolute;top:85px;left:50%;transform:translateX(-50%);display:none;color:#ff6258;font-weight:900;font-size:13px;text-shadow:0 2px 5px #000;z-index:4;white-space:nowrap}
#controls{position:absolute;bottom:24px;left:0;right:0;padding:0 24px;display:flex;justify-content:flex-end;z-index:3;pointer-events:none}
#stick{width:118px;height:118px;border-radius:50%;background:#172b26dc;border:3px solid #a4b89a99;position:relative;box-shadow:inset 0 4px 14px #0005;touch-action:none;pointer-events:auto}
#nub{position:absolute;width:48px;height:48px;border-radius:50%;left:32px;top:32px;background:#dce6d2;border:4px solid #6a8867;box-shadow:0 4px 12px #0008}
#screen{position:absolute;inset:0;background:#101a15ed;display:flex;align-items:center;justify-content:center;z-index:6;padding:20px;text-align:center;color:white}
#screen.hide{display:none}
.panel{width:min(390px,100%);padding:25px 21px;border:2px solid #829b72;border-radius:20px;background:linear-gradient(145deg,#2b4835,#172a21);box-shadow:0 15px 50px #0009}
.panel h1{margin:0 0 12px;color:#f1c46e;font-size:29px}
.panel p{font-size:14px;line-height:1.6;color:#e0e8db}
.panel button{margin-top:12px;border:0;border-radius:12px;padding:15px 28px;background:#edb65c;color:#2a2114;font-weight:900;font-size:16px}
#status{font-size:12px;color:#f5cf83;min-height:18px}
#start:disabled{opacity:.6}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
 <div class="stat">
  <small>ASSASSINS LEFT</small>
  <strong id="remaining">0 / 0</strong>
 </div>
 <div class="stat">
  <small>HEALTH</small>
  <strong id="health">❤️❤️❤️</strong>
 </div>
 <div class="stat">
  <small>TIME LEFT</small>
  <strong id="clock">02:00</strong>
 </div>
</div>

<div id="alarm">⚠ YOU HAVE BEEN SPOTTED!</div>

<div id="controls">
 <div id="stick"><div id="nub"></div></div>
</div>

<div id="screen">
 <div class="panel">
  <h1 id="heading">SURVIVAL</h1>
  <p id="message">Stay hidden. Watch the assassins' vision lights. Approach from behind or outside their vision and eliminate them automatically with your knife.</p>
  <p><b>8–12 assassins · 2 minutes · Stealth mission</b></p>
  <p id="status"></p>
  <button id="start">START GAME</button>
 </div>
</div>

<script>
"use strict";

/* ======================================
   SETTINGS
====================================== */
const CONFIG={
 duration:120,
 minAssassins:8,
 maxAssassins:12,
 playerSpeed:185,
 playerHealth:3,
 visionRange:310,
 visionAngle:0.96,
 takedownDistance:42,
 bulletSpeed:390,
 fireInterval:1.1,
 damageCooldown:0.85,
 cameraZoom:1.13
};

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);

let W,H,DPR;
let world,player,enemies,obstacles,bullets,particles;
let running=false,matchEnded=false,resultSubmitted=false;
let last=0,seconds=120,alarmTime=0,damageCooldown=0;
let camera={x:900,y:900};
let moveX=0,moveY=0,joystickActive=false;
let count=0,matchId=null,mapTheme=0,walkClock=0;

function resize(){
 DPR=Math.min(devicePixelRatio||1,2);
 W=innerWidth;
 H=innerHeight;
 canvas.width=W*DPR;
 canvas.height=H*DPR;
 canvas.style.width=W+"px";
 canvas.style.height=H+"px";
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
resize();

const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angleDiff=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));

/* ======================================
   LOAD THE REAL SPRITE SHEET
   Actual image: 1199 x 1312
   4 columns x 4 rows
====================================== */
const sprites=new Image();
sprites.src="survival-sprites.png";

let spriteReady=false;

sprites.onload=()=>{
 spriteReady=true;
 console.log("Survival character artwork loaded.");
 draw();
};

sprites.onerror=()=>{
 spriteReady=false;
 console.error("Cannot load survival-sprites.png. Check the filename and repository root.");
};

/* Grid positions based on the actual image dimensions. */
const SPRITE_W=1199;
const SPRITE_H=1312;
const CELL_W=SPRITE_W/4;
const CELL_H=SPRITE_H/4;

/*
 Row 0: four ninja front-view walking frames.
 Row 1: four ninja back-view walking frames.
 Rows 2 and 3: eight different armed assassins.
*/
function spriteCrop(row,col){
 return {
  x:col*CELL_W+5,
  y:row*CELL_H+5,
  w:CELL_W-10,
  h:CELL_H-10
 };
}

/* ======================================
   COLLISION AND MOVEMENT
====================================== */
function collides(x,y,r=15){
 return obstacles.some(o=>
  x+r>o.x&&x-r<o.x+o.w&&
  y+r>o.y&&y-r<o.y+o.h
 );
}

function moveEntity(obj,dx,dy,r=15){
 if(!collides(obj.x+dx,obj.y,r))obj.x+=dx;
 if(!collides(obj.x,obj.y+dy,r))obj.y+=dy;

 obj.x=clamp(obj.x,20,world.w-20);
 obj.y=clamp(obj.y,20,world.h-20);
}

function blockedSight(x1,y1,x2,y2){
 const steps=Math.ceil(Math.hypot(x2-x1,y2-y1)/7);

 for(let i=1;i<steps;i++){
  const t=i/steps;
  const x=x1+(x2-x1)*t;
  const y=y1+(y2-y1)*t;

  if(obstacles.some(o=>
   x>o.x&&x<o.x+o.w&&
   y>o.y&&y<o.y+o.h
  ))return true;
 }
 return false;
}

/* ======================================
   RANDOM, DENSE BATTLEFIELD
====================================== */
function createMap(){
 world={w:1800,h:1800};
 obstacles=[];
 mapTheme=Math.floor(rnd(0,3));

 const cell=120;

 for(let row=0;row<15;row++){
  for(let col=0;col<15;col++){
   const x=35+col*cell;
   const y=35+row*cell;

   // Clear player starting area.
   if(Math.hypot(x+40-900,y+40-900)<190)continue;

   // Leave connected walking routes.
   if(Math.random()<.24)continue;

   const roll=Math.random();
   const type=roll<.34?"wall":roll<.66?"crate":"container";

   obstacles.push({
    x:x+rnd(0,10),
    y:y+rnd(0,10),
    w:rnd(65,85),
    h:rnd(65,85),
    type,
    variant:Math.floor(rnd(0,7))
   });
  }
 }

 // Add cover in open sections.
 for(let i=0;i<30;i++){
  const x=rnd(100,1680);
  const y=rnd(100,1680);

  if(Math.hypot(x-900,y-900)<230)continue;
  if(collides(x,y,35))continue;

  obstacles.push({
   x,y,
   w:rnd(60,90),
   h:rnd(60,90),
   type:Math.random()<.5?"crate":"container",
   variant:Math.floor(rnd(0,7))
  });
 }
}

/* ======================================
   START MATCH
====================================== */
function startGame(){
 if(running)return;

 createMap();

 count=Math.floor(rnd(
  CONFIG.minAssassins,
  CONFIG.maxAssassins+1
 ));

 seconds=CONFIG.duration;
 alarmTime=0;
 damageCooldown=0;
 walkClock=0;

 matchEnded=false;
 resultSubmitted=false;

 bullets=[];
 particles=[];

 player={
  x:900,
  y:900,
  a:-Math.PI/2,
  speed:CONFIG.playerSpeed,
  health:CONFIG.playerHealth,
  walkFrame:0
 };

 enemies=[];
 let attempts=0;

 while(enemies.length<count&&attempts<7000){
  attempts++;

  const a=rnd(0,Math.PI*2);
  const d=rnd(350,780);
  const x=clamp(player.x+Math.cos(a)*d,35,1765);
  const y=clamp(player.y+Math.sin(a)*d,35,1765);

  if(collides(x,y,23))continue;
  if(enemies.some(e=>Math.hypot(e.x-x,e.y-y)<115))continue;

  // Assassin artwork index 0–7, from the bottom two rows.
  const assassinIndex=Math.floor(rnd(0,8));

  enemies.push({
   x,y,
   a:rnd(0,6.28),
   speed:rnd(43,56),
   state:"patrol",
   turn:rnd(1,3),
   alert:0,
   lastX:0,
   lastY:0,
   fireTimer:rnd(.4,1.2),
   sprite:assassinIndex,
   dead:false
  });
 }

 camera={x:player.x,y:player.y};
 matchId=crypto.randomUUID?
  crypto.randomUUID():String(Date.now());

 $("remaining").textContent=count+" / "+count;
 $("health").textContent="❤️❤️❤️";
 $("clock").textContent="02:00";
 $("alarm").style.display="none";
 $("status").textContent="";
 $("start").textContent="START GAME";
 $("start").disabled=false;
 $("screen").classList.add("hide");

 running=true;
 last=performance.now();

 requestAnimationFrame(loop);
}

/* ======================================
   ASSASSIN VISION
====================================== */
function canSee(e){
 if(dist(e,player)>CONFIG.visionRange)return false;

 const a=Math.atan2(player.y-e.y,player.x-e.x);

 if(Math.abs(angleDiff(a,e.a))>CONFIG.visionAngle/2)return false;

 return !blockedSight(e.x,e.y,player.x,player.y);
}

/* ======================================
   AUTOMATIC KNIFE TAKEDOWN
====================================== */
function automaticTakedowns(){
 if(!running||matchEnded)return;

 for(const e of enemies){
  if(e.dead)continue;

  if(dist(player,e)>CONFIG.takedownDistance)continue;

  const direction=Math.atan2(player.y-e.y,player.x-e.x);
  const behind=Math.abs(angleDiff(direction,e.a))>2.2;
  const visible=canSee(e);

  // Touch from behind OR touch outside the light.
  if(behind||!visible){
   e.dead=true;

   for(let i=0;i<12;i++){
    particles.push({
     x:e.x,y:e.y,
     vx:rnd(-35,35),
     vy:rnd(-35,35),
     life:.5
    });
   }
  }
 }

 updateCounter();
}

function updateCounter(){
 const remaining=enemies.filter(e=>!e.dead).length;

 // The original match count never changes.
 $("remaining").textContent=remaining+" / "+count;

 if(remaining===0&&running&&!matchEnded){
  finish(true,"MISSION COMPLETE!","You eliminated every assassin.");
 }
}

/* ======================================
   ALERT AND ASSASSIN SHOOTING
====================================== */
function alertAllAssassins(x,y){
 alarmTime=4;

 for(const e of enemies){
  if(e.dead)continue;

  e.state="hunt";
  e.alert=9;
  e.lastX=x;
  e.lastY=y;
 }
}

function shoot(e){
 const a=Math.atan2(player.y-e.y,player.x-e.x);

 e.a=a;

 bullets.push({
  x:e.x+Math.cos(a)*28,
  y:e.y+Math.sin(a)*28,
  vx:Math.cos(a)*CONFIG.bulletSpeed,
  vy:Math.sin(a)*CONFIG.bulletSpeed,
  life:1.2
 });
}

function updateEnemies(dt){
 for(const e of enemies){
  if(e.dead)continue;

  if(canSee(e)){
   if(e.state!=="hunt"){
    alertAllAssassins(player.x,player.y);
   }

   e.state="hunt";
   e.alert=8;
   e.lastX=player.x;
   e.lastY=player.y;
  }

  if(e.state==="patrol"){
   e.turn-=dt;

   if(e.turn<=0){
    e.a+=rnd(-1.3,1.3);
    e.turn=rnd(1.2,2.8);
   }
   continue;
  }

  const target={x:e.lastX,y:e.lastY};
  const d=dist(e,target);

  if(d>75){
   const a=Math.atan2(target.y-e.y,target.x-e.x);
   e.a=a;

   moveEntity(
    e,
    Math.cos(a)*e.speed*dt,
    Math.sin(a)*e.speed*dt,
    15
   );
  }

  if(canSee(e)){
   e.state="hunt";
   e.lastX=player.x;
   e.lastY=player.y;
   e.a=Math.atan2(player.y-e.y,player.x-e.x);

   e.fireTimer-=dt;

   if(e.fireTimer<=0){
    shoot(e);
    e.fireTimer=CONFIG.fireInterval+rnd(0,.35);
   }
  }else{
   e.alert-=dt;
   if(e.alert<=0)e.state="patrol";
  }

  if(dist(e,player)<23){
   finish(false,"YOU WERE CAUGHT","An assassin caught you. Your match is over.");
   return;
  }
 }
}

/* ======================================
   THREE-HIT HEALTH SYSTEM
====================================== */
function updateBullets(dt){
 for(const b of bullets){
  if(b.life<=0)continue;

  b.x+=b.vx*dt;
  b.y+=b.vy*dt;
  b.life-=dt;

  // Cover blocks bullets.
  if(obstacles.some(o=>
   b.x>o.x&&b.x<o.x+o.w&&
   b.y>o.y&&b.y<o.y+o.h
  )){
   b.life=0;
   continue;
  }

  if(Math.hypot(b.x-player.x,b.y-player.y)<17){
   b.life=0;

   // A short damage cooldown prevents one burst counting
   // several times in the same instant.
   if(damageCooldown>0)continue;

   damageCooldown=CONFIG.damageCooldown;
   player.health=Math.max(0,player.health-1);

   $("health").textContent=
    "❤️".repeat(player.health)+
    "🖤".repeat(CONFIG.playerHealth-player.health);

   if(player.health===0){
    finish(false,"YOU LOST","You were shot three times. Your match is over.");
    return;
   }
  }
 }

 bullets=bullets.filter(b=>b.life>0);
}

/* ======================================
   MAIN UPDATE
====================================== */
function update(dt){
 if(!running||matchEnded)return;

 seconds=Math.max(0,seconds-dt);
 damageCooldown=Math.max(0,damageCooldown-dt);

 const t=Math.ceil(seconds);

 $("clock").textContent=
  String(Math.floor(t/60)).padStart(2,"0")+":"+
  String(t%60).padStart(2,"0");

 if(seconds<=0){
  finish(false,"TIME UP","You did not eliminate every assassin in time.");
  return;
 }

 const len=Math.hypot(moveX,moveY);

 if(len>.08){
  const dx=moveX/Math.max(1,len);
  const dy=moveY/Math.max(1,len);

  player.a=Math.atan2(dy,dx);

  moveEntity(
   player,
   dx*player.speed*dt,
   dy*player.speed*dt,
   15
  );

  walkClock+=dt;
  player.walkFrame=Math.floor(walkClock*10)%4;
 }else{
  player.walkFrame=0;
 }

 automaticTakedowns();
 if(!running)return;

 updateEnemies(dt);
 if(!running)return;

 updateBullets(dt);
 if(!running)return;

 alarmTime=Math.max(0,alarmTime-dt);
 $("alarm").style.display=alarmTime>0?"block":"none";

 camera.x+=(player.x-camera.x)*Math.min(1,dt*8);
 camera.y+=(player.y-camera.y)*Math.min(1,dt*8);

 particles=particles.filter(p=>p.life>0);

 for(const p of particles){
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.life-=dt;
 }
}

/* ======================================
   ENVIRONMENT ART
====================================== */
function drawFloor(){
 const floorColors=["#9ba995","#929c9c","#a0a28e"];
 ctx.fillStyle=floorColors[mapTheme];
 ctx.fillRect(0,0,world.w,world.h);

 for(let y=0;y<world.h;y+=100){
  for(let x=0;x<world.w;x+=100){
   ctx.fillStyle=((x/100+y/100)%2===0)?
    "#ffffff0b":"#14251b0b";
   ctx.fillRect(x,y,100,100);
  }
 }

 for(let i=0;i<180;i++){
  const x=(i*173)%world.w;
  const y=(i*291)%world.h;

  ctx.fillStyle="#4a594a33";
  ctx.beginPath();
  ctx.arc(x,y,(i%4)+2,0,Math.PI*2);
  ctx.fill();
 }
}

function drawObstacle(o){
 ctx.save();
 ctx.shadowColor="#101d1699";
 ctx.shadowBlur=10;
 ctx.shadowOffsetY=8;

 if(spriteReady){
  let sx,sy,sw,sh;

  if(o.type==="crate"){
   const list=[
    [45,345,215,190],
    [295,370,250,165],
    [580,370,150,165],
    [755,370,210,165],
    [990,370,175,165],
    [1190,380,130,150],
    [1340,370,150,165]
   ];
   [sx,sy,sw,sh]=list[o.variant%list.length];
  }else if(o.type==="container"){
   const list=[
    [15,825,340,180],
    [380,830,230,175],
    [635,830,240,175]
   ];
   [sx,sy,sw,sh]=list[o.variant%list.length];
  }else{
   const list=[
    [40,555,250,250],
    [340,555,245,250],
    [610,610,265,145],
    [900,555,280,250],
    [1200,550,290,260]
   ];
   [sx,sy,sw,sh]=list[o.variant%list.length];
  }

  ctx.drawImage(sprites,sx,sy,sw,sh,o.x,o.y,o.w,o.h);
 }else{
  ctx.fillStyle=o.type==="wall"?"#31533d":"#087363";
  ctx.fillRect(o.x,o.y,o.w,o.h);
  ctx.strokeStyle="#9ab58b";
  ctx.lineWidth=4;
  ctx.strokeRect(o.x+3,o.y+3,o.w-6,o.h-6);
 }

 ctx.restore();
}

/* ======================================
   DIRECTIONAL ASSASSIN LIGHTS
====================================== */
function drawVision(e){
 ctx.save();
 ctx.beginPath();
 ctx.moveTo(e.x,e.y);

 const rays=40;

 for(let i=0;i<=rays;i++){
  const a=e.a-CONFIG.visionAngle/2+
   i/rays*CONFIG.visionAngle;

  let max=CONFIG.visionRange;

  for(let d=10;d<CONFIG.visionRange;d+=7){
   const x=e.x+Math.cos(a)*d;
   const y=e.y+Math.sin(a)*d;

   if(obstacles.some(o=>
    x>o.x&&x<o.x+o.w&&
    y>o.y&&y<o.y+o.h
   )){
    max=d;
    break;
   }
  }

  ctx.lineTo(
   e.x+Math.cos(a)*max,
   e.y+Math.sin(a)*max
  );
 }

 ctx.closePath();

 const g=ctx.createRadialGradient(
  e.x,e.y,4,e.x,e.y,CONFIG.visionRange
 );

 g.addColorStop(0,"#fff6bb70");
 g.addColorStop(.7,"#fff2a526");
 g.addColorStop(1,"#fff2a500");

 ctx.fillStyle=g;
 ctx.fill();
 ctx.strokeStyle="#fff4bd55";
 ctx.lineWidth=1;
 ctx.stroke();

 ctx.restore();
}

/* ======================================
   CHARACTER SPRITE DRAWING
====================================== */
function drawPlayer(){
 if(!player)return;

 const moving=Math.hypot(moveX,moveY)>.08;
 const frame=moving?player.walkFrame:0;

 // First two rows contain the ninja walking frames.
 // Use front-view frames when moving down and back-view
 // frames when moving up.
 let row=player.a>0.35&&player.a<2.8?0:1;

 const crop=spriteCrop(row,frame);

 ctx.save();
 ctx.translate(player.x,player.y);

 // Source artwork faces upward.
 ctx.rotate(player.a+Math.PI/2);

 ctx.fillStyle="#14231c66";
 ctx.beginPath();
 ctx.ellipse(0,11,23,13,0,0,Math.PI*2);
 ctx.fill();

 if(spriteReady){
  ctx.drawImage(
   sprites,
   crop.x,crop.y,crop.w,crop.h,
   -36,-43,72,86
  );
 }else{
  ctx.fillStyle="#d52e4a";
  ctx.beginPath();
  ctx.arc(0,0,16,0,Math.PI*2);
  ctx.fill();
 }

 ctx.restore();
}

function drawAssassin(e){
 const row=2+Math.floor(e.sprite/4);
 const col=e.sprite%4;
 const crop=spriteCrop(row,col);

 ctx.save();
 ctx.translate(e.x,e.y);
 ctx.rotate(e.a+Math.PI/2);

 ctx.fillStyle="#14231c66";
 ctx.beginPath();
 ctx.ellipse(0,11,23,13,0,0,Math.PI*2);
 ctx.fill();

 if(spriteReady){
  ctx.drawImage(
   sprites,
   crop.x,crop.y,crop.w,crop.h,
   -36,-43,72,86
  );
 }else{
  ctx.fillStyle="#df702d";
  ctx.beginPath();
  ctx.arc(0,0,16,0,Math.PI*2);
  ctx.fill();
 }

 ctx.restore();
}

/* ======================================
   BULLET DRAWING
====================================== */
function drawBullets(){
 for(const b of bullets){
  ctx.save();
  ctx.strokeStyle="#ffe7a1";
  ctx.lineWidth=3;
  ctx.shadowColor="#ffd35e";
  ctx.shadowBlur=8;

  ctx.beginPath();
  ctx.moveTo(b.x-b.vx*.025,b.y-b.vy*.025);
  ctx.lineTo(b.x,b.y);
  ctx.stroke();

  ctx.restore();
 }
}

/* ======================================
   RENDER GAME
====================================== */
function draw(){
 if(!world)return;

 ctx.clearRect(0,0,W,H);

 const zoom=clamp(
  Math.min(W/390,H/700)*CONFIG.cameraZoom,
  .9,1.25
 );

 ctx.save();
 ctx.translate(W/2,H/2);
 ctx.scale(zoom,zoom);
 ctx.translate(-camera.x,-camera.y);

 drawFloor();

 for(const o of obstacles)drawObstacle(o);

 for(const e of enemies){
  if(!e.dead)drawVision(e);
 }

 for(const e of enemies){
  if(!e.dead)drawAssassin(e);
 }

 drawPlayer();
 drawBullets();

 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life*2);
  ctx.fillStyle="#d8c4a2";
  ctx.beginPath();
  ctx.arc(p.x,p.y,3,0,Math.PI*2);
  ctx.fill();
 }
 ctx.globalAlpha=1;

 ctx.restore();
}

/* ======================================
   MATCH END AND REWARD SUBMISSION
   ====================================== */
async function finish(won,title,message){
 if(matchEnded)return;

 matchEnded=true;
 running=false;

 moveX=0;
 moveY=0;
 joystickActive=false;

 $("heading").textContent=title;
 $("message").textContent=message;
 $("status").textContent="Submitting match result...";
 $("screen").classList.remove("hide");

 $("start").disabled=true;
 $("start").textContent="PLEASE WAIT";

 if(resultSubmitted)return;
 resultSubmitted=true;

 const result={
  matchId,
  game:"survival",
  won,
  assassinsSelected:count,
  assassinsEliminated:enemies.filter(e=>e.dead).length,
  durationSeconds:Math.round(CONFIG.duration-seconds)
 };

 try{
  const response=await fetch("/api/survival/complete",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   credentials:"include",
   body:JSON.stringify(result)
  });

  if(!response.ok)throw new Error("Result verification failed");

  const data=await response.json();

  if(data.verified===true&&data.rewardGranted===true){
   $("status").textContent="Reward confirmed. Returning to Games...";
   $("start").textContent="RETURN TO GAMES";
   $("start").disabled=false;

   $("start").onclick=()=>{
    location.replace("games.html");
   };

   // Redirect only after server confirmation.
   setTimeout(()=>{
    location.replace("games.html");
   },1800);

  }else{
   throw new Error("Reward was not confirmed.");
  }

 }catch(error){
  console.error(error);

  $("status").textContent=
   "Result awaiting verification. You can return to Games.";

  $("start").disabled=false;
  $("start").textContent="RETURN TO GAMES";
  $("start").onclick=()=>{
   location.href="games.html";
  };
 }
}

/* ======================================
   RIGHT-HAND JOYSTICK
====================================== */
const stick=$("stick");
const nub=$("nub");

function joystick(e){
 const r=stick.getBoundingClientRect();

 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);

 const len=Math.hypot(dx,dy);
 const max=39;

 if(len>max){
  dx=dx/len*max;
  dy=dy/len*max;
 }

 moveX=dx/max;
 moveY=dy/max;

 nub.style.left=(32+dx)+"px";
 nub.style.top=(32+dy)+"px";
}

stick.addEventListener("pointerdown",e=>{
 joystickActive=true;
 stick.setPointerCapture(e.pointerId);
 joystick(e);
});

stick.addEventListener("pointermove",e=>{
 if(joystickActive)joystick(e);
});

function stopJoystick(){
 joystickActive=false;
 moveX=0;
 moveY=0;
 nub.style.left="32px";
 nub.style.top="32px";
}

stick.addEventListener("pointerup",stopJoystick);
stick.addEventListener("pointercancel",stopJoystick);

/* Keyboard movement */
const keys={};

addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
});

addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

function readKeyboard(){
 if(joystickActive)return;

 moveX=
  (keys.a||keys.arrowleft?-1:0)+
  (keys.d||keys.arrowright?1:0);

 moveY=
  (keys.w||keys.arrowup?-1:0)+
  (keys.s||keys.arrowdown?1:0);
}

/* ======================================
   MAIN GAME LOOP
====================================== */
function loop(t){
 if(!running||matchEnded)return;

 const dt=Math.min((t-last)/1000,.04);
 last=t;

 readKeyboard();
 update(dt);
 draw();

 if(running&&!matchEnded){
  requestAnimationFrame(loop);
 }
}

/* The only automatic start is the first page setup.
   A new match requires the player to press START GAME. */
$("start").addEventListener("click",()=>{
 if(running||matchEnded)return;
 startGame();
});

draw();
</script>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EarnGig Survival</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18251e;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;width:100%;padding:13px 12px;display:flex;justify-content:space-between;z-index:3;pointer-events:none}
.stat{background:#17271eeF;border:1px solid #9eb18a;border-radius:12px;padding:9px 13px;box-shadow:0 4px 12px #0007}
.stat small{display:block;font-size:10px;color:#bdcbb6;letter-spacing:1.2px}
.stat strong{display:block;font-size:22px;margin-top:3px;color:#fff}
#remaining{color:#f5c66c}
#clock{color:#fff}
#alarm{position:absolute;top:85px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:900;color:#ff655b;text-shadow:0 2px 5px #000;display:none;z-index:4;white-space:nowrap}
#controls{position:absolute;bottom:24px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 22px;z-index:3}
#stick{width:116px;height:116px;border-radius:50%;background:#172b26b8;border:3px solid #9cae8b88;position:relative;box-shadow:inset 0 4px 14px #0005;touch-action:none}
#nub{position:absolute;width:48px;height:48px;border-radius:50%;left:31px;top:31px;background:#d7e3cb;border:4px solid #6a8867;box-shadow:0 4px 12px #0008}
#attack{width:86px;height:86px;border-radius:50%;border:4px solid #ffe0a0;background:linear-gradient(145deg,#f5c16a,#a75b2b);color:white;font-size:25px;font-weight:bold;box-shadow:0 5px 16px #0008;touch-action:none}
#attack small{display:block;font-size:9px;letter-spacing:.5px}
#screen{position:absolute;inset:0;background:#101a15eF;display:flex;align-items:center;justify-content:center;z-index:6;padding:20px;text-align:center;color:white}
#screen.hide{display:none}
.panel{width:min(390px,100%);padding:26px 22px;border:2px solid #829b72;border-radius:20px;background:linear-gradient(145deg,#2b4835,#172a21);box-shadow:0 15px 50px #0009}
.panel h1{margin:0 0 12px;color:#f1c46e;font-size:30px}
.panel p{font-size:14px;line-height:1.6;color:#e0e8db}
.panel button{margin-top:12px;border:0;border-radius:12px;padding:15px 34px;background:#edb65c;color:#2a2114;font-weight:900;font-size:17px}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
 <div class="stat"><small>ASSASSINS LEFT</small><strong id="remaining">10 / 10</strong></div>
 <div class="stat"><small>TIME LEFT</small><strong id="clock">02:00</strong></div>
</div>

<div id="alarm">⚠ YOU HAVE BEEN SPOTTED!</div>

<div id="controls">
 <div id="stick"><div id="nub"></div></div>
 <button id="attack">🔪<small>TAKEDOWN</small></button>
</div>

<div id="screen">
 <div class="panel">
  <h1 id="heading">SURVIVAL</h1>
  <p id="message">Hide behind cover. Watch the assassins' vision lights. Approach from behind and eliminate them silently with your knife.</p>
  <p><b>8–12 assassins · 2 minutes · Stealth mission</b></p>
  <button id="start">START GAME</button>
 </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);

let W,H,DPR,world,player,enemies,obstacles,seconds=120;
let running=false,last=0,alarmTime=0;
let camera={x:0,y:0};
let moveX=0,moveY=0,joystickActive=false;
let count=10,particles=[];

function resize(){
 DPR=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=W*DPR;canvas.height=H*DPR;
 canvas.style.width=W+"px";canvas.style.height=H+"px";
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);resize();

const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angleDiff=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));

function collides(x,y,r=14){
 return obstacles.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h);
}
function move(obj,dx,dy,r=14){
 if(!collides(obj.x+dx,obj.y,r))obj.x+=dx;
 if(!collides(obj.x,obj.y+dy,r))obj.y+=dy;
 obj.x=clamp(obj.x,20,world.w-20);
 obj.y=clamp(obj.y,20,world.h-20);
}
function blockedSight(x1,y1,x2,y2){
 let steps=Math.ceil(Math.hypot(x2-x1,y2-y1)/8);
 for(let i=1;i<steps;i++){
  let t=i/steps,x=x1+(x2-x1)*t,y=y1+(y2-y1)*t;
  if(obstacles.some(o=>x>o.x&&x<o.x+o.w&&y>o.y&&y<o.y+o.h))return true;
 }
 return false;
}

/* Densely packed arena with narrow paths and multiple cover positions. */
function createMap(){
 world={w:1800,h:1800};
 obstacles=[];
 const cell=145;
 for(let row=0;row<12;row++){
  for(let col=0;col<12;col++){
   let x=35+col*cell,y=35+row*cell;
   if(Math.hypot(x+55-900,y+55-900)<175)continue;
   if(Math.random()<.78){
    let type=Math.random();
    let w=type<.48?105:rnd(65,115);
    let h=type<.48?105:rnd(65,115);
    obstacles.push({
     x:x+rnd(-10,18),y:y+rnd(-10,18),w,h,
     type:type<.48?"container":type<.75?"wall":"crate",
     variant:Math.floor(rnd(0,4))
    });
   }
  }
 }
 // Additional cover clusters make the arena less open.
 for(let i=0;i<32;i++){
  let x=rnd(100,1700),y=rnd(100,1700);
  if(Math.hypot(x-900,y-900)<190)continue;
  if(!collides(x,y,55)){
   obstacles.push({x,y,w:rnd(48,82),h:rnd(48,82),type:"crate",variant:0});
  }
 }
}

function startGame(){
 createMap();
 count=Math.floor(rnd(8,13));
 seconds=120;alarmTime=0;particles=[];
 player={x:900,y:900,a:-Math.PI/2,speed:190};
 enemies=[];
 let attempts=0;
 while(enemies.length<count&&attempts<4000){
  attempts++;
  let a=rnd(0,Math.PI*2),d=rnd(330,780);
  let x=clamp(900+Math.cos(a)*d,35,1765);
  let y=clamp(900+Math.sin(a)*d,35,1765);
  if(collides(x,y,24))continue;
  if(enemies.some(e=>Math.hypot(e.x-x,e.y-y)<125))continue;
  enemies.push({
   x,y,a:rnd(0,6.28),state:"patrol",
   speed:rnd(37,48),turn:rnd(1,3),alert:0,
   lastX:0,lastY:0,patrolDir:1
  });
 }
 camera={x:player.x,y:player.y};
 $("remaining").textContent=count+" / "+count;
 $("clock").textContent="02:00";
 $("alarm").style.display="none";
 $("start").textContent="PLAY AGAIN";
 $("screen").classList.add("hide");
 running=true;last=performance.now();
 requestAnimationFrame(loop);
}

function finish(win,title,message){
 running=false;
 $("heading").textContent=title;
 $("message").textContent=message;
 $("start").textContent="PLAY AGAIN";
 $("screen").classList.remove("hide");
}

function canSee(e){
 let d=distance(e,player);
 if(d>300)return false;
 let a=Math.atan2(player.y-e.y,player.x-e.x);
 if(Math.abs(angleDiff(a,e.a))>.48)return false;
 return !blockedSight(e.x,e.y,player.x,player.y);
}

function update(dt){
 if(!running)return;

 seconds=Math.max(0,seconds-dt);
 let whole=Math.ceil(seconds);
 $("clock").textContent=
  String(Math.floor(whole/60)).padStart(2,"0")+":"+
  String(whole%60).padStart(2,"0");

 if(seconds<=0){
  finish(false,"TIME UP","The time ran out. Try another route and stay hidden.");
  return;
 }

 let length=Math.hypot(moveX,moveY);
 if(length>.08){
  let dx=moveX/Math.max(1,length),dy=moveY/Math.max(1,length);
  player.a=Math.atan2(dy,dx);
  move(player,dx*player.speed*dt,dy*player.speed*dt,13);
 }

 for(let e of enemies){
  if(e.dead)continue;

  if(canSee(e)){
   e.state="hunt";e.alert=8;
   e.lastX=player.x;e.lastY=player.y;
   alarmTime=3;
  }

  if(alarmTime>0&&e.state==="patrol"){
   e.state="investigate";e.alert=6;
   e.lastX=player.x;e.lastY=player.y;
  }

  if(e.state==="patrol"){
   e.turn-=dt;
   if(e.turn<=0){
    e.a+=rnd(-1.25,1.25);
    e.turn=rnd(1.5,3.5);
   }
  }else{
   let target={x:e.lastX,y:e.lastY};
   let a=Math.atan2(target.y-e.y,target.x-e.x);
   e.a=a;
   let speed=e.state==="hunt"?e.speed*1.45:e.speed;
   move(e,Math.cos(a)*speed*dt,Math.sin(a)*speed*dt,15);
   e.alert-=dt;

   if(distance(e,player)<29){
    finish(false,"YOU WERE CAUGHT","An assassin caught you. Use cover and avoid their vision cones.");
    return;
   }

   if(e.alert<=0)e.state="patrol";
  }
 }
 alarmTime=Math.max(0,alarmTime-dt);
 $("alarm").style.display=alarmTime>0?"block":"none";

 let left=enemies.filter(e=>!e.dead).length;
 $("remaining").textContent=left+" / "+count;

 if(left===0){
  finish(true,"MISSION COMPLETE!","You eliminated every assassin. You survived!");
  return;
 }

 camera.x+=(player.x-camera.x)*Math.min(1,dt*7);
 camera.y+=(player.y-camera.y)*Math.min(1,dt*7);

 particles=particles.filter(p=>p.life>0);
 for(let p of particles){
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
 }
}

/* Illustrated battlefield floor */
function drawFloor(){
 ctx.fillStyle="#9ba99a";
 ctx.fillRect(0,0,world.w,world.h);

 for(let y=0;y<world.h;y+=100){
  for(let x=0;x<world.w;x+=100){
   ctx.fillStyle=((x/100+y/100)%2===0)?"#a5b2a0":"#899c8c";
   ctx.fillRect(x,y,100,100);
  }
 }
 // Floor markings, dust and surface details.
 for(let i=0;i<230;i++){
  let x=(i*173)%world.w,y=(i*291)%world.h;
  ctx.fillStyle="#536d5b22";
  ctx.beginPath();ctx.arc(x,y,(i%4)+2,0,Math.PI*2);ctx.fill();
 }
}

function drawObstacle(o){
 ctx.save();
 ctx.shadowColor="#14251a99";
 ctx.shadowBlur=12;ctx.shadowOffsetY=10;
 let colors=o.type==="wall"?
  ["#294c39","#355e46","#234b3a","#42664b"]:
  ["#087b68","#0d6656","#146c59","#08715e"];
 let color=colors[o.variant];
 ctx.fillStyle=color;
 ctx.fillRect(o.x,o.y,o.w,o.h);
 ctx.shadowColor="transparent";ctx.shadowOffsetY=0;
 ctx.strokeStyle=o.type==="wall"?"#173b2b":"#164f43";
 ctx.lineWidth=7;ctx.strokeRect(o.x+2,o.y+2,o.w-4,o.h-4);
 ctx.strokeStyle=o.type==="wall"?"#739878":"#49a38a";
 ctx.lineWidth=3;ctx.strokeRect(o.x+9,o.y+9,o.w-18,o.h-18);
 if(o.type==="container"){
  ctx.fillStyle="#ffffff15";
  ctx.fillRect(o.x+o.w*.48,o.y+5,5,o.h-10);
  ctx.fillStyle="#122f2a55";
  ctx.fillRect(o.x+8,o.y+o.h*.48,o.w-16,5);
  ctx.strokeStyle="#a3c5a344";ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(o.x+14,o.y+14);ctx.lineTo(o.x+o.w-14,o.y+o.h-14);
  ctx.stroke();
 }else if(o.type==="crate"){
  ctx.strokeStyle="#a3c2a866";ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(o.x+12,o.y+12);ctx.lineTo(o.x+o.w-12,o.y+o.h-12);
  ctx.moveTo(o.x+o.w-12,o.y+12);ctx.lineTo(o.x+12,o.y+o.h-12);
  ctx.stroke();
 }
 ctx.restore();
}

/* Directional light: only the illuminated cone is visible to an assassin. */
function drawVision(e){
 ctx.save();
 ctx.beginPath();
 ctx.moveTo(e.x,e.y);
 let rays=42;
 for(let i=0;i<=rays;i++){
  let a=e.a-.48+(i/rays)*.96;
  let max=300;
  for(let d=10;d<300;d+=7){
   let x=e.x+Math.cos(a)*d,y=e.y+Math.sin(a)*d;
   if(obstacles.some(o=>x>o.x&&x<o.x+o.w&&y>o.y&&y<o.y+o.h)){
    max=d;break;
   }
  }
  ctx.lineTo(e.x+Math.cos(a)*max,e.y+Math.sin(a)*max);
 }
 ctx.closePath();
 let g=ctx.createRadialGradient(e.x,e.y,5,e.x,e.y,300);
 g.addColorStop(0,"#fff7bd66");
 g.addColorStop(.7,"#fff1a522");
 g.addColorStop(1,"#fff2a500");
 ctx.fillStyle=g;ctx.fill();
 ctx.strokeStyle="#fff4bd44";ctx.lineWidth=1.5;ctx.stroke();
 ctx.restore();
}

/* Detailed top-down cartoon character artwork */
function drawCharacter(x,y,a,type){
 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(a);

 // Soft cast shadow
 ctx.fillStyle="#15231d66";
 ctx.beginPath();ctx.ellipse(1,10,24,17,0,0,Math.PI*2);ctx.fill();

 // Boots and legs
 ctx.fillStyle=type==="player"?"#202635":"#41352b";
 ctx.beginPath();ctx.ellipse(-10,10,7,13,-.15,0,Math.PI*2);ctx.fill();
 ctx.beginPath();ctx.ellipse(8,10,7,13,.15,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#171a1b";
 ctx.fillRect(-16,16,13,5);ctx.fillRect(4,16,13,5);

 // Body and outfit
 ctx.fillStyle=type==="player"?"#272d40":"#e8e4d9";
 ctx.beginPath();ctx.ellipse(0,-2,17,21,0,0,Math.PI*2);ctx.fill();

 // Shirt and vest
 ctx.fillStyle=type==="player"?"#8e263c":"#df702d";
 ctx.beginPath();ctx.ellipse(0,-4,14,16,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=type==="player"?"#171d2a":"#f0eee5";
 ctx.fillRect(-15,-12,6,18);ctx.fillRect(9,-12,6,18);

 // Belt and equipment
 ctx.fillStyle="#38352c";ctx.fillRect(-12,6,24,5);
 ctx.fillStyle="#bd9b51";ctx.fillRect(-3,6,6,5);

 // Arms
 ctx.strokeStyle=type==="player"?"#a96d50":"#d8aa82";
 ctx.lineWidth=8;ctx.lineCap="round";
 ctx.beginPath();ctx.moveTo(-11,-8);ctx.lineTo(-18,-1);
 ctx.moveTo(11,-8);ctx.lineTo(18,-1);ctx.stroke();

 // Head, neck and hair / helmet
 ctx.fillStyle="#bd835f";
 ctx.beginPath();ctx.ellipse(0,-20,10,12,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=type==="player"?"#171b26":"#49382b";
 ctx.beginPath();ctx.arc(0,-23,10,Math.PI,Math.PI*2);ctx.fill();
 ctx.fillRect(-10,-24,20,5);

 // Face detail
 ctx.fillStyle="#352b27";
 ctx.fillRect(-5,-20,2,2);ctx.fillRect(3,-20,2,2);

 if(type==="player"){
  // Knife only
  ctx.strokeStyle="#dce5e5";ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(19,-2);ctx.lineTo(32,-2);ctx.stroke();
  ctx.strokeStyle="#74502c";ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(17,-2);ctx.lineTo(22,-2);ctx.stroke();
 }else{
  // Gun carried by every assassin
  ctx.fillStyle="#242a28";
  ctx.fillRect(15,-5,29,7);
  ctx.fillStyle="#b1a06c";
  ctx.fillRect(39,-3,10,3);
  ctx.fillStyle="#343a35";
  ctx.fillRect(19,2,5,9);
  ctx.fillStyle="#161d1a";
  ctx.fillRect(26,-7,8,3);
 }
 ctx.restore();
}

function draw(){
 if(!world)return;
 ctx.clearRect(0,0,W,H);

 // Zoomed-in camera following player
 let zoom=clamp(Math.min(W/390,H/700)*1.12,.9,1.25);
 ctx.save();
 ctx.translate(W/2,H/2);
 ctx.scale(zoom,zoom);
 ctx.translate(-camera.x,-camera.y);

 drawFloor();
 for(let o of obstacles)drawObstacle(o);

 // Draw all enemy vision cones before the characters.
 for(let e of enemies)if(!e.dead)drawVision(e);

 for(let e of enemies)if(!e.dead)drawCharacter(e.x,e.y,e.a,"enemy");
 if(player)drawCharacter(player.x,player.y,player.a,"player");

 for(let p of particles){
  ctx.fillStyle="#d8c4a2";
  ctx.globalAlpha=Math.max(0,p.life*2);
  ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
 }
 ctx.restore();
}

function loop(t){
 if(!running)return;
 let dt=Math.min((t-last)/1000,.04);last=t;
 update(dt);draw();
 if(running)requestAnimationFrame(loop);
}

/* Joystick */
const stick=$("stick"),nub=$("nub");
function joystick(e){
 let r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 let len=Math.hypot(dx,dy),max=39;
 if(len>max){dx=dx/len*max;dy=dy/len*max;}
 moveX=dx/max;moveY=dy/max;
 nub.style.left=(31+dx)+"px";
 nub.style.top=(31+dy)+"px";
}
stick.addEventListener("pointerdown",e=>{
 joystickActive=true;stick.setPointerCapture(e.pointerId);joystick(e);
});
stick.addEventListener("pointermove",e=>{if(joystickActive)joystick(e);});
function stopJoystick(){
 joystickActive=false;moveX=moveY=0;
 nub.style.left="31px";nub.style.top="31px";
}
stick.addEventListener("pointerup",stopJoystick);
stick.addEventListener("pointercancel",stopJoystick);

/* Knife takedown: close range, behind the assassin, outside its vision. */
function takedown(){
 if(!running)return;
 let target=null,best=Infinity;
 for(let e of enemies){
  if(e.dead)continue;
  let d=distance(player,e);
  let direction=Math.atan2(player.y-e.y,player.x-e.x);
  let behind=Math.abs(angleDiff(direction,e.a))>2.3;
  if(d<54&&behind&&!canSee(e)&&d<best){
   target=e;best=d;
  }
 }
 if(target){
  target.dead=true;
  for(let i=0;i<12;i++){
   particles.push({x:target.x,y:target.y,vx:rnd(-35,35),vy:rnd(-35,35),life:.5});
  }
 }
}
$("attack").addEventListener("pointerdown",e=>{e.preventDefault();takedown();});

const keys={};
addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key===" ")takedown();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function keyboard(){
 if(joystickActive)return;
 moveX=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0);
 moveY=(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0);
}
function keyboardLoop(){
 if(running)keyboard();
 requestAnimationFrame(keyboardLoop);
}
$("start").addEventListener("click",startGame);
keyboardLoop();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EarnGig Survival</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17231d;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;padding:12px;display:flex;justify-content:space-between;z-index:3;pointer-events:none}
.stat{background:#14251feF;border:1px solid #8da77d;border-radius:12px;padding:9px 13px;box-shadow:0 4px 12px #0008}
.stat small{display:block;color:#c5d1bd;font-size:10px;letter-spacing:1px}
.stat strong{display:block;font-size:22px;color:#fff;margin-top:3px}
#remaining{color:#f5c66c}
#alarm{position:absolute;top:83px;left:50%;transform:translateX(-50%);display:none;color:#ff655b;font-weight:900;font-size:13px;text-shadow:0 2px 5px #000;z-index:4;white-space:nowrap}
#controls{position:absolute;bottom:24px;left:0;right:0;padding:0 23px;display:flex;justify-content:flex-start;z-index:3;pointer-events:none}
#stick{width:116px;height:116px;border-radius:50%;background:#172b26c9;border:3px solid #a4b89a88;position:relative;box-shadow:inset 0 4px 14px #0005;touch-action:none;pointer-events:auto}
#nub{position:absolute;width:48px;height:48px;border-radius:50%;left:31px;top:31px;background:#dce6d2;border:4px solid #6a8867;box-shadow:0 4px 12px #0008}
#screen{position:absolute;inset:0;background:#101a15ed;display:flex;align-items:center;justify-content:center;z-index:6;padding:20px;text-align:center;color:white}
#screen.hide{display:none}
.panel{width:min(390px,100%);padding:25px 21px;border:2px solid #829b72;border-radius:20px;background:linear-gradient(145deg,#2b4835,#172a21);box-shadow:0 15px 50px #0009}
.panel h1{margin:0 0 12px;color:#f1c46e;font-size:29px}
.panel p{font-size:14px;line-height:1.6;color:#e0e8db}
.panel button{margin-top:12px;border:0;border-radius:12px;padding:15px 28px;background:#edb65c;color:#2a2114;font-weight:900;font-size:16px}
#status{font-size:12px;color:#f5cf83;min-height:18px}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
 <div class="stat"><small>ASSASSINS LEFT</small><strong id="remaining">0 / 0</strong></div>
 <div class="stat"><small>TIME LEFT</small><strong id="clock">02:00</strong></div>
</div>
<div id="alarm">⚠ YOU HAVE BEEN SPOTTED!</div>

<div id="controls">
 <div id="stick"><div id="nub"></div></div>
</div>

<div id="screen">
 <div class="panel">
  <h1 id="heading">SURVIVAL</h1>
  <p id="message">Stay hidden. Watch the assassins' vision lights. Approach from behind or outside their vision and eliminate them automatically.</p>
  <p><b>8–12 assassins · 2 minutes · Stealth mission</b></p>
  <p id="status"></p>
  <button id="start">START GAME</button>
 </div>
</div>

<script>
"use strict";

/* -------------------------------------------------------
   CONFIGURATION
   ------------------------------------------------------- */
const CONFIG={
 duration:120,
 minAssassins:8,
 maxAssassins:12,
 playerSpeed:190,
 playerHealth:3,
 enemyVision:310,
 enemyFov:.96,
 enemyFireRange:290,
 enemyFireInterval:1.05,
 bulletSpeed:390,
 takedownDistance:39,
 completionEndpoint:"/api/survival/complete"
};

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);

let W,H,DPR,sprites,world,player,enemies,obstacles,bullets,particles;
let running=false,last=0,seconds=120,alarmTime=0;
let camera={x:0,y:0};
let moveX=0,moveY=0,joystickActive=false;
let count=0,matchId=null,ending=false;
let mapTheme=0;

function resize(){
 DPR=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=W*DPR;canvas.height=H*DPR;
 canvas.style.width=W+"px";canvas.style.height=H+"px";
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);resize();

/* Load the separate artwork file from repository root. */
sprites=new Image();
sprites.src="survival-sprites.png";
sprites.onload=()=>{if(!running)draw();};
sprites.onerror=()=>console.error("Missing survival-sprites.png");

/* Random helpers */
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angleDiff=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));

/* -------------------------------------------------------
   MAP GENERATION: dense cover and narrow corridors
   ------------------------------------------------------- */
function createMap(){
 world={w:1850,h:1850};
 obstacles=[];
 mapTheme=Math.floor(rnd(0,3));

 const cell=125;
 const safe={x:925,y:925,r:180};

 for(let row=0;row<15;row++){
  for(let col=0;col<15;col++){
   let x=35+col*cell;
   let y=35+row*cell;

   if(Math.hypot(x+45-safe.x,y+45-safe.y)<safe.r)continue;

   // Closely packed bunker sections, crates and containers.
   let roll=Math.random();
   if(roll<.88){
    let type=roll<.34?"wall":roll<.63?"crate":"container";
    let w=type==="wall"?rnd(85,115):rnd(65,105);
    let h=type==="wall"?rnd(80,115):rnd(65,105);

    // Leave deliberate narrow walking lanes.
    if(Math.random()<.18)continue;

    obstacles.push({
     x:x+rnd(-8,12),y:y+rnd(-8,12),w,h,type,
     variant:Math.floor(rnd(0,7))
    });
   }
  }
 }

 // Additional cover clusters in previously open spaces.
 for(let i=0;i<45;i++){
  let x=rnd(90,1760),y=rnd(90,1760);
  if(Math.hypot(x-safe.x,y-safe.y)<220)continue;
  if(!collides(x,y,35)){
   obstacles.push({
    x,y,w:rnd(55,100),h:rnd(55,100),
    type:Math.random()<.5?"crate":"container",
    variant:Math.floor(rnd(0,7))
   });
  }
 }

 // A few connected wall formations to create maze-like routes.
 for(let i=0;i<12;i++){
  let x=rnd(100,1650),y=rnd(100,1650);
  if(Math.hypot(x-safe.x,y-safe.y)<250)continue;
  if(!collides(x,y,45)){
   obstacles.push({
    x,y,w:rnd(140,205),h:35,
    type:"wall",variant:0
   });
  }
 }
}

function collides(x,y,r=14){
 return obstacles.some(o=>
  x+r>o.x&&x-r<o.x+o.w&&
  y+r>o.y&&y-r<o.y+o.h
 );
}

function moveEntity(obj,dx,dy,r=14){
 if(!collides(obj.x+dx,obj.y,r))obj.x+=dx;
 if(!collides(obj.x,obj.y+dy,r))obj.y+=dy;
 obj.x=clamp(obj.x,20,world.w-20);
 obj.y=clamp(obj.y,20,world.h-20);
}

function blockedSight(x1,y1,x2,y2){
 let steps=Math.ceil(Math.hypot(x2-x1,y2-y1)/7);
 for(let i=1;i<steps;i++){
  let t=i/steps;
  let x=x1+(x2-x1)*t,y=y1+(y2-y1)*t;
  if(obstacles.some(o=>x>o.x&&x<o.x+o.w&&y>o.y&&y<o.y+o.h))return true;
 }
 return false;
}

/* -------------------------------------------------------
   MATCH START
   ------------------------------------------------------- */
function startGame(){
 createMap();

 count=Math.floor(rnd(CONFIG.minAssassins,CONFIG.maxAssassins+1));
 seconds=CONFIG.duration;
 alarmTime=0;
 ending=false;
 bullets=[];
 particles=[];

 player={
  x:925,y:925,a:-Math.PI/2,
  speed:CONFIG.playerSpeed,
  health:CONFIG.playerHealth,
  alive:true
 };

 enemies=[];
 let attempts=0;

 while(enemies.length<count&&attempts<6000){
  attempts++;
  let a=rnd(0,Math.PI*2);
  let d=rnd(330,800);
  let x=clamp(player.x+Math.cos(a)*d,35,world.w-35);
  let y=clamp(player.y+Math.sin(a)*d,35,world.h-35);

  if(collides(x,y,24))continue;
  if(enemies.some(e=>Math.hypot(e.x-x,e.y-y)<115))continue;

  enemies.push({
   x,y,a:rnd(0,6.28),
   speed:rnd(42,56),
   state:"patrol",
   turn:rnd(1,3),
   alert:0,
   lastX:0,lastY:0,
   fireTimer:rnd(.2,1.1),
   aimTimer:0,
   sprite:1+Math.floor(rnd(0,4)),
   dead:false
  });
 }

 if(enemies.length===0){
  finish(false,"MAP ERROR","Please start another match.");
  return;
 }

 camera={x:player.x,y:player.y};
 $("remaining").textContent=count+" / "+count;
 $("clock").textContent="02:00";
 $("alarm").style.display="none";
 $("status").textContent="";
 $("start").textContent="PLAY AGAIN";
 $("screen").classList.add("hide");

 running=true;
 last=performance.now();
 matchId=crypto.randomUUID?crypto.randomUUID():String(Date.now());
 requestAnimationFrame(loop);
}

/* -------------------------------------------------------
   VISION SYSTEM
   ------------------------------------------------------- */
function canSee(e){
 const d=dist(e,player);
 if(d>CONFIG.enemyVision)return false;

 const a=Math.atan2(player.y-e.y,player.x-e.x);
 if(Math.abs(angleDiff(a,e.a))>CONFIG.enemyFov/2)return false;

 return !blockedSight(e.x,e.y,player.x,player.y);
}

/* -------------------------------------------------------
   AUTOMATIC KNIFE TAKEDOWN
   Touch an assassin from behind OR outside their light.
   No attack button is required.
   ------------------------------------------------------- */
function automaticTakedowns(){
 if(!running)return;

 for(const e of enemies){
  if(e.dead)continue;

  const d=dist(player,e);
  if(d>CONFIG.takedownDistance)continue;

  const direction=Math.atan2(player.y-e.y,player.x-e.x);
  const behind=Math.abs(angleDiff(direction,e.a))>2.2;
  const visible=canSee(e);

  if(behind||!visible){
   e.dead=true;

   for(let i=0;i<12;i++){
    particles.push({
     x:e.x,y:e.y,
     vx:rnd(-35,35),vy:rnd(-35,35),life:.5
    });
   }

   updateCounter();
  }
 }
}

function updateCounter(){
 const remaining=enemies.filter(e=>!e.dead).length;
 $("remaining").textContent=remaining+" / "+count;

 if(remaining===0){
  finish(true,"MISSION COMPLETE!","You eliminated every assassin.");
 }
}

/* -------------------------------------------------------
   ASSASSIN ALERTS AND SHOOTING
   ------------------------------------------------------- */
function alertNearbyAssassins(x,y){
 alarmTime=4;

 for(const e of enemies){
  if(e.dead)continue;
  e.state="hunt";
  e.alert=9;
  e.lastX=x;
  e.lastY=y;
 }
}

function shoot(e){
 const a=Math.atan2(player.y-e.y,player.x-e.x);
 e.a=a;

 const muzzle=34;
 bullets.push({
  x:e.x+Math.cos(a)*muzzle,
  y:e.y+Math.sin(a)*muzzle,
  vx:Math.cos(a)*CONFIG.bulletSpeed,
  vy:Math.sin(a)*CONFIG.bulletSpeed,
  life:1.1
 });
}

function updateEnemies(dt){
 for(const e of enemies){
  if(e.dead)continue;

  if(canSee(e)){
   if(e.state!=="hunt"){
    alertNearbyAssassins(player.x,player.y);
   }
   e.state="hunt";
   e.alert=8;
   e.lastX=player.x;
   e.lastY=player.y;
  }

  if(e.state==="patrol"){
   e.turn-=dt;
   if(e.turn<=0){
    e.a+=rnd(-1.4,1.4);
    e.turn=rnd(1.2,2.7);
   }
   continue;
  }

  // Investigate / hunt the player's last known position.
  const target={x:e.lastX,y:e.lastY};
  const d=dist(e,target);
  const a=Math.atan2(target.y-e.y,target.x-e.x);

  if(d>65){
   e.a=a;
   moveEntity(
    e,
    Math.cos(a)*e.speed*dt,
    Math.sin(a)*e.speed*dt,
    15
   );
  }

  // Aim and fire only when there is a clear line of sight.
  const seesNow=canSee(e);
  if(seesNow){
   e.state="hunt";
   e.lastX=player.x;
   e.lastY=player.y;
   e.a=Math.atan2(player.y-e.y,player.x-e.x);
   e.fireTimer-=dt;

   if(e.fireTimer<=0){
    shoot(e);
    e.fireTimer=CONFIG.enemyFireInterval+rnd(0,.4);
   }
  }else{
   e.alert-=dt;
   if(e.alert<=0)e.state="patrol";
  }

  if(dist(e,player)<24){
   finish(false,"YOU WERE CAUGHT","An assassin caught you. Use cover and avoid their vision lights.");
   return;
  }
 }
}

/* -------------------------------------------------------
   BULLETS AND PLAYER DAMAGE
   ------------------------------------------------------- */
function updateBullets(dt){
 for(const b of bullets){
  if(b.life<=0)continue;

  b.x+=b.vx*dt;
  b.y+=b.vy*dt;
  b.life-=dt;

  if(obstacles.some(o=>b.x>o.x&&b.x<o.x+o.w&&b.y>o.y&&b.y<o.y+o.h)){
   b.life=0;
   continue;
  }

  if(Math.hypot(b.x-player.x,b.y-player.y)<17){
   b.life=0;
   player.health--;

   for(let i=0;i<8;i++){
    particles.push({
     x:player.x,y:player.y,
     vx:rnd(-45,45),vy:rnd(-45,45),life:.35
    });
   }

   if(player.health<=0){
    finish(false,"YOU LOST","The assassins eliminated you. Try using the walls and containers as cover.");
    return;
   }
  }
 }
 bullets=bullets.filter(b=>b.life>0);
}

/* -------------------------------------------------------
   MAIN GAME UPDATE
   ------------------------------------------------------- */
function update(dt){
 if(!running)return;

 seconds=Math.max(0,seconds-dt);
 const t=Math.ceil(seconds);
 $("clock").textContent=
  String(Math.floor(t/60)).padStart(2,"0")+":"+
  String(t%60).padStart(2,"0");

 if(seconds<=0){
  finish(false,"TIME UP","You did not eliminate every assassin before time ran out.");
  return;
 }

 const len=Math.hypot(moveX,moveY);
 if(len>.08){
  const dx=moveX/Math.max(1,len);
  const dy=moveY/Math.max(1,len);
  player.a=Math.atan2(dy,dx);
  moveEntity(player,dx*player.speed*dt,dy*player.speed*dt,14);
 }

 // Touch-based automatic takedowns.
 automaticTakedowns();
 if(!running)return;

 updateEnemies(dt);
 if(!running)return;

 updateBullets(dt);
 if(!running)return;

 alarmTime=Math.max(0,alarmTime-dt);
 $("alarm").style.display=alarmTime>0?"block":"none";

 camera.x+=(player.x-camera.x)*Math.min(1,dt*8);
 camera.y+=(player.y-camera.y)*Math.min(1,dt*8);

 particles=particles.filter(p=>p.life>0);
 for(const p of particles){
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.life-=dt;
 }
}

/* -------------------------------------------------------
   ARTWORK DRAWING
   Sprite sheet coordinates refer to survival-sprites.png.
   ------------------------------------------------------- */
function drawFloor(){
 ctx.fillStyle=mapTheme===0?"#9aa995":mapTheme===1?"#929c9c":"#a0a28e";
 ctx.fillRect(0,0,world.w,world.h);

 for(let y=0;y<world.h;y+=100){
  for(let x=0;x<world.w;x+=100){
   ctx.fillStyle=((x/100+y/100)%2===0)?"#ffffff0b":"#14251b0b";
   ctx.fillRect(x,y,100,100);
  }
 }

 for(let i=0;i<180;i++){
  const x=(i*173)%world.w,y=(i*291)%world.h;
  ctx.fillStyle="#4a594a33";
  ctx.beginPath();
  ctx.arc(x,y,(i%4)+2,0,Math.PI*2);
  ctx.fill();
 }
}

function drawObstacle(o){
 ctx.save();
 ctx.shadowColor="#101d1699";
 ctx.shadowBlur=10;
 ctx.shadowOffsetY=8;

 if(sprites.complete&&sprites.naturalWidth){
  let sx,sy,sw,sh;

  if(o.type==="crate"){
   const crates=[
    [45,345,215,190],
    [295,370,250,165],
    [580,370,150,165],
    [755,370,210,165],
    [990,370,175,165],
    [1190,380,130,150],
    [1340,370,150,165]
   ];
   [sx,sy,sw,sh]=crates[o.variant%crates.length];
  }else if(o.type==="container"){
   const containers=[
    [15,825,340,180],
    [380,830,230,175],
    [635,830,240,175]
   ];
   [sx,sy,sw,sh]=containers[o.variant%containers.length];
  }else{
   const walls=[
    [40,555,250,250],
    [340,555,245,250],
    [610,610,265,145],
    [900,555,280,250],
    [1200,550,290,260]
   ];
   [sx,sy,sw,sh]=walls[o.variant%walls.length];
  }

  ctx.drawImage(sprites,sx,sy,sw,sh,o.x,o.y,o.w,o.h);
 }else{
  // Temporary fallback while the sprite file loads.
  ctx.fillStyle=o.type==="wall"?"#31533d":"#087363";
  ctx.fillRect(o.x,o.y,o.w,o.h);
  ctx.strokeStyle="#9ab58b";
  ctx.lineWidth=5;
  ctx.strokeRect(o.x+4,o.y+4,o.w-8,o.h-8);
 }
 ctx.restore();
}

function drawVision(e){
 ctx.save();
 ctx.beginPath();
 ctx.moveTo(e.x,e.y);

 const rays=40;
 for(let i=0;i<=rays;i++){
  const a=e.a-CONFIG.enemyFov/2+i/rays*CONFIG.enemyFov;
  let max=CONFIG.enemyVision;

  for(let d=10;d<CONFIG.enemyVision;d+=7){
   const x=e.x+Math.cos(a)*d;
   const y=e.y+Math.sin(a)*d;
   if(obstacles.some(o=>x>o.x&&x<o.x+o.w&&y>o.y&&y<o.y+o.h)){
    max=d;break;
   }
  }
  ctx.lineTo(e.x+Math.cos(a)*max,e.y+Math.sin(a)*max);
 }
 ctx.closePath();

 const g=ctx.createRadialGradient(e.x,e.y,4,e.x,e.y,CONFIG.enemyVision);
 g.addColorStop(0,"#fff6bb72");
 g.addColorStop(.7,"#fff2a52a");
 g.addColorStop(1,"#fff2a500");
 ctx.fillStyle=g;
 ctx.fill();
 ctx.strokeStyle="#fff4bd55";
 ctx.lineWidth=1;
 ctx.stroke();
 ctx.restore();
}

const characterSprites=[
 [65,15,280,320],       // masked knife character
 [375,15,195,320],      // orange rifleman
 [650,15,255,320],      // dark tactical soldier
 [930,15,235,310],      // blue uniform
 [1190,15,270,315]      // white uniform
];

function drawCharacter(character,isPlayer){
 const sprite=characterSprites[isPlayer?0:character.sprite];
 const [sx,sy,sw,sh]=sprite;

 ctx.save();
 ctx.translate(character.x,character.y);
 ctx.rotate(character.a+Math.PI/2);

 ctx.fillStyle="#14231c66";
 ctx.beginPath();
 ctx.ellipse(0,8,21,13,0,0,Math.PI*2);
 ctx.fill();

 if(sprites.complete&&sprites.naturalWidth){
  ctx.drawImage(sprites,sx,sy,sw,sh,-31,-34,62,68);
 }else{
  ctx.fillStyle=isPlayer?"#8c2639":"#d66d2c";
  ctx.beginPath();
  ctx.ellipse(0,0,17,25,0,0,Math.PI*2);
  ctx.fill();
 }
 ctx.restore();
}

function drawBullets(){
 for(const b of bullets){
  ctx.save();
  ctx.strokeStyle="#ffe7a1";
  ctx.lineWidth=3;
  ctx.shadowColor="#ffd35e";
  ctx.shadowBlur=8;
  ctx.beginPath();
  ctx.moveTo(b.x-b.vx*.025,b.y-b.vy*.025);
  ctx.lineTo(b.x,b.y);
  ctx.stroke();
  ctx.restore();
 }
}

function draw(){
 if(!world)return;
 ctx.clearRect(0,0,W,H);

 const zoom=clamp(Math.min(W/390,H/700)*1.12,.9,1.25);

 ctx.save();
 ctx.translate(W/2,H/2);
 ctx.scale(zoom,zoom);
 ctx.translate(-camera.x,-camera.y);

 drawFloor();

 // Shadows and objects.
 for(const o of obstacles)drawObstacle(o);

 // Vision cones appear over the battlefield.
 for(const e of enemies)if(!e.dead)drawVision(e);

 // Draw enemies and player.
 for(const e of enemies)if(!e.dead)drawCharacter(e,false);
 if(player)drawCharacter(player,true);

 drawBullets();

 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life*2);
  ctx.fillStyle="#d8c4a2";
  ctx.beginPath();
  ctx.arc(p.x,p.y,3,0,Math.PI*2);
  ctx.fill();
 }
 ctx.globalAlpha=1;

 ctx.restore();
}

/* -------------------------------------------------------
   RESULT, REWARD VERIFICATION AND REDIRECT
   ------------------------------------------------------- */
async function finish(won,title,message){
 if(ending)return;
 ending=true;
 running=false;

 $("heading").textContent=title;
 $("message").textContent=message;
 $("status").textContent="Submitting match result...";
 $("start").disabled=true;
 $("screen").classList.remove("hide");

 const result={
  matchId,
  game:"survival",
  won,
  assassinsSelected:count,
  assassinsEliminated:enemies.filter(e=>e.dead).length,
  durationSeconds:Math.round(CONFIG.duration-seconds)
 };

 try{
  const response=await fetch(CONFIG.completionEndpoint,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   credentials:"include",
   body:JSON.stringify(result)
  });

  if(!response.ok)throw new Error("Reward verification failed");

  const data=await response.json();

  if(data.verified===true&&data.rewardGranted===true){
   $("status").textContent=won?
    "Reward credited successfully. Returning to Games...":
    "Match recorded. Returning to Games...";

   $("start").textContent="RETURN TO GAMES";
   $("start").disabled=false;
   $("start").onclick=()=>location.replace("games.html");

   setTimeout(()=>location.replace("games.html"),1800);
  }else{
   throw new Error("The server has not confirmed the reward.");
  }
 }catch(error){
  console.error(error);
  $("status").textContent="Result could not be verified. Your reward has not been confirmed.";
  $("start").textContent="RETURN TO GAMES";
  $("start").disabled=false;
  $("start").onclick=()=>location.href="games.html";
 }
}

/* -------------------------------------------------------
   MOBILE JOYSTICK
   ------------------------------------------------------- */
const stick=$("stick"),nub=$("nub");

function joystick(e){
 const r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 const len=Math.hypot(dx,dy),max=39;

 if(len>max){dx=dx/len*max;dy=dy/len*max;}
 moveX=dx/max;
 moveY=dy/max;
 nub.style.left=(31+dx)+"px";
 nub.style.top=(31+dy)+"px";
}

stick.addEventListener("pointerdown",e=>{
 joystickActive=true;
 stick.setPointerCapture(e.pointerId);
 joystick(e);
});
stick.addEventListener("pointermove",e=>{
 if(joystickActive)joystick(e);
});

function stopJoystick(){
 joystickActive=false;
 moveX=moveY=0;
 nub.style.left="31px";
 nub.style.top="31px";
}
stick.addEventListener("pointerup",stopJoystick);
stick.addEventListener("pointercancel",stopJoystick);

/* Keyboard support */
const keys={};
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function readKeyboard(){
 if(joystickActive)return;
 moveX=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0);
 moveY=(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0);
}

/* Game loop */
function loop(t){
 if(!running)return;
 const dt=Math.min((t-last)/1000,.04);
 last=t;

 readKeyboard();
 update(dt);
 draw();

 if(running)requestAnimationFrame(loop);
}

$("start").addEventListener("click",startGame);
draw();
</script>
</body>
</html>

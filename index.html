
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#160F0B">
  <title>AHRUH | Shop • Save • Play • Earn</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root {
      --bg: #160F0B;
      --surface: #211710;
      --surface-2: #2A1D14;
      --surface-3: #342317;
      --gold: #F5A623;
      --gold-light: #FFBD59;
      --orange: #D97724;
      --copper: #8E3D1C;
      --text: #FFF7EC;
      --muted: #B8A99A;
      --border: rgba(255,189,89,.15);
      --danger: #F06B55;
      --success: #7BCB91;
      --radius: 17px;
      --shadow: 0 12px 35px rgba(0,0,0,.22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      min-height: 100vh;
      padding-bottom: 88px;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; }

    .page {
      width: min(100%, 1100px);
      margin: auto;
      padding: 0 16px;
    }

    /* HEADER */
    .topbar {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .brand-wrap { min-width: 0; }

    .brand {
      font-family: "Cormorant Garamond", serif;
      font-size: 35px;
      font-weight: 700;
      letter-spacing: 2px;
      line-height: .9;
      color: var(--gold-light);
      text-shadow: 0 0 18px rgba(245,166,35,.22);
    }

    .brand-tagline {
      font-size: 8px;
      letter-spacing: 2px;
      color: var(--muted);
      margin-top: 5px;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .notification-link {
      position: relative;
      width: 37px;
      height: 37px;
      display: grid;
      place-items: center;
      color: var(--text);
      font-size: 18px;
      border-radius: 12px;
      background: rgba(255,255,255,.045);
    }

    .notification-dot {
      position: absolute;
      width: 7px;
      height: 7px;
      background: var(--orange);
      border-radius: 50%;
      top: 7px;
      right: 7px;
      display: none;
    }

    /* Display only. This is deliberately not a link or button. */
    .wallet-mini {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      border: 1px solid rgba(245,166,35,.28);
      background: rgba(245,166,35,.08);
      border-radius: 12px;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }

    .wallet-mini i {
      color: var(--gold);
      font-size: 14px;
    }

    .wallet-mini span {
      color: var(--gold-light);
      font-weight: 800;
      font-size: 12px;
    }

    /* GREETING */
    .welcome {
      padding: 23px 0 17px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .welcome h1 {
      font-size: 21px;
      margin: 0 0 5px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .welcome h1 span { color: var(--gold-light); }

    .welcome p {
      color: var(--muted);
      font-size: 12px;
      margin: 0;
    }

    .batch-status {
      flex: 0 0 auto;
      max-width: 46%;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      padding: 9px 11px;
      text-align: right;
    }

    .batch-status small {
      display: block;
      color: var(--muted);
      font-size: 9px;
      margin-bottom: 4px;
    }

    .batch-status strong {
      display: block;
      font-size: 11px;
      color: var(--gold-light);
      overflow-wrap: anywhere;
    }

    /* SHORTCUTS */
    .shortcuts {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 9px;
      margin: 3px 0 23px;
    }

    .shortcut {
      min-width: 0;
      min-height: 91px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 9px;
      padding: 10px 4px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: linear-gradient(145deg, #2A1D14, #1D140F);
      text-align: center;
      transition: .2s ease;
    }

    .shortcut:active { transform: scale(.97); }

    .shortcut-icon {
      width: 35px;
      height: 35px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      color: var(--gold-light);
      background: rgba(245,166,35,.11);
      font-size: 15px;
    }

    .shortcut span:last-child {
      font-size: 10px;
      font-weight: 700;
      line-height: 1.2;
    }

    /* PRODUCTS */
    .products-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 13px;
    }

    .products-heading h2 {
      font-size: 16px;
      margin: 0;
      font-weight: 800;
    }

    .products-heading span {
      font-size: 10px;
      color: var(--muted);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .product-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .product-image-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / .92;
      background: #2A211A;
      overflow: hidden;
    }

    .product-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .favorite-btn {
      position: absolute;
      top: 9px;
      right: 9px;
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: rgba(22,15,11,.78);
      cursor: pointer;
    }

    .favorite-btn.active { color: #FF786B; }

    .product-info { padding: 11px; }

    .product-name {
      font-size: 12px;
      line-height: 1.4;
      font-weight: 700;
      min-height: 33px;
      margin: 0 0 7px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-price {
      font-size: 15px;
      font-weight: 800;
      color: var(--gold-light);
      margin-bottom: 10px;
    }

    .product-actions {
      display: flex;
      gap: 7px;
    }

    .add-cart {
      flex: 1;
      min-width: 0;
      padding: 9px 7px;
      border: 0;
      border-radius: 9px;
      color: #24150A;
      background: linear-gradient(110deg, var(--gold), var(--gold-light));
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .view-product {
      width: 34px;
      flex: 0 0 34px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--gold-light);
      background: transparent;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 45px 18px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    .empty-state i {
      font-size: 27px;
      color: var(--gold);
      margin-bottom: 12px;
    }

    .empty-state h3 {
      font-size: 14px;
      margin: 0 0 6px;
    }

    .empty-state p {
      color: var(--muted);
      font-size: 11px;
      margin: 0;
    }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed;
      z-index: 50;
      bottom: 0;
      left: 0;
      right: 0;
      min-height: 69px;
      padding: 8px 8px max(8px, env(safe-area-inset-bottom));
      background: rgba(29,20,15,.97);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      backdrop-filter: blur(16px);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: #9E8D7D;
      font-size: 9px;
      font-weight: 600;
    }

    .nav-item i { font-size: 17px; }

    .nav-item.active { color: var(--gold-light); }

    .toast {
      position: fixed;
      z-index: 100;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      opacity: 0;
      pointer-events: none;
      background: #F5A623;
      color: #21140A;
      padding: 11px 17px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      box-shadow: var(--shadow);
      transition: .2s ease;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (min-width: 650px) {
      .page { padding: 0 25px; }
      .product-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .shortcuts { gap: 14px; }
      .shortcut { min-height: 105px; }
      .shortcut span:last-child { font-size: 12px; }
      .product-image-wrap { aspect-ratio: 1 / .85; }
    }

    @media (min-width: 900px) {
      .product-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .bottom-nav {
        left: 50%;
        right: auto;
        width: min(100%, 700px);
        transform: translateX(-50%);
        border: 1px solid var(--border);
        border-bottom: 0;
        border-radius: 17px 17px 0 0;
      }
    }

    @media (max-width: 360px) {
      .brand { font-size: 30px; }
      .header-actions { gap: 8px; }
      .wallet-mini { padding: 7px 8px; }
      .welcome h1 { font-size: 18px; }
      .batch-status { padding: 8px; }
      .shortcut span:last-child { font-size: 9px; }
      .shortcuts { gap: 6px; }
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- HEADER -->
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand">AHRUH</div>
        <div class="brand-tagline">SHOP • SAVE • PLAY • EARN</div>
      </div>

      <div class="header-actions">
        <!-- Display-only wallet balance: intentionally not clickable -->
        <div class="wallet-mini" aria-label="Naira wallet balance">
          <i class="fa-solid fa-wallet"></i>
          <span id="headerWalletBalance">₦0.00</span>
        </div>

        <a class="notification-link" href="notifications-user.html" aria-label="Notifications">
          <i class="fa-regular fa-bell"></i>
          <span class="notification-dot" id="notificationDot"></span>
        </a>
      </div>
    </header>

    <!-- GREETING AND BATCH STATUS -->
    <section class="welcome">
      <div>
        <h1>Hello, <span id="customerFirstName">Customer</span> 👋</h1>
        <p>Welcome to AHRUH</p>
      </div>

      <div class="batch-status">
        <small>SHOPPING BATCH</small>
        <strong id="batchStatusText">No batch scheduled</strong>
      </div>
    </section>

    <!-- FIVE SHORTCUTS -->
    <nav class="shortcuts" aria-label="Shopping shortcuts">
      <a class="shortcut" href="shop.html">
        <span class="shortcut-icon"><i class="fa-solid fa-bag-shopping"></i></span>
        <span>Shop Now</span>
      </a>

      <a class="shortcut" href="categories.html">
        <span class="shortcut-icon"><i class="fa-solid fa-layer-group"></i></span>
        <span>Categories</span>
      </a>

      <a class="shortcut" href="orders.html">
        <span class="shortcut-icon"><i class="fa-solid fa-box"></i></span>
        <span>My Orders</span>
      </a>

      <a class="shortcut" href="favorites.html">
        <span class="shortcut-icon"><i class="fa-regular fa-heart"></i></span>
        <span>Favorites</span>
      </a>

      <a class="shortcut" href="promotions-user.html">
        <span class="shortcut-icon"><i class="fa-solid fa-tags"></i></span>
        <span>Deals &amp; Offers</span>
      </a>
    </nav>

    <!-- PRODUCT LISTING -->
    <main>
      <div class="products-heading">
        <h2>Available Products</h2>
        <span id="productCount">0 products</span>
      </div>

      <div class="product-grid" id="productGrid">
        <div class="empty-state">
          <i class="fa-solid fa-bag-shopping"></i>
          <h3>Loading products...</h3>
          <p>Available products will appear here.</p>
        </div>
      </div>
    </main>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <a class="nav-item active" href="index.html">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </a>

    <a class="nav-item" href="categories.html">
      <i class="fa-solid fa-layer-group"></i>
      <span>Categories</span>
    </a>

    <a class="nav-item" href="orders.html">
      <i class="fa-solid fa-box"></i>
      <span>Orders</span>
    </a>

    <a class="nav-item" href="cart.html">
      <i class="fa-solid fa-cart-shopping"></i>
      <span>Cart</span>
    </a>

    <a class="nav-item" href="account.html">
      <i class="fa-regular fa-user"></i>
      <span>Account</span>
    </a>
  </nav>

  <div class="toast" id="toast"></div>

  <script>
    /* -----------------------------------------
       AHRUH CUSTOMER HOMEPAGE - PROTOTYPE DATA
       ----------------------------------------- */

    const STORAGE = {
      session: "ahruh_customer_session_v1",
      wallet: "ahruh_customer_wallet_v1",
      products: "ahruh_products_prototype_v1",
      batches: "ahruh_batches_prototype_v1",
      cart: "ahruh_cart_prototype_v1",
      favorites: "ahruh_customer_favorites_v1"
    };

    function readStore(key, fallback) {
      try {
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;
      } catch (error) {
        console.warn("Could not read storage:", key, error);
        return fallback;
      }
    }

    function money(value) {
      const amount = Number(value) || 0;
      return "₦" + amount.toLocaleString("en-NG", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[character]);
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    /* CUSTOMER GREETING */
    function loadCustomerGreeting() {
      const session = readStore(STORAGE.session, null);

      if (!session) {
        document.getElementById("customerFirstName").textContent = "Customer";
        return;
      }

      const fullName =
        session.firstName ||
        session.firstname ||
        session.customer?.firstName ||
        session.customer?.firstname ||
        session.name ||
        session.customer?.name ||
        session.fullName ||
        session.customer?.fullName ||
        "";

      const firstName = String(fullName).trim().split(/\s+/)[0];

      if (firstName) {
        document.getElementById("customerFirstName").textContent = firstName;
      }
    }

    /* HEADER NAIRA WALLET BALANCE
       Display only. No click handler and no link.
       G-Coins are deliberately not read or displayed here.
    */
    function loadWalletBalance() {
      const wallet = readStore(STORAGE.wallet, null);

      let balance = 0;

      if (wallet && typeof wallet === "object") {
        if (wallet.balance !== undefined) {
          balance = Number(wallet.balance) || 0;
        } else if (wallet.nairaBalance !== undefined) {
          balance = Number(wallet.nairaBalance) || 0;
        }
      }

      document.getElementById("headerWalletBalance").textContent = money(balance);
    }

    /* BATCH STATUS */
    function loadBatchStatus() {
      const batches = readStore(STORAGE.batches, []);
      const label = document.getElementById("batchStatusText");

      if (!Array.isArray(batches) || batches.length === 0) {
        label.textContent = "No batch scheduled";
        return;
      }

      const now = new Date();

      const parseDate = value => {
        if (!value) return null;
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? null : date;
      };

      const ordered = [...batches].sort((a, b) => {
        const aDate = parseDate(a.openDate);
        const bDate = parseDate(b.openDate);
        return (aDate?.getTime() || 0) - (bDate?.getTime() || 0);
      });

      const activeBatch = ordered.find(batch => {
        const open = parseDate(batch.openDate);
        const close = parseDate(batch.closeDate);

        return open && close && now >= open && now <= close;
      });

      if (activeBatch) {
        label.textContent = activeBatch.name || "Active batch";
        return;
      }

      const nextBatch = ordered.find(batch => {
        const open = parseDate(batch.openDate);
        return open && open > now;
      });

      if (nextBatch) {
        label.textContent = "Next: " + (nextBatch.name || "Upcoming batch");
      } else {
        label.textContent = "No batch scheduled";
      }
    }

    /* PRODUCTS */
    function getProductImage(product) {
      if (product.image) return product.image;

      if (Array.isArray(product.images) && product.images.length) {
        const first = product.images[0];

        if (typeof first === "string") return first;
        if (first && first.url) return first.url;
        if (first && first.src) return first.src;
      }

      return "";
    }

    function productIsAvailable(product) {
      if (product.active === false) return false;
      if (product.isActive === false) return false;
      if (product.status === "inactive") return false;
      if (product.status === "archived") return false;

      return true;
    }

    function getProducts() {
      const products = readStore(STORAGE.products, []);

      if (!Array.isArray(products)) return [];

      return products.filter(productIsAvailable);
    }

    function getProductPrice(product) {
      return Number(
        product.price ??
        product.sellingPrice ??
        product.amount ??
        0
      );
    }

    function getFavorites() {
      const favorites = readStore(STORAGE.favorites, []);
      return Array.isArray(favorites) ? favorites : [];
    }

    function isFavorite(productId) {
      return getFavorites().some(item => {
        const id = typeof item === "object"
          ? item.productId || item.id
          : item;

        return String(id) === String(productId);
      });
    }

    function renderProducts() {
      const products = getProducts();
      const grid = document.getElementById("productGrid");

      document.getElementById("productCount").textContent =
        products.length + (products.length === 1 ? " product" : " products");

      if (!products.length) {
        grid.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-bag-shopping"></i>
            <h3>No products available yet</h3>
            <p>New products will appear here when they become available.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = products.map(product => {
        const id = product.id || product.productId;
        const name = product.name || product.title || "Product";
        const image = getProductImage(product);
        const price = getProductPrice(product);
        const favorite = isFavorite(id);

        return `
          <article class="product-card">
            <div class="product-image-wrap">
              ${
                image
                  ? `<img class="product-image"
                          src="${escapeHTML(image)}"
                          alt="${escapeHTML(name)}"
                          loading="lazy"
                          onerror="this.style.display='none'">`
                  : `<div class="product-image"
                          style="display:grid;place-items:center;color:#B8A99A">
                       <i class="fa-solid fa-image fa-2x"></i>
                     </div>`
              }

              <button
                class="favorite-btn ${favorite ? "active" : ""}"
                type="button"
                aria-label="Add to favorites"
                onclick="toggleFavorite('${escapeHTML(id)}')">
                <i class="${favorite ? "fa-solid" : "fa-regular"} fa-heart"></i>
              </button>
            </div>

            <div class="product-info">
              <h3 class="product-name">${escapeHTML(name)}</h3>
              <div class="product-price">${money(price)}</div>

              <div class="product-actions">
                <button class="add-cart"
                  type="button"
                  onclick="addToCart('${escapeHTML(id)}')">
                  <i class="fa-solid fa-cart-plus"></i>
                  Add to Cart
                </button>

                <button class="view-product"
                  type="button"
                  aria-label="View product"
                  onclick="viewProduct('${escapeHTML(id)}')">
                  <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    /* FAVORITES */
    function toggleFavorite(productId) {
      let favorites = getFavorites();

      const existingIndex = favorites.findIndex(item => {
        const id = typeof item === "object"
          ? item.productId || item.id
          : item;

        return String(id) === String(productId);
      });

      if (existingIndex >= 0) {
        favorites.splice(existingIndex, 1);
        showToast("Removed from Favorites");
      } else {
        favorites.push({
          productId: productId,
          addedAt: new Date().toISOString()
        });
        showToast("Added to Favorites");
      }

      localStorage.setItem(STORAGE.favorites, JSON.stringify(favorites));
      renderProducts();
    }

    /* CART */
    function addToCart(productId) {
      const product = getProducts().find(item =>
        String(item.id || item.productId) === String(productId)
      );

      if (!product) {
        showToast("Product could not be found");
        return;
      }

      let cart = readStore(STORAGE.cart, []);

      if (!Array.isArray(cart)) cart = [];

      const existing = cart.find(item =>
        String(item.productId || item.id) === String(productId)
      );

      if (existing) {
        existing.quantity = (Number(existing.quantity) || 1) + 1;
      } else {
        cart.push({
          productId: productId,
          name: product.name || product.title || "Product",
          price: getProductPrice(product),
          image: getProductImage(product),
          quantity: 1,
          addedAt: new Date().toISOString()
        });
      }

      localStorage.setItem(STORAGE.cart, JSON.stringify(cart));
      showToast("Added to your cart");
    }

    /* PRODUCT DETAILS */
    function viewProduct(productId) {
      window.location.href =
        "product.html?id=" + encodeURIComponent(productId);
    }

    /* NOTIFICATION INDICATOR */
    function loadNotificationIndicator() {
      const notifications = readStore(
        "ahruh_customer_notifications_v1",
        []
      );

      if (!Array.isArray(notifications)) return;

      const unread = notifications.some(item =>
        item.read === false || item.isRead === false
      );

      document.getElementById("notificationDot").style.display =
        unread ? "block" : "none";
    }

    /* INITIAL PAGE LOAD */
    function initialiseHomepage() {
      loadCustomerGreeting();
      loadWalletBalance();
      loadBatchStatus();
      loadNotificationIndicator();
      renderProducts();
    }

    initialiseHomepage();

    /* Refresh displayed prototype data if changed in another tab. */
    window.addEventListener("storage", event => {
      if (!event.key || Object.values(STORAGE).includes(event.key)) {
        initialiseHomepage();
      }
    });
  </script>
</body>
</html>

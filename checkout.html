
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | EarnGig</title>
<style>
:root{
  --purple:#6427c7;
  --deep:#48159b;
  --light:#f2ebff;
  --gold:#d6a62e;
  --text:#29243a;
  --muted:#777286;
  --border:#ece8f3;
  --bg:#faf9fc;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
a{text-decoration:none;color:inherit}
button,input,textarea{font:inherit}
.topbar{
  height:70px;background:white;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 5%;position:sticky;top:0;z-index:10
}
.brand{display:flex;align-items:center;gap:8px;color:var(--purple);font-size:23px;font-weight:800}
.brand svg{width:27px;height:27px}
.nav{display:flex;align-items:center;gap:20px;font-size:12px;font-weight:700;color:#625d71}
.nav a:hover{color:var(--purple)}
.container{max-width:1120px;margin:auto;padding:30px 20px 55px}
.heading{margin-bottom:24px}
.heading h1{font-size:27px;margin:0 0 7px}
.heading p{font-size:12px;color:var(--muted);margin:0;line-height:1.6}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:22px;align-items:start}
.panel{background:white;border:1px solid var(--border);border-radius:13px;margin-bottom:16px;overflow:hidden}
.panel-head{padding:18px 20px;border-bottom:1px solid var(--border)}
.panel-head h2{font-size:14px;margin:0 0 5px}
.panel-head p{font-size:10px;color:var(--muted);margin:0;line-height:1.6}
.panel-body{padding:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
label{font-size:11px;font-weight:700}
input,textarea{
  width:100%;border:1px solid var(--border);border-radius:8px;
  padding:12px;font-size:12px;color:var(--text);background:white;outline:none
}
input{height:44px}
textarea{min-height:85px;resize:vertical;line-height:1.6}
input:focus,textarea:focus{border-color:var(--purple)}
.vendor-block{border:1px solid var(--border);border-radius:9px;padding:13px;margin-bottom:12px}
.vendor-title{font-size:12px;color:var(--purple);font-weight:800;margin-bottom:10px}
.order-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #f2eff6}
.order-item img{width:48px;height:48px;object-fit:cover;border-radius:7px;background:#f0edf5}
.item-info{flex:1;min-width:0}
.item-info strong{font-size:10px;display:block;margin-bottom:4px}
.item-info span{font-size:9px;color:var(--muted)}
.item-total{font-size:10px;font-weight:800;white-space:nowrap}
.summary{background:white;border:1px solid var(--border);border-radius:13px;padding:20px;position:sticky;top:90px}
.summary h2{font-size:16px;margin:0 0 17px}
.summary-row{display:flex;justify-content:space-between;gap:12px;font-size:11px;margin:14px 0;color:#625d71}
.summary-row strong{color:var(--text)}
.summary-row.total{border-top:1px solid var(--border);padding-top:15px;font-size:13px;font-weight:800;color:var(--text)}
.summary-row.total strong{font-size:18px;color:var(--purple)}
.charge-note{background:var(--light);border:1px solid #e6dafa;border-radius:9px;padding:12px;font-size:10px;line-height:1.7;color:#59427e;margin:15px 0}
.delivery-note{background:#fff8e8;border:1px solid #f1e3c2;border-radius:9px;padding:12px;font-size:10px;line-height:1.7;color:#785b1c;margin:12px 0}
.confirm-row{display:flex;align-items:flex-start;gap:9px;margin-top:17px;font-size:10px;line-height:1.6;color:var(--muted)}
.confirm-row input{width:16px;height:16px;flex-shrink:0;margin:0;accent-color:var(--purple)}
.pay-btn{width:100%;border:0;background:var(--purple);color:white;border-radius:9px;padding:15px;font-size:12px;font-weight:800;margin-top:17px;cursor:pointer}
.pay-btn:hover{background:var(--deep)}
.notice{background:#f5f0ff;border:1px solid #e9defa;border-radius:9px;padding:13px;font-size:10px;line-height:1.7;color:#59427e;margin-bottom:16px}
.empty{background:white;border:1px dashed #d9d1e4;border-radius:13px;padding:45px 20px;text-align:center}
.empty h2{font-size:18px;margin:0 0 8px}
.empty p{font-size:11px;color:var(--muted);line-height:1.7}
.empty a{display:inline-block;background:var(--purple);color:white;border-radius:8px;padding:12px 17px;font-size:11px;font-weight:800}
.footer{border-top:1px solid var(--border);background:white;padding:25px 5%;text-align:center;color:var(--muted);font-size:10px}
.footer a{color:var(--purple);margin:0 8px}
@media(max-width:850px){
  .layout{grid-template-columns:1fr}
  .summary{position:static}
}
@media(max-width:600px){
  .topbar{height:62px;padding:0 14px}
  .brand{font-size:20px}
  .nav{gap:10px;font-size:10px}
  .nav a:not(:last-child){display:none}
  .container{padding:23px 13px 40px}
  .heading h1{font-size:23px}
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .panel-body{padding:15px}
}
</style>
</head>
<body>

<header class="topbar">
<a href="dashboard.html" class="brand">
<svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
<path d="M9 19L20 29L31 9L43 29L55 19L50 46H14L9 19Z" fill="#D6A62E" stroke="#B98716" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M14 51H50" stroke="#D6A62E" stroke-width="5" stroke-linecap="round"/>
<circle cx="9" cy="17" r="4" fill="#E9C35D"/>
<circle cx="31" cy="8" r="4" fill="#E9C35D"/>
<circle cx="55" cy="17" r="4" fill="#E9C35D"/>
</svg>
EarnGig
</a>
<nav class="nav">
<a href="marketplace.html">Marketplace</a>
<a href="cart.html">Cart</a>
<a href="buyer-orders.html">My Purchases</a>
</nav>
</header>

<main class="container">
<div class="heading">
<h1>Checkout</h1>
<p>Confirm your delivery information and review your payment before placing your order.</p>
</div>
<div id="checkoutContent"></div>
</main>

<footer class="footer">
<p>EarnGig Marketplace</p>
<a href="about.html">About</a>
<a href="help.html">Help</a>
<a href="terms.html">Terms</a>
<a href="privacy.html">Privacy</a>
<a href="contact.html">Contact</a>
</footer>

<script>
const CART_KEY = "earngig_cart";
const DRAFT_KEY = "earngig_checkout_draft";
const USER_EMAIL_KEY = "earngig_current_user_email";
const SERVICE_CHARGE = 100;

function readJSON(key,fallback){
  try{
    const value = JSON.parse(localStorage.getItem(key));
    return value ?? fallback;
  }catch(error){
    return fallback;
  }
}

function money(value){
  return "₦" + (Number(value)||0).toLocaleString("en-NG",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

function getCart(){
  const cart = readJSON(CART_KEY,[]);
  return Array.isArray(cart) ? cart : [];
}

function sellerKey(item){
  return String(
    item.sellerId ||
    item.sellerEmail ||
    item.vendorId ||
    item.vendorEmail ||
    item.sellerName ||
    "unknown-seller"
  ).trim().toLowerCase();
}

function groupCart(cart){
  const groups = new Map();

  cart.forEach(item=>{
    const key = sellerKey(item);

    if(!groups.has(key)){
      groups.set(key,{
        sellerKey:key,
        sellerId:item.sellerId || item.vendorId || "",
        sellerEmail:item.sellerEmail || item.vendorEmail || "",
        sellerName:item.sellerName || item.storeName || "EarnGig Seller",
        location:item.location || item.sellerLocation || "",
        items:[]
      });
    }

    groups.get(key).items.push(item);
  });

  return Array.from(groups.values());
}

function getSubtotal(cart){
  return cart.reduce((sum,item)=>{
    const price = Number(item.price) || 0;
    const quantity = Math.max(1,Number(item.quantity)||1);
    return sum + price * quantity;
  },0);
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,char=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function createReference(prefix){
  return prefix + "-" + Date.now().toString(36).toUpperCase() +
    "-" + Math.random().toString(36).slice(2,7).toUpperCase();
}

function renderCheckout(){
  const cart = getCart();
  const container = document.getElementById("checkoutContent");

  if(!cart.length){
    container.innerHTML = `
      <div class="empty">
        <h2>Your cart is empty</h2>
        <p>Add products to your cart before proceeding to checkout.</p>
        <a href="marketplace.html">Explore Marketplace</a>
      </div>`;
    return;
  }

  const subtotal = getSubtotal(cart);
  const total = subtotal + SERVICE_CHARGE;
  const groups = groupCart(cart);
  const email = localStorage.getItem(USER_EMAIL_KEY) || "";

  let vendorHTML = "";

  groups.forEach(group=>{
    const sellerSubtotal = group.items.reduce((sum,item)=>{
      return sum + (Number(item.price)||0) *
        Math.max(1,Number(item.quantity)||1);
    },0);

    vendorHTML += `
      <div class="vendor-block">
        <div class="vendor-title">
          Seller: ${escapeHTML(group.sellerName)}
        </div>
        ${group.items.map(item=>{
          const quantity = Math.max(1,Number(item.quantity)||1);
          const price = Number(item.price)||0;
          const image = item.image || item.imageUrl || "";

          return `
            <div class="order-item">
              <img src="${escapeHTML(image)}" alt=""
                onerror="this.style.visibility='hidden'">
              <div class="item-info">
                <strong>${escapeHTML(item.name || item.title || "Product")}</strong>
                <span>Quantity: ${quantity} × ${money(price)}</span>
              </div>
              <div class="item-total">${money(price*quantity)}</div>
            </div>`;
        }).join("")}
        <div style="text-align:right;font-size:10px;font-weight:800;margin-top:10px">
          Seller subtotal: ${money(sellerSubtotal)}
        </div>
      </div>`;
  });

  container.innerHTML = `
    <div class="layout">
      <div>
        <div class="notice">
          Your cart is grouped into separate vendor orders. Products from the same seller stay together. Products from different sellers receive separate order references after successful payment verification.
        </div>

        <section class="panel">
          <div class="panel-head">
            <h2>Delivery Information</h2>
            <p>Enter the address and contact details where your orders should be delivered.</p>
          </div>
          <div class="panel-body">
            <form id="deliveryForm">
              <div class="form-grid">
                <div class="field">
                  <label for="fullName">Full Name *</label>
                  <input id="fullName" name="fullName" required maxlength="100" placeholder="Your full name">
                </div>
                <div class="field">
                  <label for="phone">Phone Number *</label>
                  <input id="phone" name="phone" required type="tel" maxlength="20" placeholder="Your phone number">
                </div>
                <div class="field full">
                  <label for="email">Email Address *</label>
                  <input id="email" name="email" required type="email" maxlength="120" placeholder="Your email address" value="${escapeHTML(email)}">
                </div>
                <div class="field">
                  <label for="state">State *</label>
                  <input id="state" name="state" required maxlength="60" placeholder="Delivery state">
                </div>
                <div class="field">
                  <label for="city">City / Town *</label>
                  <input id="city" name="city" required maxlength="60" placeholder="City or town">
                </div>
                <div class="field full">
                  <label for="address">Full Delivery Address *</label>
                  <textarea id="address" name="address" required maxlength="500" placeholder="House number, street, area and other directions"></textarea>
                </div>
                <div class="field full">
                  <label for="deliveryInstructions">Additional Delivery Instructions (Optional)</label>
                  <textarea id="deliveryInstructions" name="deliveryInstructions" maxlength="300" placeholder="Useful information for the seller or delivery rider"></textarea>
                </div>
              </div>
            </form>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Products in Your Checkout</h2>
            <p>Each seller's products are grouped into one vendor order.</p>
          </div>
          <div class="panel-body">${vendorHTML}</div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Payment Method</h2>
            <p>Online payment will be enabled when the secure payment connection is ready.</p>
          </div>
          <div class="panel-body">
            <div class="notice" style="margin:0">
              <strong>Paystack connection pending.</strong><br>
              This checkout can save your details as a draft, but it cannot accept or verify real payments yet.
            </div>
          </div>
        </section>
      </div>

      <aside class="summary">
        <h2>Payment Summary</h2>
        <div class="summary-row">
          <span>Products subtotal</span>
          <strong>${money(subtotal)}</strong>
        </div>
        <div class="summary-row">
          <span>EarnGig service charge</span>
          <strong>${money(SERVICE_CHARGE)}</strong>
        </div>
        <div class="summary-row">
          <span>Delivery fee</span>
          <strong>Separate</strong>
        </div>
        <div class="summary-row total">
          <span>Total payable when payment is enabled</span>
          <strong>${money(total)}</strong>
        </div>

        <div class="charge-note">
          <strong>Fixed ₦100 service charge</strong><br>
          Charged only once for the entire checkout, regardless of the number of products or sellers.
        </div>

        <div class="delivery-note">
          <strong>Delivery fee is separate</strong><br>
          Delivery charges are not included in this payment summary. They are handled separately according to EarnGig delivery rules.
        </div>

        <label class="confirm-row">
          <input type="checkbox" id="confirmTerms">
          <span>I confirm that my delivery details are correct and I understand the EarnGig order and delivery process.</span>
        </label>

        <button class="pay-btn" id="payButton" type="button">
          Save Checkout Details
        </button>

        <div class="secure">
          Saving this draft does not charge you, confirm an order, or notify a seller. Orders must only be activated after secure payment verification.
        </div>
      </aside>
    </div>
  `;

  document.getElementById("payButton").addEventListener("click",saveCheckoutDraft);
}

function saveCheckoutDraft(){
  const form = document.getElementById("deliveryForm");

  if(!form.reportValidity()) return;

  if(!document.getElementById("confirmTerms").checked){
    alert("Please confirm your delivery details and order terms.");
    return;
  }

  const cart = getCart();

  if(!cart.length){
    alert("Your cart is empty.");
    window.location.href = "cart.html";
    return;
  }

  const groups = groupCart(cart);
  const subtotal = getSubtotal(cart);
  const checkoutReference = createReference("EG-CHECKOUT");

  const delivery = {
    fullName:document.getElementById("fullName").value.trim(),
    phone:document.getElementById("phone").value.trim(),
    email:document.getElementById("email").value.trim(),
    state:document.getElementById("state").value.trim(),
    city:document.getElementById("city").value.trim(),
    address:document.getElementById("address").value.trim(),
    instructions:document.getElementById("deliveryInstructions").value.trim()
  };

  const vendorOrders = groups.map(group=>{
    const vendorSubtotal = group.items.reduce((sum,item)=>{
      return sum + (Number(item.price)||0) *
        Math.max(1,Number(item.quantity)||1);
    },0);

    return {
      reference:createReference("EG-VENDOR"),
      checkoutReference:checkoutReference,
      sellerKey:group.sellerKey,
      sellerId:group.sellerId,
      sellerEmail:group.sellerEmail,
      sellerName:group.sellerName,
      items:group.items,
      subtotal:vendorSubtotal,
      delivery:delivery,
      deliveryFee:"to_be_calculated_separately",
      paymentStatus:"not_started",
      orderStatus:"awaiting_payment",
      createdAt:new Date().toISOString()
    };
  });

  const draft = {
    reference:checkoutReference,
    items:cart,
    vendorOrders:vendorOrders,
    vendorOrderCount:vendorOrders.length,
    subtotal:subtotal,
    serviceCharge:SERVICE_CHARGE,
    total:subtotal + SERVICE_CHARGE,
    deliveryFee:"negotiated_separately",
    delivery:delivery,
    paymentMethod:"paystack",
    paymentStatus:"not_started",
    orderStatus:"awaiting_payment",
    createdAt:new Date().toISOString()
  };

  localStorage.setItem(DRAFT_KEY,JSON.stringify(draft));

  alert(
    "Your checkout details have been saved successfully. " +
    vendorOrders.length + " separate vendor order reference(s) have been prepared. " +
    "No payment has been taken and no confirmed order has been sent to sellers because Paystack verification is not connected yet."
  );
}

renderCheckout();
</script>

</body>
</html>
